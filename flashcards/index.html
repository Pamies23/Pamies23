<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repaso">
<meta name="theme-color" content="#e9edf7">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Repaso</title>
<style>
:root{
  --text:#0a0b10; --text2:rgba(28,30,44,.62); --text3:rgba(28,30,44,.38);
  --bg:#e9edf7;
  --glass:rgba(255,255,255,.44); --glass-strong:rgba(255,255,255,.68); --glass-thin:rgba(255,255,255,.24);
  --rim-a:rgba(255,255,255,.95); --rim-b:rgba(255,255,255,.18);
  --inner-hi:rgba(255,255,255,.75); --inner-lo:rgba(0,0,0,.04);
  --shadow:0 12px 32px rgba(40,50,90,.13),0 2px 6px rgba(40,50,90,.07);
  --shadow-lg:0 24px 60px rgba(40,50,90,.20),0 4px 14px rgba(40,50,90,.08);
  --sep:rgba(60,60,80,.12);
  --fill:rgba(118,118,128,.12);
  --accent:#0a84ff; --red:#ff3b30; --orange:#ff9500; --green:#30c35a; --blue:#0a84ff; --purple:#8e5cf7;
  --blob1:#7fb4ff; --blob2:#ffb7d5; --blob3:#9ff0d2; --blob4:#c9b6ff;
  --backdrop:rgba(20,24,40,.22); --sheet:rgba(247,248,253,.8);
  --blur:26px;
  --ease-spring:cubic-bezier(.32,1.28,.54,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --text:#f5f6fa; --text2:rgba(235,237,250,.62); --text3:rgba(235,237,250,.36);
    --bg:#06070c;
    --glass:rgba(255,255,255,.085); --glass-strong:rgba(255,255,255,.14); --glass-thin:rgba(255,255,255,.05);
    --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04);
    --inner-hi:rgba(255,255,255,.18); --inner-lo:rgba(0,0,0,.25);
    --shadow:0 12px 32px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.3);
    --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24);
    --blob1:#1d4fd8; --blob2:#9d1d6b; --blob3:#0b7a62; --blob4:#5b2bc2;
    --backdrop:rgba(0,0,0,.45); --sheet:rgba(30,32,44,.84);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --text:#f5f6fa; --text2:rgba(235,237,250,.62); --text3:rgba(235,237,250,.36);
  --bg:#06070c;
  --glass:rgba(255,255,255,.085); --glass-strong:rgba(255,255,255,.14); --glass-thin:rgba(255,255,255,.05);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04);
  --inner-hi:rgba(255,255,255,.18); --inner-lo:rgba(0,0,0,.25);
  --shadow:0 12px 32px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.3);
  --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24);
  --blob1:#1d4fd8; --blob2:#9d1d6b; --blob3:#0b7a62; --blob4:#5b2bc2;
  --backdrop:rgba(0,0,0,.45); --sheet:rgba(30,32,44,.84);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block;flex:none}

/* ---------- fondo vivo ---------- */
.bg{position:fixed;inset:-20%;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.85;will-change:transform}
.bg .b1{background:radial-gradient(circle,var(--blob1) 0,transparent 62%);left:-10%;top:-8%;animation:drift1 26s ease-in-out infinite alternate}
.bg .b2{background:radial-gradient(circle,var(--blob2) 0,transparent 62%);right:-18%;top:12%;animation:drift2 32s ease-in-out infinite alternate}
.bg .b3{background:radial-gradient(circle,var(--blob3) 0,transparent 62%);left:-12%;bottom:-14%;animation:drift3 29s ease-in-out infinite alternate}
.bg .b4{background:radial-gradient(circle,var(--blob4) 0,transparent 62%);right:-10%;bottom:-6%;animation:drift1 35s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-14vw,14vh) scale(.92)}}
@keyframes drift3{to{transform:translate(10vw,-12vh) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

/* ---------- vidrio ---------- */
.glass{
  position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);
  box-shadow:var(--shadow),inset 0 1px 1px var(--inner-hi),inset 0 -1px 1px var(--inner-lo);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--rim-a),var(--rim-b) 32%,var(--rim-b) 68%,var(--rim-a));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass.strong{background:var(--glass-strong)}
.glass.thin{background:var(--glass-thin)}
.press{transition:transform .35s var(--ease-spring),filter .2s,opacity .2s}
.press:active{transform:scale(.955);filter:brightness(1.06)}

/* ---------- estructura ---------- */
#scroller{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
#view{padding:calc(env(safe-area-inset-top) + 58px) 16px calc(env(safe-area-inset-bottom) + 110px);max-width:620px;margin:0 auto}
.edge-top{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 64px);z-index:5;pointer-events:none;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask:linear-gradient(#000 45%,transparent);mask:linear-gradient(#000 45%,transparent);
  opacity:0;transition:opacity .25s}
.edge-top.on{opacity:1}
#topbar{position:fixed;z-index:6;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 16px 0;display:flex;align-items:center;gap:10px;pointer-events:none;max-width:652px;margin:0 auto}
#topbar > *{pointer-events:auto}
#topbar .tb-title{flex:1;text-align:center;font-weight:650;font-size:17px;opacity:0;transform:translateY(6px);transition:.25s var(--ease-out);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#topbar.scrolled .tb-title{opacity:1;transform:none}
.tb-slot{display:flex;gap:10px;min-width:44px}
.tb-slot.r{justify-content:flex-end}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.circle svg{width:21px;height:21px}

.lt{margin:4px 2px 18px}
.lt h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:800}
.lt p{margin:4px 0 0;color:var(--text2);font-size:15px;font-weight:500}
.lt.deck{display:flex;align-items:center;gap:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec h2{font-size:21px;font-weight:750;letter-spacing:-.01em;margin:0}
.sec button{color:var(--accent);font-size:15px;font-weight:600}
.muted{color:var(--text2)}
.hint{color:var(--text2);font-size:13px;margin:8px 16px 0;line-height:1.4}

/* ---------- tab bar ---------- */
.tabs{position:fixed;z-index:8;left:16px;bottom:max(14px,calc(env(safe-area-inset-bottom) - 10px));display:flex;gap:10px;align-items:center;right:16px;justify-content:center;pointer-events:none}
.tabs > *{pointer-events:auto}
#tabbar{background:var(--glass-strong);border-radius:32px;display:flex;padding:5px;gap:2px;flex:1;max-width:330px}
.tab{flex:1;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text2);transition:color .25s,background .35s var(--ease-out);position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent);background:var(--fill)}
#searchBtn{width:64px;height:64px;background:var(--glass-strong)}
#searchBtn svg{width:24px;height:24px}
body.stack .tab.on{background:transparent}

/* ---------- héroe ---------- */
.hero{border-radius:30px;padding:20px 20px 18px}
.hero-top{display:flex;align-items:center;gap:16px}
.hero .big{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:15px;color:var(--text2);font-weight:600;margin-top:4px}
.ring{margin-left:auto;position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:750;font-size:17px;font-variant-numeric:tabular-nums}
.ring .pct small{display:block;font-size:10px;color:var(--text2);font-weight:600;text-align:center;margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:var(--fill);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.c-new{color:var(--blue)} .c-learn{color:var(--red)} .c-rev{color:var(--green)}
.btn{height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;width:100%}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(0,0,0,.12)}
.btn.primary.off{background:var(--fill);color:var(--text2);box-shadow:none}
.btn.sm{height:44px;font-size:15px;border-radius:22px}
.hero .btn{margin-top:16px}
.streak{display:inline-flex;align-items:center;gap:4px;color:var(--orange)}
.streak svg{width:15px;height:15px}

/* ---------- mazos ---------- */
.decks{display:flex;flex-direction:column;gap:10px}
.deck-row{border-radius:24px;padding:12px 12px 12px 12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.tile{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;position:relative;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));
  box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent),inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.12)}
.tile.lg{width:64px;height:64px;border-radius:20px;font-size:34px}
.deck-info{flex:1;min-width:0}
.deck-name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-sub{font-size:13px;color:var(--text2);margin-top:2px;display:flex;gap:10px;font-variant-numeric:tabular-nums;font-weight:600}
.deck-sub span{display:inline-flex;align-items:center;gap:4px}
.deck-sub .z{color:var(--text3)}
.play{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--accent)}
.play svg{width:17px;height:17px;margin-left:2px}
.play.done{color:var(--green)}
.play.done svg{margin:0}
.empty{border-radius:26px;padding:28px 22px;text-align:center}
.empty .e{font-size:42px}
.empty h3{margin:10px 0 6px;font-size:19px}
.empty p{margin:0 0 16px;color:var(--text2);font-size:15px;line-height:1.4}

.banner{border-radius:22px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:center;margin-bottom:14px;font-size:14px;line-height:1.35}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner .x{margin-left:auto;align-self:flex-start;color:var(--text2)}
.banner .x svg{width:18px;height:18px}

/* ---------- detalle de mazo ---------- */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mini{border-radius:20px;padding:12px 12px 11px}
.mini .n{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini .l{font-size:12px;font-weight:650;color:var(--text2);margin-top:1px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.act{border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:650}
.act svg{width:22px;height:22px;color:var(--accent)}
.search{border-radius:16px;display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--text2)}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;height:100%;min-width:0}
.list{border-radius:24px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 16px;width:100%;text-align:left;position:relative}
.item + .item::after{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.item:active{background:var(--fill)}
.item .t{flex:1;min-width:0}
.item .f{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .b{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{font-size:12px;font-weight:650;padding:4px 8px;border-radius:99px;background:var(--fill);color:var(--text2);white-space:nowrap;flex:none}
.tag.new{color:var(--blue)} .tag.learn{color:var(--red)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:6px}
.fchip.on{background:var(--accent);color:#fff}
.fchip.on::before{display:none}

/* ---------- grupos estilo ajustes ---------- */
.group{border-radius:24px;overflow:hidden}
.group + .group{margin-top:0}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;position:relative;width:100%;text-align:left}
.row + .row::after{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.row .rl{flex:1;font-size:16px}
.row .rv{color:var(--text2);font-size:16px}
.row .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.row .ic svg{width:18px;height:18px}
.row.danger{color:var(--red)}
.row .chev{color:var(--text3);width:16px;height:16px}
.gtitle{font-size:13px;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin:26px 16px 8px}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:12px;height:34px}
.stepper button{width:40px;height:34px;display:grid;place-items:center}
.stepper button svg{width:16px;height:16px}
.stepper span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .35s var(--ease-spring)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:10px;font-size:14px;font-weight:600;padding:0 12px;transition:background .25s}
.seg button.on{background:var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.howto{padding:14px 16px;font-size:14px;line-height:1.45;color:var(--text2)}
.howto .r{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.howto .k{flex:none;width:74px;font-weight:700;font-size:13px;padding:3px 0;border-radius:8px;text-align:center;color:#fff}

/* ---------- estadísticas ---------- */
.card-p{border-radius:26px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border-radius:22px;padding:14px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .n small{font-size:15px;font-weight:700;color:var(--text2);margin-left:2px}
.kpi .l{font-size:13px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .l svg{width:14px;height:14px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--fill)}
.heat i.l1{background:color-mix(in srgb,var(--green) 35%,transparent)}
.heat i.l2{background:color-mix(in srgb,var(--green) 58%,transparent)}
.heat i.l3{background:color-mix(in srgb,var(--green) 80%,transparent)}
.heat i.l4{background:var(--green)}
.heat i.fut{background:transparent}
.heat i.today{outline:2px solid var(--accent);outline-offset:-1px}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:10px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar .v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .col{width:100%;border-radius:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));min-height:3px}
.bar .col.z{background:var(--fill)}
.bar .d{font-size:12px;color:var(--text2);font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--fill);gap:2px}
.stack i{display:block}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px;font-size:14px}
.lg span{display:flex;align-items:center;gap:7px}
.lg b{margin-left:auto;font-variant-numeric:tabular-nums}
.lg .sw{width:10px;height:10px;border-radius:3px}

/* ---------- estudio ---------- */
#study{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 12px)}
body.studying #study{display:flex}
body.studying #scroller,body.studying .tabs,body.studying #topbar,body.studying .edge-top{display:none}
.st-top{display:flex;align-items:center;gap:10px}
.deck-pill{flex:1;min-width:0;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:650;font-size:16px;padding:0 14px;max-width:260px;margin:0 auto}
.deck-pill .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-pill svg{width:14px;height:14px;color:var(--text2)}
.counts{display:flex;justify-content:center;gap:16px;margin:14px 0 10px;font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.counts span{display:flex;align-items:center;gap:5px;opacity:.9}
.counts .cur{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 24px 14px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s var(--ease-out)}
.stage{flex:1;display:flex;min-height:0;perspective:1400px}
.fc{flex:1;border-radius:34px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow-lg),inset 0 1px 1px var(--inner-hi),inset 0 -1px 1px var(--inner-lo);transition:transform .2s ease-in}
.fc.in{animation:cardIn .45s var(--ease-spring)}
@keyframes cardIn{from{transform:translateY(26px) scale(.96);opacity:0}}
.fc.turn1{transform:rotateY(88deg);transition:transform .16s ease-in}
.fc.turn2{animation:turnBack .34s var(--ease-spring)}
@keyframes turnBack{from{transform:rotateY(-88deg)}}
.fc-head{display:flex;align-items:center;gap:8px;padding:14px 14px 0 18px;min-height:52px}
.fc-deck{font-size:13px;font-weight:650;color:var(--text2);display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.fc-deck span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-deck .sq{width:8px;height:8px;border-radius:3px;flex:none}
.fc-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text2)}
.fc-btn svg{width:18px;height:18px}
.fc-body{flex:1;overflow-y:auto;padding:10px 26px 26px;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.fc-body .inner{margin:auto 0;width:100%}
.q{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.28;text-align:center;overflow-wrap:anywhere}
.q.m{font-size:21px}.q.s{font-size:18px;font-weight:650;text-align:left}
.a{font-size:22px;font-weight:500;line-height:1.4;text-align:center;overflow-wrap:anywhere}
.a.m{font-size:19px}.a.s{font-size:17px;text-align:left}
.q.small{font-size:16px;font-weight:600;color:var(--text2);text-align:center}
.divider{height:1px;background:var(--sep);margin:18px 10% 18px}
.fc code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--fill);padding:1px 5px;border-radius:6px}
.tap-hint{text-align:center;color:var(--text3);font-size:13px;font-weight:600;padding:0 0 16px}
.st-bottom{padding-top:14px}
.reveal{height:62px;border-radius:31px;font-size:18px;font-weight:700;width:100%}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ans{height:74px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:color-mix(in srgb,var(--c) 20%,var(--glass));color:var(--text)}
.ans .al{font-weight:750;font-size:15px}
.ans .ai{font-size:13px;font-weight:650;color:color-mix(in srgb,var(--c) 75%,var(--text));font-variant-numeric:tabular-nums}
.ans::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c);opacity:.9}
.answers.popin .ans{animation:pop .42s var(--ease-spring) backwards}
.answers.popin .ans:nth-child(2){animation-delay:.03s}.answers.popin .ans:nth-child(3){animation-delay:.06s}.answers.popin .ans:nth-child(4){animation-delay:.09s}
@keyframes pop{from{transform:translateY(14px) scale(.9);opacity:0}}
.done{flex:1;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:6px;animation:cardIn .5s var(--ease-spring)}
.done .badge{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-bottom:10px;
  background:linear-gradient(145deg,#6ee7a0,var(--green));box-shadow:0 14px 34px color-mix(in srgb,var(--green) 45%,transparent),inset 0 2px 2px rgba(255,255,255,.6)}
.done .badge svg{width:44px;height:44px;stroke-width:2.6}
.done h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.done p{margin:0;color:var(--text2);font-size:15px;line-height:1.45}
.done .sum{display:flex;gap:10px;margin:18px 0 8px;width:100%}
.done .sum div{flex:1;border-radius:18px;background:var(--fill);padding:10px 4px}
.done .sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.done .sum span{font-size:12px;color:var(--text2);font-weight:600}
.done .btn{margin-top:8px;max-width:320px}
.wait{font-weight:650;color:var(--text);margin-top:4px}

/* ---------- hojas / menús ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--backdrop);opacity:0;transition:opacity .3s}
.backdrop.on{opacity:1}
.sheet{position:fixed;z-index:41;left:8px;right:8px;bottom:calc(8px + var(--kb,0px));max-width:620px;margin:0 auto;border-radius:34px;
  max-height:calc(100% - env(safe-area-inset-top) - 24px - var(--kb,0px));display:flex;flex-direction:column;
  transform:translateY(110%);transition:transform .45s var(--ease-out),bottom .25s;background:var(--sheet);box-shadow:var(--shadow-lg),inset 0 1px 1px var(--inner-hi)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:8px auto 0;flex:none;opacity:.6}
.sh-head{display:flex;align-items:center;gap:10px;padding:8px 12px 6px;flex:none}
.sh-head h3{flex:1;text-align:center;margin:0;font-size:17px;font-weight:700}
.sh-head .circle{width:40px;height:40px;background:var(--fill)}
.sh-head .circle.ok{background:var(--accent);color:#fff}
.sh-head .circle.ok.dis{opacity:.35;pointer-events:none}
.sh-body{overflow-y:auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
.field{background:var(--fill);border-radius:18px;padding:10px 14px 12px;margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.field textarea,.field input,.field select{width:100%;background:none;border:0;outline:0;font-size:17px;resize:none;line-height:1.35;padding:0}
.field textarea{min-height:64px}
.field select{height:28px;-webkit-appearance:none;appearance:none}
.pick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:none;height:36px;padding:0 12px;border-radius:18px;background:var(--glass);font-size:14px;font-weight:650;display:flex;align-items:center;gap:6px;border:1.5px solid transparent}
.pick button.on{border-color:var(--accent);color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emojis button{aspect-ratio:1;border-radius:14px;font-size:24px;background:var(--glass);border:2px solid transparent}
.emojis button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--glass))}
.colors{display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 1px 1px rgba(255,255,255,.6);display:grid;place-items:center;color:#fff}
.colors button svg{width:18px;height:18px;stroke-width:3;opacity:0}
.colors button.on svg{opacity:1}
.sh-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.danger{background:var(--fill);color:var(--red)}
.meta{font-size:13px;color:var(--text2);line-height:1.5;margin:4px 4px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.meta b{color:var(--text);font-variant-numeric:tabular-nums}
.pop{position:fixed;z-index:45;min-width:230px;max-width:calc(100% - 32px);border-radius:24px;padding:6px;background:var(--glass-strong);
  transform-origin:top center;transform:scale(.85);opacity:0;transition:transform .35s var(--ease-spring),opacity .2s;max-height:60vh;overflow-y:auto;background:var(--sheet)}
.pop.on{transform:none;opacity:1}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:16px;text-align:left;font-size:16px;font-weight:550}
.pop button:active{background:var(--fill)}
.pop .em{font-size:20px;width:26px;text-align:center}
.pop .sub{margin-left:auto;font-size:13px;color:var(--text2);font-weight:650;font-variant-numeric:tabular-nums;padding-left:12px}
.pop .on{color:var(--accent)}
.pop hr{border:0;height:.5px;background:var(--sep);margin:4px 10px}
.alert{position:fixed;z-index:46;left:50%;top:50%;width:min(300px,calc(100% - 48px));transform:translate(-50%,-50%) scale(1.12);opacity:0;transition:transform .35s var(--ease-spring),opacity .2s;border-radius:30px;padding:22px 18px 16px;text-align:center;background:var(--sheet)}
.alert.on{transform:translate(-50%,-50%);opacity:1}
.alert h3{margin:0 0 6px;font-size:18px}
.alert p{margin:0 0 16px;font-size:14px;color:var(--text2);line-height:1.4}
.alert .ab{display:flex;gap:8px}
.alert .ab .btn{height:46px;font-size:16px}
.toast{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);transition:transform .45s var(--ease-spring);border-radius:24px;padding:12px 18px;font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px;background:var(--glass-strong);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;color:var(--green)}

.view-in{animation:viewIn .42s var(--ease-out)}
.view-back{animation:viewBack .42s var(--ease-out)}
@keyframes viewIn{from{transform:translateX(40px);opacity:0}}
@keyframes viewBack{from{transform:translateX(-40px);opacity:0}}
.fade-in{animation:fadeIn .35s var(--ease-out)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (min-width:700px){.answers{max-width:620px;margin:0 auto}.stage,.st-bottom,.counts,.prog{width:100%;max-width:620px;margin-left:auto;margin-right:auto}}
</style>

<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<main id="scroller"><div id="view"></div></main>
<div class="edge-top" id="edge"></div>
<div id="topbar"></div>
<div class="tabs">
  <nav id="tabbar" class="glass"></nav>
  <button id="searchBtn" class="glass circle press" aria-label="Buscar"></button>
</div>
<section id="study"></section>
<div id="layer"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* =========================================================
   Constantes y utilidades
   ========================================================= */
const MIN=6e4, HOUR=36e5, DAY=864e5, DAY_START_H=4;
const LEARN=[1,10], RELEARN=[1,10], LEARN_AHEAD=20*MIN, MAX_IVL=36500;
const KEY='repaso.v1';
const COLORS=['#0a84ff','#5e5ce6','#bf5af2','#ff375f','#ff9f0a','#30c35a','#32ade6','#8e8e93'];
const EMOJIS=['📈','🇬🇧','🏛️','📚','🧠','💼','⚖️','🧪','🌍','💡','🗣️','🧮','📊','🏦','✈️','🎯','🩺','🎓'];
const LANGS=[['','Sin voz'],['en-GB','Inglés (UK)'],['en-US','Inglés (US)'],['es-ES','Español'],['fr-FR','Francés'],['de-DE','Alemán'],['it-IT','Italiano'],['pt-PT','Portugués']];
const RATINGS=[
  {r:1,label:'Otra vez',c:'var(--red)'},
  {r:2,label:'Difícil',c:'var(--orange)'},
  {r:3,label:'Bien',c:'var(--green)'},
  {r:4,label:'Fácil',c:'var(--blue)'}
];

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtText=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dayStart(ts=Date.now()){const d=new Date(ts-DAY_START_H*HOUR);d.setHours(DAY_START_H,0,0,0);return d.getTime()}
function addDays(ts,n){const d=new Date(ts);d.setDate(d.getDate()+n);return d.getTime()}
function dayKey(ts=Date.now()){const d=new Date(ts-DAY_START_H*HOUR);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDays(d){
  if(d<1)return '<1 d';
  if(d<30)return Math.round(d)+' d';
  if(d<365){const m=d/30.4;return (m<10?m.toFixed(1).replace('.0',''):Math.round(m)).toString().replace('.',',')+' m'}
  const y=d/365;return y.toFixed(1).replace('.0','').replace('.',',')+' a';
}
function fmtMins(m){return m<60?Math.max(1,Math.round(m))+' min':(m/60).toFixed(1).replace('.0','').replace('.',',')+' h'}
function plural(n,s,p){return n+' '+(n===1?s:p)}

const ICONS={
  home:'<path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/>',
  chart:'<path d="M5 20V12M10 20V5M15 20v-9M20 20V8"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
  search:'<circle cx="11" cy="11" r="6.8"/><path d="m20 20-4.2-4.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  chevR:'<path d="m9 5 7 7-7 7"/>',
  chevL:'<path d="m15 4.5-7.5 7.5 7.5 7.5"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  play:'<path d="M7.5 4.8v14.4a.8.8 0 0 0 1.2.7l11.4-7.2a.8.8 0 0 0 0-1.4L8.7 4.1a.8.8 0 0 0-1.2.7z" fill="currentColor" stroke="none"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  speaker:'<path d="M11 5 6.5 9H3.5v6h3L11 19z" fill="currentColor"/><path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4M18.3 6a8.6 8.6 0 0 1 0 12"/>',
  edit:'<path d="M4 20h4L19.2 8.8a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16z"/><path d="m13.5 6.5 4 4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5l1-12.5M9 7V4.5h6V7"/>',
  share:'<path d="M12 15V3.5m0 0-4 4m4-4 4 4"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/>',
  tray:'<path d="M12 3.5V14m0 0-4-4m4 4 4-4"/><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/>',
  more:'<circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  flame:'<path d="M12 21c-4 0-7-2.7-7-6.4 0-3.3 2.4-5.2 3.4-8.4.5 1.9 1.4 3 2.6 3.7.3-3.2 1.9-5.7 4-6.9-.3 3.2 4 5.7 4 11.6 0 3.7-3 6.4-7 6.4z" fill="currentColor" stroke="none"/>',
  stack:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M7 5h10"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
  bolt:'<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/>'
};
const ic=(n,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[n]}</svg>`;

/* =========================================================
   Datos
   ========================================================= */
const DEFAULT_SETTINGS={newPerDay:20,showIntervals:true,theme:'auto',installHidden:false};
let S=load();

function newCard(deckId,front,back,offset=0){
  return {id:uid(),deckId,front:front.trim(),back:back.trim(),created:Date.now()+offset,state:'new',due:0,ivl:0,ease:2.5,step:0,reps:0,lapses:0};
}
function seed(){
  const cfa={id:uid(),name:'CFA',emoji:'📈',color:'#0a84ff',lang:'',created:Date.now()};
  const en={id:uid(),name:'English',emoji:'🇬🇧',color:'#bf5af2',lang:'en-GB',created:Date.now()+1};
  const bh={id:uid(),name:'B&H',emoji:'🏛️',color:'#ff9f0a',lang:'',created:Date.now()+2};
  const cards=[];let o=0;
  [
    ['¿Qué mide el **Sharpe ratio**?','Exceso de rentabilidad sobre la tasa libre de riesgo por unidad de riesgo total.\n`(Rp − Rf) / σp`'],
    ['**Treynor ratio**: fórmula','`(Rp − Rf) / βp`\nExceso de rentabilidad por unidad de riesgo sistemático.'],
    ['**CAPM**: fórmula','`E(Ri) = Rf + βi · [E(Rm) − Rf]`'],
    ['Riesgo sistemático vs. no sistemático','**Sistemático**: de mercado, no diversificable (lo mide la beta).\n**No sistemático**: específico de la empresa, se elimina diversificando.'],
    ['Duración modificada','`ModDur = MacDur / (1 + YTM/n)`\nAproxima el % de cambio del precio ante un cambio de 1 pp en el rendimiento.'],
    ['Paridad put-call (opciones europeas)','`C + PV(X) = P + S₀`\nMismo subyacente, strike y vencimiento.'],
    ['Coeficiente de variación','`CV = σ / media`\nRiesgo por unidad de rentabilidad esperada.'],
    ['Standard III(A) del Código Ético','**Loyalty, Prudence, and Care**: actuar en beneficio del cliente y anteponer sus intereses a los propios y a los del empleador.']
  ].forEach(([f,b])=>cards.push(newCard(cfa.id,f,b,o++)));
  [
    ['to take for granted','dar por sentado'],
    ['nevertheless','sin embargo, no obstante'],
    ['to be on the fence','estar indeciso'],
    ['shortfall','déficit, carencia'],
    ['to cut corners','hacer algo de forma chapucera para ahorrar tiempo o dinero'],
    ['bottleneck','cuello de botella'],
    ['to follow up','hacer seguimiento'],
    ['leverage (finance)','apalancamiento']
  ].forEach(([f,b])=>cards.push(newCard(en.id,f,b,o++)));
  return {v:1,decks:[cfa,en,bh],cards,log:[],settings:{...DEFAULT_SETTINGS},extra:{day:'',decks:{}}};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){}
  return seed();
}
function normalize(d){
  d.decks=Array.isArray(d.decks)?d.decks:[];d.cards=Array.isArray(d.cards)?d.cards:[];d.log=Array.isArray(d.log)?d.log:[];
  d.settings={...DEFAULT_SETTINGS,...(d.settings||{})};d.extra=d.extra||{day:'',decks:{}};d.v=1;return d;
}
function save(){
  if(S.log.length>60000)S.log=S.log.slice(-50000);
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar: almacenamiento lleno',false)}
}
const deckById=id=>S.decks.find(d=>d.id===id);
const cardById=id=>S.cards.find(c=>c.id===id);
const decksSorted=()=>[...S.decks].sort((a,b)=>a.created-b.created);

/* =========================================================
   Programación de repasos (tipo Anki / SM-2)
   ========================================================= */
function schedule(c,r,now,fuzz){
  const n={...c,reps:(c.reps||0)+1,last:now};
  if(c.state!=='review'){
    const relearn=c.state==='relearning';
    const steps=relearn?RELEARN:LEARN;
    const step=c.state==='new'?0:clamp(c.step||0,0,steps.length-1);
    const graduate=ivl=>{n.state='review';n.step=0;n.ivl=ivl;n.due=addDays(dayStart(now),ivl)};
    if(r===1){n.state=relearn?'relearning':'learning';n.step=0;n.due=now+steps[0]*MIN}
    else if(r===2){n.state=relearn?'relearning':'learning';n.step=step;
      const m=step===0&&steps.length>1?(steps[0]+steps[1])/2:steps[step]*1.5;n.due=now+m*MIN}
    else if(r===3){
      if(step+1>=steps.length)graduate(relearn?Math.max(1,c.ivl||1):1);
      else{n.state=relearn?'relearning':'learning';n.step=step+1;n.due=now+steps[step+1]*MIN}
    }
    else graduate(relearn?Math.max(2,(c.ivl||1)+1):4);
    return n;
  }
  const ivl=Math.max(1,c.ivl||1),ease=c.ease||2.5;
  const late=Math.max(0,Math.floor((dayStart(now)-c.due)/DAY));
  const hard=Math.max(ivl+1,Math.round(ivl*1.2));
  const good=Math.max(hard+1,Math.round((ivl+late/2)*ease));
  const easy=Math.max(good+1,Math.round((ivl+late)*ease*1.3));
  if(r===1){n.lapses=(c.lapses||0)+1;n.ease=Math.max(1.3,ease-.2);n.ivl=Math.max(1,Math.round(ivl*.2));n.state='relearning';n.step=0;n.due=now+RELEARN[0]*MIN;return n}
  let v=r===2?hard:r===3?good:easy;
  if(r===2)n.ease=Math.max(1.3,ease-.15);
  if(r===4)n.ease=ease+.15;
  if(fuzz&&v>=3){const f=Math.max(1,Math.round(v*.05));v+=Math.round((Math.random()*2-1)*f)}
  n.ivl=clamp(v,1,MAX_IVL);n.due=addDays(dayStart(now),n.ivl);
  return n;
}
function previewLabel(c,r,now){
  const n=schedule(c,r,now,false);
  return n.state==='review'?fmtDays(n.ivl):fmtMins((n.due-now)/MIN);
}
function introducedToday(now=Date.now()){
  const ds=dayStart(now),m={};
  for(let i=S.log.length-1;i>=0;i--){const e=S.log[i];if(e.t<ds)break;if(e.s==='new')m[e.d]=(m[e.d]||0)+1}
  return m;
}
function extraToday(deckId){return S.extra.day===dayKey()?(S.extra.decks[deckId]||0):0}
function newLimit(deckId,intro){return Math.max(0,S.settings.newPerDay+extraToday(deckId)-(intro[deckId]||0))}
function counts(deckIds,now=Date.now()){
  const set=new Set(deckIds),de=addDays(dayStart(now),1),intro=introducedToday(now);
  const nw={};let learn=0,review=0,total=0;
  for(const c of S.cards){
    if(!set.has(c.deckId))continue;total++;
    if(c.state==='new')nw[c.deckId]=(nw[c.deckId]||0)+1;
    else if(c.state==='review'){if(c.due<=now)review++}
    else if(c.due<de)learn++;
  }
  let n=0,newTotal=0;for(const id of deckIds){n+=Math.min(nw[id]||0,newLimit(id,intro));newTotal+=nw[id]||0}
  return {new:n,learn,review,total,newTotal,due:n+learn+review};
}

/* ---------- Inicio ---------- */
function streak(){
  const days=new Set(S.log.map(e=>dayKey(e.t)));
  let n=0,t=Date.now();
  if(!days.has(dayKey(t)))t=addDays(dayStart(t),-1)+HOUR;
  while(days.has(dayKey(t))){n++;t=addDays(dayStart(t),-1)+HOUR}
  return n;
}
function todayDone(){const ds=dayStart();let n=0;for(let i=S.log.length-1;i>=0&&S.log[i].t>=ds;i--)n++;return n}

/* ---------- Detalle de banco ---------- */
function stateTag(c){
  if(c.state==='new')return '<span class="tag new">Nueva</span>';
  if(c.state!=='review')return '<span class="tag learn">Aprendiendo</span>';
  const d=Math.round((c.due-dayStart())/DAY);
  return `<span class="tag">${d<=0?'Hoy':d===1?'Mañana':'En '+fmtDays(d)}</span>`;
}
function cardRows(list,showDeck){
  if(!list.length)return '';
  const max=400;
  return '<div class="list glass">'+list.slice(0,max).map(c=>{
    const d=showDeck&&deckById(c.deckId);
    return `<button class="item" data-card="${c.id}"><div class="t"><div class="f">${esc(c.front.replace(/\*\*|`/g,''))}</div><div class="b">${d?esc(d.emoji+' '+d.name)+' · ':''}${esc(c.back.replace(/\*\*|`/g,'').replace(/\n/g,' '))}</div></div>${stateTag(c)}</button>`}).join('')
    +'</div>'+(list.length>max?`<p class="hint">Mostrando ${max} de ${list.length}. Usa la búsqueda para afinar.</p>`:'');
}
function matches(c,q){if(!q)return true;q=q.toLowerCase();return c.front.toLowerCase().includes(q)||c.back.toLowerCase().includes(q)}

/* ---------- Progreso ---------- */
function vStats(){
  const now=Date.now(),ds=dayStart(now);
  const today=S.log.filter(e=>e.t>=ds);
  const mins=Math.round(today.reduce((a,e)=>a+(e.ms||0),0)/MIN);
  const since=ds-29*DAY;
  const revs=S.log.filter(e=>e.t>=since&&e.s==='review');
  const ret=revs.length?Math.round(revs.filter(e=>e.r>1).length/revs.length*100):null;
  const tAcc=today.length?Math.round(today.filter(e=>e.r>1).length/today.length*100):null;
  // heatmap
  const WEEKS=17,per={};for(const e of S.log){const k=dayKey(e.t);per[k]=(per[k]||0)+1}
  const td=new Date(ds);const dow=(td.getDay()+6)%7;// lunes=0
  const start=addDays(ds,-(WEEKS-1)*7-dow);
  let cells='';
  for(let i=0;i<WEEKS*7;i++){
    const t=addDays(start,i)+HOUR;
    if(t>ds+DAY){cells+='<i class="fut"></i>';continue}
    const n=per[dayKey(t)]||0;const l=n===0?0:n<10?1:n<30?2:n<60?3:4;
    cells+=`<i class="l${l} ${dayKey(t)===dayKey(now)?'today':''}" title="${n}"></i>`;
  }
  // previsión
  const fc=[];for(let i=0;i<7;i++){const a=addDays(ds,i),b=addDays(ds,i+1);fc.push(S.cards.filter(c=>c.state==='review'&&(i===0?c.due<b:c.due>=a&&c.due<b)).length+(i===0?S.cards.filter(c=>c.state==='learning'||c.state==='relearning').length:0))}
  const mx=Math.max(1,...fc);
  const dn=['Hoy',...Array.from({length:6},(_,i)=>new Intl.DateTimeFormat('es-ES',{weekday:'short'}).format(new Date(addDays(ds,i+1)+HOUR)).replace('.',''))];
  // madurez
  const m={n:0,l:0,y:0,m:0};for(const c of S.cards){if(c.state==='new')m.n++;else if(c.state!=='review')m.l++;else if(c.ivl<21)m.y++;else m.m++}
  const tot=S.cards.length||1;
  const seg=[['Nuevas',m.n,'var(--blue)'],['Aprendiendo',m.l,'var(--red)'],['Jóvenes',m.y,'#7dd88f'],['Maduras',m.m,'var(--green)']];
  const h=`<header class="lt"><h1>Progreso</h1><p>Tu constancia y lo que viene</p></header>
  <div class="kpis">
    <div class="kpi glass"><div class="l">${ic('flame','style="color:var(--orange)"')}Racha</div><div class="n">${streak()}<small>${streak()===1?'día':'días'}</small></div></div>
    <div class="kpi glass"><div class="l">${ic('stack','style="color:var(--accent)"')}Hoy</div><div class="n">${today.length}<small>repasos</small></div></div>
    <div class="kpi glass"><div class="l">${ic('clock','style="color:var(--purple)"')}Tiempo hoy</div><div class="n">${mins}<small>min</small></div></div>
    <div class="kpi glass"><div class="l">${ic('target','style="color:var(--green)"')}Retención 30 d</div><div class="n">${ret===null?'—':ret+'<small>%</small>'}</div></div>
  </div>
  ${tAcc!==null?`<p class="hint">Hoy has acertado el ${tAcc}% de las tarjetas.</p>`:''}
  <div class="gtitle">Actividad</div>
  <div class="card-p glass"><div class="heat">${cells}</div><div class="legend"><span>Hace ${WEEKS} semanas</span><span>Hoy</span></div></div>
  <div class="gtitle">Próximos 7 días</div>
  <div class="card-p glass"><div class="bars">${fc.map((v,i)=>`<div class="bar"><span class="v">${v}</span><div class="col ${v?'':'z'}" style="height:${Math.max(3,v/mx*100)}%"></div><span class="d">${dn[i]}</span></div>`).join('')}</div></div>
  <div class="gtitle">Estado de tus ${S.cards.length} tarjetas</div>
  <div class="card-p glass"><div class="stack">${seg.filter(s=>s[1]).map(s=>`<i style="flex:${s[1]/tot};background:${s[2]}"></i>`).join('')}</div>
  <div class="lg">${seg.map(s=>`<span><i class="sw" style="background:${s[2]}"></i>${s[0]}<b>${s[1]}</b></span>`).join('')}</div></div>
  <p class="hint">Jóvenes: intervalo menor de 21 días. Maduras: 21 días o más.</p>`;
  return {html:h,title:'Progreso'};
}

/* =========================================================
   Sesión de estudio
   ========================================================= */
let study=null,waitTimer=null;
const studyEl=$('#study');

function startStudy(deckIds){
  deckIds=deckIds.filter(id=>deckById(id));
  if(!deckIds.length)return;
  study={deckIds,cur:null,flipped:false,shownAt:0,hist:[],count:0,newShown:0,lastId:null,stats:{1:0,2:0,3:0,4:0},ms:0,startTotal:counts(deckIds).due};
  document.body.classList.add('studying');
  nextCard(true);
}
function endStudy(){
  clearInterval(waitTimer);study=null;
  document.body.classList.remove('studying');
  rerender();
}
function pickNext(){
  const now=Date.now(),set=new Set(study.deckIds),intro=introducedToday(now),day=dayKey(now);
  const learnDue=[],learnSoon=[],rev=[],newBy={};
  for(const c of S.cards){
    if(!set.has(c.deckId))continue;
    if(c.state==='new')(newBy[c.deckId]||=[]).push(c);
    else if(c.state==='review'){if(c.due<=now)rev.push(c)}
    else if(c.due<=now)learnDue.push(c);
    else if(c.due<=now+LEARN_AHEAD)learnSoon.push(c);
  }
  const news=[];
  for(const id of study.deckIds)news.push(...(newBy[id]||[]).sort((a,b)=>a.created-b.created).slice(0,newLimit(id,intro)));
  news.sort((a,b)=>a.created-b.created);
  learnDue.sort((a,b)=>a.due-b.due);learnSoon.sort((a,b)=>a.due-b.due);
  rev.sort((a,b)=>(hash(a.id+day)-hash(b.id+day)));
  const avoid=study.lastId,ok=c=>c.id!==avoid;
  let c=learnDue.find(ok);if(c)return c;
  const R=rev.filter(ok),N=news.filter(ok);
  if(R.length&&N.length){const share=N.length/(N.length+R.length);return study.newShown<share*(study.count+1)?N[0]:R[0]}
  if(R.length)return R[0];if(N.length)return N[0];
  c=learnSoon.find(ok);if(c)return c;
  return learnDue[0]||rev[0]||news[0]||learnSoon[0]||null;
}
function nextCard(first){
  clearInterval(waitTimer);
  const c=pickNext();
  study.cur=c?c.id:null;study.flipped=false;study.shownAt=Date.now();
  renderStudy(first?'in':'in');
}
function textSize(s,big){const L=s.length;return L>220?'s':L>90||(s.match(/\n/g)||[]).length>2?'m':''}
function studyHeader(){
  const multi=study.deckIds.length>1;
  const d=!multi&&deckById(study.deckIds[0]);
  const name=multi?(study.deckIds.length===S.decks.length?'Todos los bancos':plural(study.deckIds.length,'banco','bancos')):d.emoji+' '+d.name;
  return `<div class="st-top">
    <button class="circle glass press" data-sact="close" aria-label="Cerrar">${ic('x')}</button>
    <button class="deck-pill glass press" data-sact="switch"><span class="nm">${esc(name)}</span>${ic('chevD')}</button>
    <button class="circle glass press" data-sact="undo" aria-label="Deshacer" style="${study.hist.length?'':'opacity:.35;pointer-events:none'}">${ic('undo')}</button>
  </div>`;
}
function renderStudy(anim){
  const c=study.cur&&cardById(study.cur);
  const k=counts(study.deckIds);
  const doneN=study.count,prog=doneN+k.due?doneN/(doneN+k.due)*100:100;
  let h=studyHeader();
  if(!c){studyEl.innerHTML=h+`<div class="prog" style="margin-top:14px"><i style="width:100%"></i></div>`+doneHTML(k);armWait();return}
  const cur=c.state==='new'?'n':c.state==='review'?'r':'l';
  h+=`<div class="counts"><span class="c-new ${cur==='n'?'cur':''}">${k.new}</span><span class="c-learn ${cur==='l'?'cur':''}">${k.learn}</span><span class="c-rev ${cur==='r'?'cur':''}">${k.review}</span></div>
  <div class="prog"><i style="width:${prog}%"></i></div>
  <div class="stage"><article class="fc glass strong ${anim==='in'?'in':''}" id="fc">${cardFace(c)}</article></div>
  <div class="st-bottom" id="stb">${bottomHTML(c)}</div>`;
  studyEl.innerHTML=h;
}
function cardFace(c){
  const d=deckById(c.deckId);
  const head=`<div class="fc-head"><div class="fc-deck"><i class="sq" style="background:${d.color}"></i><span>${esc(d.name)}${c.state==='new'?' · nueva':''}</span></div>
    ${d.lang&&'speechSynthesis' in window?`<button class="fc-btn press" data-sact="speak" aria-label="Pronunciar">${ic('speaker')}</button>`:''}
    <button class="fc-btn press" data-sact="edit" aria-label="Editar">${ic('edit')}</button></div>`;
  if(!study.flipped)return head+`<div class="fc-body" data-sact="flip"><div class="inner"><div class="q ${textSize(c.front)}">${fmtText(c.front)}</div></div></div><div class="tap-hint" data-sact="flip">Toca para ver la respuesta</div>`;
  return head+`<div class="fc-body"><div class="inner"><div class="q small">${fmtText(c.front)}</div><div class="divider"></div><div class="a ${textSize(c.back)}">${fmtText(c.back)}</div></div></div>`;
}
function bottomHTML(c){
  if(!study.flipped)return `<button class="reveal glass press" data-sact="flip">Mostrar respuesta</button>`;
  const now=Date.now();
  return `<div class="answers popin">${RATINGS.map(o=>`<button class="ans glass press" style="--c:${o.c}" data-rate="${o.r}"><span class="al">${o.label}</span>${S.settings.showIntervals?`<span class="ai">${previewLabel(c,o.r,now)}</span>`:''}</button>`).join('')}</div>`;
}
function flip(){
  if(!study||study.flipped||!study.cur)return;
  const fc=$('#fc'),c=cardById(study.cur);
  study.flipped=true;
  fc.classList.remove('in');fc.classList.add('turn1');
  setTimeout(()=>{fc.innerHTML=cardFace(c);fc.classList.remove('turn1');fc.classList.add('turn2');$('#stb').innerHTML=bottomHTML(c);
    setTimeout(()=>fc.classList.remove('turn2'),360)},150);
}
function answer(r){
  if(!study||!study.flipped)return;
  const c=cardById(study.cur);if(!c)return;
  const now=Date.now(),prev={...c},ms=Math.min(now-study.shownAt,60000);
  Object.assign(c,schedule(c,r,now,true));
  study.hist.push({prev,logLen:S.log.length,count:study.count,newShown:study.newShown,lastId:study.lastId,r,ms});
  S.log.push({t:now,c:c.id,d:c.deckId,r,s:prev.state,i:c.state==='review'?c.ivl:0,ms});
  study.count++;if(prev.state==='new')study.newShown++;study.stats[r]++;study.ms+=ms;study.lastId=c.id;
  save();nextCard();
}
function undo(){
  const h=study&&study.hist.pop();if(!h)return;
  const c=cardById(h.prev.id);if(c){Object.keys(c).forEach(k=>delete c[k]);Object.assign(c,h.prev)}
  S.log.length=h.logLen;study.count=h.count;study.newShown=h.newShown;study.lastId=h.lastId;study.stats[h.r]--;study.ms-=h.ms;
  save();clearInterval(waitTimer);study.cur=h.prev.id;study.flipped=false;study.shownAt=Date.now();renderStudy('in');toast('Respuesta deshecha');
}
function doneHTML(k){
  const n=study.count,ok=n?Math.round((n-study.stats[1])/n*100):0;
  const later=nextLearning();
  const set=new Set(study.deckIds);
  const moreNew=S.cards.some(c=>set.has(c.deckId)&&c.state==='new');
  let msg,title;
  if(later){title='Casi listo';msg=`Tienes ${plural(later.n,'tarjeta','tarjetas')} en aprendizaje. <div class="wait" id="waitTxt">Vuelve${later.n===1?'':'n'} en ${fmtMins((later.t-Date.now())/MIN)}</div>`}
  else if(n){title='¡Listo por hoy!';msg='Has terminado todo lo pendiente. Mañana te esperan las siguientes.'}
  else {title='Nada pendiente';msg='Estás al día en este banco.'}
  return `<div class="stage" style="margin-top:6px"><div class="done glass strong">
    <div class="badge">${ic('check')}</div><h2>${title}</h2><p>${msg}</p>
    ${n?`<div class="sum"><div><b>${n}</b><span>tarjetas</span></div><div><b>${ok}%</b><span>acierto</span></div><div><b>${Math.max(1,Math.round(study.ms/MIN))}</b><span>min</span></div></div>`:''}
    ${moreNew?`<button class="btn ghost press" data-sact="more">${ic('plus')}Estudiar 10 nuevas más</button>`:''}
    <button class="btn primary press" data-sact="close">Terminar</button>
  </div></div>`;
}
function nextLearning(){
  const set=new Set(study.deckIds),de=addDays(dayStart(),1);let t=Infinity,n=0;
  for(const c of S.cards)if(set.has(c.deckId)&&(c.state==='learning'||c.state==='relearning')&&c.due<de){n++;t=Math.min(t,c.due)}
  return n?{n,t}:null;
}
function armWait(){
  clearInterval(waitTimer);
  if(!nextLearning())return;
  waitTimer=setInterval(()=>{
    if(!study){clearInterval(waitTimer);return}
    const l=nextLearning();
    if(!l){clearInterval(waitTimer);return}
    if(l.t-Date.now()<=LEARN_AHEAD){study.lastId=null;nextCard();return}
    const w=$('#waitTxt');if(w)w.textContent=`Vuelve${l.n===1?'':'n'} en ${fmtMins((l.t-Date.now())/MIN)}`;
  },5000);
}
function addMore(deckIds){
  const k=dayKey();if(S.extra.day!==k)S.extra={day:k,decks:{}};
  for(const id of deckIds)S.extra.decks[id]=(S.extra.decks[id]||0)+10;
  save();
}
function speak(){
  const c=cardById(study.cur),d=c&&deckById(c.deckId);if(!d||!d.lang)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(c.front.replace(/\*\*|`/g,''));u.lang=d.lang;u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')===d.lang);if(v)u.voice=v;
  speechSynthesis.speak(u);
}
studyEl.addEventListener('click',e=>{
  const r=e.target.closest('[data-rate]');if(r)return answer(+r.dataset.rate);
  const a=e.target.closest('[data-sact]');if(!a)return;
  const act=a.dataset.sact;
  if(act==='flip')flip();
  else if(act==='close')endStudy();
  else if(act==='undo')undo();
  else if(act==='speak')speak();
  else if(act==='more'){addMore(study.deckIds);study.lastId=null;nextCard()}
  else if(act==='edit'){const id=study.cur;cardSheet({id,onDone(){if(!study)return;if(!cardById(id)){nextCard()}else{const fc=$('#fc');if(fc)fc.innerHTML=cardFace(cardById(id))}}})}
  else if(act==='switch')deckMenu(a);
});
function deckMenu(anchor){
  const items=[];
  const allK=counts(allIds());
  items.push({em:'🗂️',label:'Todos los bancos',sub:allK.due||'',on:study.deckIds.length===S.decks.length&&S.decks.length>1,fn:()=>startStudy(allIds())});
  items.push('hr');
  for(const d of decksSorted()){const k=counts([d.id]);items.push({em:d.emoji,label:d.name,sub:k.due||'—',on:study.deckIds.length===1&&study.deckIds[0]===d.id,fn:()=>startStudy([d.id])})}
  popover(anchor,items);
}
document.addEventListener('keydown',e=>{
  if(!study||$('#layer').children.length||/input|textarea|select/i.test(e.target.tagName))return;
  if((e.key===' '||e.key==='Enter')&&!study.flipped){e.preventDefault();flip()}
  else if(study.flipped&&/^[1-4]$/.test(e.key))answer(+e.key);
  else if(study.flipped&&e.key===' '){e.preventDefault();answer(3)}
  else if(e.key==='z'||e.key==='Backspace')undo();
  else if(e.key==='Escape')endStudy();
});

const layer=$('#layer');
function openLayer(el,{backdrop=true,onClose}={}){
  let bd;
  if(backdrop){bd=document.createElement('div');bd.className='backdrop';layer.appendChild(bd)}
  layer.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bd&&bd.classList.add('on');el.classList.add('on')}));
  let closed=false;
  const close=()=>{if(closed)return;closed=true;bd&&bd.classList.remove('on');el.classList.remove('on');
    setTimeout(()=>{bd&&bd.remove();el.remove()},380);onClose&&onClose()};
  bd&&bd.addEventListener('click',close);
  return close;
}
function sheet({title,body,okLabel,onOk,mount,onClose}){
  const el=document.createElement('div');el.className='sheet glass';
  el.innerHTML=`<div class="grab"></div><div class="sh-head"><button class="circle press" data-x aria-label="Cerrar">${ic('x')}</button><h3>${esc(title)}</h3>${onOk?`<button class="circle ok press" data-ok aria-label="${esc(okLabel||'Guardar')}">${ic('check')}</button>`:'<span style="width:40px"></span>'}</div><div class="sh-body">${body}</div>`;
  const close=openLayer(el,{onClose});
  el.querySelector('[data-x]').onclick=close;
  if(onOk)el.querySelector('[data-ok]').onclick=()=>{if(onOk(el)!==false)close()};
  // arrastrar para cerrar
  let y0=null,dy=0;const head=el.querySelector('.sh-head'),grab=el.querySelector('.grab');
  const start=e=>{if(e.target.closest('button'))return;y0=e.touches[0].clientY;el.style.transition='none'};
  const move=e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);el.style.transform=`translateY(${dy}px)`};
  const end=()=>{if(y0===null)return;el.style.transition='';el.style.transform='';if(dy>110)close();y0=null;dy=0};
  [head,grab].forEach(n=>{n.addEventListener('touchstart',start,{passive:true});n.addEventListener('touchmove',move,{passive:true});n.addEventListener('touchend',end)});
  mount&&mount(el,close);
  return {el,close};
}
function popover(anchor,items){
  const el=document.createElement('div');el.className='pop glass';
  el.innerHTML=items.map((it,i)=>it==='hr'?'<hr>':`<button data-i="${i}" class="${it.on?'on':''} ${it.danger?'danger':''}" style="${it.danger?'color:var(--red)':''}">${it.em?`<span class="em">${esc(it.em)}</span>`:''}<span>${esc(it.label)}</span>${it.sub!==undefined&&it.sub!==''?`<span class="sub">${esc(it.sub)}</span>`:''}${it.on?ic('check','style="width:18px;height:18px;margin-left:8px"'):''}</button>`).join('');
  const r=anchor.getBoundingClientRect();
  el.style.top=(r.bottom+8)+'px';
  document.body.appendChild(el);const w=Math.max(el.offsetWidth,230);
  el.style.left=clamp(r.left+r.width/2-w/2,16,innerWidth-w-16)+'px';layer.appendChild(el);
  const close=openLayer(el,{backdrop:true});
  el.previousElementSibling.style.background='transparent';
  el.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;close();setTimeout(()=>items[+b.dataset.i].fn(),60)});
}
function confirmBox({title,msg,ok='Aceptar',danger=false}){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='alert glass';
    el.innerHTML=`<h3>${esc(title)}</h3><p>${msg}</p><div class="ab"><button class="btn sm ghost press" data-c style="color:var(--text)">Cancelar</button><button class="btn sm press ${danger?'danger':'primary'}" data-o>${esc(ok)}</button></div>`;

  });
}

      if(nx)nx.onclick=()=>{if(!f.value.trim()||!b.value.trim())return;S.cards.push(newCard(dk,f.value,b.value));save();f.value='';b.value='';auto(f);auto(b);val();f.focus();toast('Tarjeta guardada');if(!study)rerender()};
      const rs=$('[data-reset]',el);
      if(rs)rs.onclick=async()=>{if(await confirmBox({title:'¿Reiniciar tarjeta?',msg:'Volverá a ser nueva.',ok:'Reiniciar'})){Object.assign(c,{state:'new',due:0,ivl:0,ease:2.5,step:0,reps:0,lapses:0});save();close();if(!study)rerender();toast('Tarjeta reiniciada')}};
      const del=$('[data-del]',el);
      if(del)del.onclick=async()=>{if(await confirmBox({title:'¿Eliminar tarjeta?',msg:'No se puede deshacer.',ok:'Eliminar',danger:true})){S.cards=S.cards.filter(x=>x.id!==c.id);save();close();if(!study)rerender();toast('Tarjeta eliminada')}};
    },
    onOk(el){
      const f=$('#cf',el).value,b=$('#cb',el).value;if(!f.trim()||!b.trim())return false;
      if(c){c.front=f.trim();c.back=b.trim();c.deckId=dk}else S.cards.push(newCard(dk,f,b));
      save();if(!study)rerender();toast(c?'Cambios guardados':'Tarjeta guardada');
    }});
}

/* ---------- Hoja: importar ---------- */
function parseCards(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return [];
  const seps=['\t',' | ','|',';',' - ',','];
  const sep=seps.find(s=>lines.filter(l=>l.includes(s)).length>=Math.ceil(lines.length*.6))||'\t';
  const unq=s=>{s=s.trim();if(s.length>1&&s[0]==='"'&&s.endsWith('"'))s=s.slice(1,-1).replace(/""/g,'"');return s.replace(/<br\s*\/?>/gi,'\n')};
  return lines.map(l=>{const i=l.indexOf(sep);if(i<0)return null;return [unq(l.slice(0,i)),unq(l.slice(i+sep.length))]}).filter(p=>p&&p[0]&&p[1]);
}
function importSheet(deckId){
  let dk=deckId||(S.decks[0]&&S.decks[0].id);
  if(!dk){toast('Crea primero un banco',false);return}
  const body=`<div class="pick" id="ip">${decksSorted().map(d=>`<button data-dk="${d.id}" class="${d.id===dk?'on':''}">${esc(d.emoji)} ${esc(d.name)}</button>`).join('')}</div>
  <div class="field"><label>Pega tus tarjetas · una por línea</label><textarea id="it" rows="8" placeholder="pregunta | respuesta&#10;to take for granted | dar por sentado&#10;CAPM | E(Ri) = Rf + β·(E(Rm) − Rf)" style="min-height:180px;font-size:15px"></textarea></div>
  <p class="hint" style="margin:-2px 6px 12px">Separa pregunta y respuesta con tabulador, “|”, “;” o “,”. Sirve lo que exportan Quizlet, Anki (texto) o Excel/Numbers.</p>
  <div class="sh-actions"><button class="btn ghost press" data-file>${ic('tray')}Elegir archivo .txt / .csv</button></div>
  <p class="hint" id="ic" style="text-align:center;font-weight:650;margin-top:14px"></p>`;
  sheet({title:'Importar tarjetas',body,okLabel:'Importar',
    mount(el){
      const t=$('#it',el),ok=$('[data-ok]',el),info=$('#ic',el);
      const upd=()=>{const n=parseCards(t.value).length;ok.classList.toggle('dis',!n);info.textContent=t.value.trim()?(n?`Se añadirán ${plural(n,'tarjeta','tarjetas')}`:'No se reconoce el formato'):''};upd();
      t.addEventListener('input',upd);
      $('#ip',el).addEventListener('click',e=>{const x=e.target.closest('[data-dk]');if(!x)return;dk=x.dataset.dk;el.querySelectorAll('[data-dk]').forEach(y=>y.classList.toggle('on',y===x))});
      $('[data-file]',el).onclick=()=>pickFile('.txt,.csv,.tsv,text/plain,text/csv',txt=>{t.value=txt;upd()});
    },
    onOk(el){
      const pairs=parseCards($('#it',el).value);if(!pairs.length)return false;
      pairs.forEach(([f,b],i)=>S.cards.push(newCard(dk,f,b,i)));save();
      if(!study)rerender();toast(`${plural(pairs.length,'tarjeta importada','tarjetas importadas')}`);
    }});
}
function pickFile(accept,cb){
  const fi=$('#fileIn');fi.value='';fi.accept=accept;
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(String(r.result),f);r.readAsText(f)};
  fi.click();
}

/* ---------- Copias de seguridad ---------- */
async function exportData(){
  const name=`repaso-${dayKey()}.json`;
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de Repaso'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Copia exportada');
}
function restoreData(){
  pickFile('.json,application/json',async txt=>{
    let d;try{d=JSON.parse(txt)}catch(e){return toast('Archivo no válido',false)}
    if(!d||!Array.isArray(d.decks)||!Array.isArray(d.cards))return toast('No es una copia de Repaso',false);
    if(await confirmBox({title:'¿Restaurar copia?',msg:`Contiene ${plural(d.decks.length,'banco','bancos')} y ${plural(d.cards.length,'tarjeta','tarjetas')}. Reemplazará todo lo que hay ahora.`,ok:'Restaurar',danger:true})){
      S=normalize(d);save();applyTheme();nav.stack=[];setTab('home');toast('Copia restaurada')}
  });
}

/* =========================================================
   Acciones globales
   ========================================================= */
document.addEventListener('click',async e=>{
  if(e.target.closest('#study')||e.target.closest('#layer'))return;
  const s=e.target.closest('[data-study]');if(s){e.stopPropagation();return startStudy([s.dataset.study])}
  const cd=e.target.closest('[data-card]');if(cd)return cardSheet({id:cd.dataset.card});
  const fd=e.target.closest('[data-fdeck]');if(fd){nav.search.deck=fd.dataset.fdeck;return rerender()}
  const a=e.target.closest('[data-act]');
  if(!a){const o=e.target.closest('[data-open]');if(o){nav.deckQ='';push({type:'deck',id:o.dataset.open})}return}
  const act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case 'back':pop();break;
    case 'studyAll':if(counts(allIds()).due)startStudy(allIds());break;
    case 'newDeck':deckSheet();break;
    case 'editDeck':deckSheet(id);break;
    case 'addCard':cardSheet({deckId:id});break;
    case 'import':importSheet(id);break;
    case 'more':addMore([id]);startStudy([id]);break;
    case 'hideInstall':S.settings.installHidden=true;save();rerender();break;
    case 'npd':S.settings.newPerDay=clamp(S.settings.newPerDay+ +a.dataset.v,0,200);save();rerender();break;
    case 'toggleIvl':S.settings.showIntervals=!S.settings.showIntervals;save();rerender();break;
    case 'theme':S.settings.theme=a.dataset.v;save();applyTheme();rerender();break;
    case 'export':exportData();break;
    case 'restore':restoreData();break;
    case 'resetProgress':
      if(await confirmBox({title:'¿Reiniciar progreso?',msg:'Todas las tarjetas volverán a ser nuevas y se borrará el historial. Las tarjetas no se eliminan.',ok:'Reiniciar',danger:true})){
        S.cards.forEach(c=>Object.assign(c,{state:'new',due:0,ivl:0,ease:2.5,step:0,reps:0,lapses:0}));S.log=[];S.extra={day:'',decks:{}};save();rerender();toast('Progreso reiniciado')}
      break;
    case 'wipe':
      if(await confirmBox({title:'¿Borrar todo?',msg:'Se eliminarán bancos, tarjetas e historial de este dispositivo.',ok:'Borrar',danger:true})){
        S={v:1,decks:[],cards:[],log:[],settings:{...S.settings},extra:{day:'',decks:{}}};save();setTab('home');toast('Datos borrados')}
      break;
  }
});

function applyTheme(){
  const t=S.settings.theme;
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content=dark?'#06070c':'#e9edf7';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!study&&!layer.children.length)rerender()});

applyTheme();
save();
render('fade');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
