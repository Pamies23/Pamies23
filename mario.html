<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Prehistórico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(#f6b26b, #e8a05a);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      color: #fff;
    }
    h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    canvas {
      background: #f4c27a;
      border-radius: 14px;
      max-width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.15);
    }
    .hint { font-size: 0.85rem; opacity: 0.92; text-shadow: 0 1px 3px rgba(0,0,0,0.4); text-align: center; }
  </style>
</head>
<body>
  <h1>🦴 MUNDO PREHISTÓRICO</h1>
  <canvas id="game" width="800" height="400"></canvas>
  <p class="hint">← → o A/D para moverte · ↑ / W / Espacio para saltar · Salta sobre los dinos · R para reiniciar</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- Constantes del mundo ---
    const GRAVITY = 0.8;
    const MOVE_SPEED = 4;
    const JUMP_FORCE = 15;
    const GROUND_Y = 360;          // altura del suelo principal
    const LEVEL_WIDTH = 3000;      // longitud total del nivel

    // --- Plataformas (suelo + flotantes) ---
    const platforms = [
      { x: 0,    y: GROUND_Y, w: 700,  h: 40 },
      { x: 760,  y: GROUND_Y, w: 900,  h: 40 },
      { x: 1720, y: GROUND_Y, w: 1280, h: 40 },
      { x: 250,  y: 280, w: 120, h: 20 },
      { x: 450,  y: 220, w: 120, h: 20 },
      { x: 640,  y: 170, w: 100, h: 20 },
      { x: 950,  y: 250, w: 140, h: 20 },
      { x: 1200, y: 200, w: 120, h: 20 },
      { x: 1450, y: 260, w: 120, h: 20 },
      { x: 1900, y: 230, w: 140, h: 20 },
      { x: 2200, y: 190, w: 120, h: 20 }
    ];

    // --- Bloques "?" (sueltan una moneda al golpearlos desde abajo) ---
    // {x, y, w, h, used}
    const blocksData = [
      { x: 480, y: 150, w: 32, h: 32, used: false },
      { x: 1000, y: 180, w: 32, h: 32, used: false },
      { x: 1230, y: 130, w: 32, h: 32, used: false },
      { x: 1950, y: 160, w: 32, h: 32, used: false }
    ];

    // --- Monedas sueltas {x, y, w, h, taken} ---
    const coinsData = [
      { x: 290, y: 240, taken: false },
      { x: 500, y: 180, taken: false },
      { x: 680, y: 130, taken: false },
      { x: 990, y: 210, taken: false },
      { x: 1240, y: 160, taken: false },
      { x: 1490, y: 220, taken: false },
      { x: 1620, y: 320, taken: false },
      { x: 1940, y: 190, taken: false },
      { x: 2240, y: 150, taken: false },
      { x: 2500, y: 320, taken: false }
    ].map(c => ({ ...c, w: 18, h: 18 }));

    // --- Goombas (enemigos que patrullan) {x, y, w, h, vx, dir, alive, range} ---
    const goombasData = [
      { x: 850,  y: GROUND_Y - 28, dir: -1, minX: 770,  maxX: 1100 },
      { x: 1300, y: GROUND_Y - 28, dir: 1,  minX: 1180, maxX: 1500 },
      { x: 1850, y: GROUND_Y - 28, dir: -1, minX: 1740, maxX: 2050 },
      { x: 2400, y: GROUND_Y - 28, dir: 1,  minX: 2250, maxX: 2700 }
    ];

    // Meta (bandera)
    const goal = { x: 2850, y: GROUND_Y - 160, w: 12, h: 160 };

    // --- Estado mutable (se reinicia) ---
    const player = { x: 60, y: 0, w: 28, h: 36, vx: 0, vy: 0, onGround: false, facing: 1, anim: 0 };
    let blocks, coins, goombas;
    let cameraX = 0, score = 0, lives = 3, won = false, dead = false, invuln = 0;
    let t = 0;                       // contador global para animaciones
    const particles = [];            // efectos de partículas

    function spawnParticles(x, y, color, n, spread) {
      for (let i = 0; i < n; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * spread,
          vy: -Math.random() * 4 - 1,
          life: 1, color,
          r: 2 + Math.random() * 3
        });
      }
    }

    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key.toLowerCase() === 'r') fullReset();
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function resetPlayer() {
      player.x = 60; player.y = 0; player.vx = 0; player.vy = 0;
      cameraX = 0; invuln = 90;
    }

    function fullReset() {
      blocks = blocksData.map(b => ({ ...b, used: false }));
      coins = coinsData.map(c => ({ ...c, taken: false }));
      goombas = goombasData.map(g => ({ ...g, w: 30, h: 28, vx: 1.2, alive: true, squashT: 0 }));
      score = 0; lives = 3; won = false; dead = false;
      resetPlayer();
    }

    function loseLife() {
      lives--;
      if (lives <= 0) { dead = true; }
      else { resetPlayer(); }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // Conjunto de sólidos con los que choca el jugador: plataformas + bloques sin usar (siguen siendo sólidos)
    function solids() {
      return platforms.concat(blocks);
    }

    function update() {
      if (won || dead) return;
      if (invuln > 0) invuln--;

      // Movimiento horizontal
      player.vx = 0;
      if (keys['arrowleft'] || keys['a']) { player.vx = -MOVE_SPEED; player.facing = -1; }
      if (keys['arrowright'] || keys['d']) { player.vx = MOVE_SPEED; player.facing = 1; }

      // Salto
      if ((keys['arrowup'] || keys['w'] || keys[' ']) && player.onGround) {
        player.vy = -JUMP_FORCE;
        player.onGround = false;
      }

      player.vy += GRAVITY;

      // --- Colisión en X ---
      player.x += player.vx;
      for (const p of solids()) {
        if (rectsOverlap(player, p)) {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
        }
      }
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > LEVEL_WIDTH) player.x = LEVEL_WIDTH - player.w;

      // --- Colisión en Y ---
      player.y += player.vy;
      player.onGround = false;
      for (const p of solids()) {
        if (rectsOverlap(player, p)) {
          if (player.vy > 0) {                 // aterriza encima
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0) {           // golpea por debajo
            player.y = p.y + p.h;
            player.vy = 0;
            // ¿es un bloque "?" sin usar? -> suelta moneda
            if (p.used === false && p.hasOwnProperty('used')) {
              p.used = true;
              score += 100;
              spawnParticles(p.x + p.w / 2, p.y, '#cdbfae', 12, 5);
            }
          }
        }
      }

      // Caída al vacío
      if (player.y > canvas.height + 200) loseLife();

      // animación de caminar
      if (Math.abs(player.vx) > 0 && player.onGround) player.anim += 0.25;
      else player.anim = 0;

      // --- Huesos ---
      for (const c of coins) {
        if (!c.taken && rectsOverlap(player, c)) {
          c.taken = true; score += 50;
          spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#fdf6e3', 10, 4);
        }
      }

      // --- Goombas ---
      for (const g of goombas) {
        if (!g.alive) { if (g.squashT > 0) g.squashT--; continue; }
        // patrulla
        g.x += g.vx * g.dir;
        if (g.x <= g.minX) { g.x = g.minX; g.dir = 1; }
        if (g.x + g.w >= g.maxX) { g.x = g.maxX - g.w; g.dir = -1; }

        if (rectsOverlap(player, g)) {
          const cayendoSobre = player.vy > 0 && (player.y + player.h) - g.y < 20;
          if (cayendoSobre) {
            g.alive = false; g.squashT = 30;
            player.vy = -JUMP_FORCE * 0.6;     // rebote
            score += 200;
            spawnParticles(g.x + g.w / 2, g.y + g.h / 2, '#4f9c3a', 14, 6);
          } else if (invuln === 0) {
            loseLife();
          }
        }
      }

      // Meta
      if (rectsOverlap(player, goal)) won = true;

      // Cámara
      cameraX = player.x + player.w / 2 - canvas.width / 2;
      cameraX = Math.max(0, Math.min(cameraX, LEVEL_WIDTH - canvas.width));
    }

    // --- Helper: rectángulo redondeado ---
    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // --- Helper: sombra elíptica bajo una entidad ---
    function dropShadow(cx, groundY, w) {
      ctx.save();
      ctx.fillStyle = 'rgba(60,40,20,0.25)';
      ctx.beginPath();
      ctx.ellipse(cx, groundY, w * 0.5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      // Cielo (degradado cálido de amanecer)
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#ffd98a');
      sky.addColorStop(0.45, '#f7b66a');
      sky.addColorStop(1, '#e8915a');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sol con halo
      const sunX = 660, sunY = 90;
      const halo = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 120);
      halo.addColorStop(0, 'rgba(255,247,214,0.9)');
      halo.addColorStop(1, 'rgba(255,247,214,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(sunX - 140, sunY - 140, 280, 280);
      ctx.fillStyle = '#fff4cf';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 34, 0, Math.PI * 2);
      ctx.fill();

      drawBackdrop();

      // Nubes (blandas, con leve parallax)
      for (let i = 0; i < 8; i++) {
        const cx = ((i * 450 - cameraX * 0.4) % (LEVEL_WIDTH)) ;
        drawCloud(cx, 55 + (i % 3) * 38, 0.8 - (i % 3) * 0.15);
      }

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Plataformas (tierra con degradado + borde de hierba)
      for (const p of platforms) drawPlatform(p);

      // Rocas
      for (const b of blocks) drawRock(b);

      // Huesos (flotan suavemente y giran su brillo)
      for (const c of coins) {
        if (c.taken) continue;
        const bob = Math.sin((t + c.x) * 0.08) * 3;
        drawBone(c.x, c.y + bob, c.w, c.h);
      }

      // Dinos
      for (const g of goombas) {
        if (!g.alive) {
          if (g.squashT > 0) {                  // aplastado: torta verde que se desvanece
            ctx.save();
            ctx.globalAlpha = g.squashT / 30;
            ctx.fillStyle = '#3f7a2b';
            roundRect(g.x, g.y + g.h - 7, g.w, 7, 3); ctx.fill();
            ctx.restore();
          }
          continue;
        }
        drawDino(g);
      }

      // Meta (tótem de piedra con musgo)
      drawTotem();

      // Partículas (delante del mundo)
      for (const pa of particles) {
        ctx.globalAlpha = Math.max(0, pa.life);
        ctx.fillStyle = pa.color;
        ctx.beginPath();
        ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Jugador (parpadea si es invulnerable)
      if (!(invuln > 0 && Math.floor(invuln / 5) % 2 === 0)) drawPlayer();

      ctx.restore();

      // Viñeta sutil para dar profundidad
      const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 200, canvas.width/2, canvas.height/2, 520);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.22)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawHUD();

      if (won) overlay('¡Nivel completado!', 'Pulsa R para volver a jugar', '#ffe08a');
      if (dead) overlay('GAME OVER', 'Pulsa R para reiniciar', '#ff8a8a');
    }

    function drawHUD() {
      // panel translúcido redondeado
      ctx.save();
      ctx.fillStyle = 'rgba(20,12,4,0.42)';
      roundRect(12, 12, 200, 40, 12); ctx.fill();
      ctx.font = 'bold 20px system-ui';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      // hueso + puntuación
      drawBone(26, 24, 18, 14);
      ctx.fillStyle = '#fff';
      ctx.fillText(score, 54, 33);
      // corazones
      for (let i = 0; i < 3; i++) {
        drawHeart(120 + i * 26, 32, 9, i < lives);
      }
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }

    function drawHeart(cx, cy, s, filled) {
      ctx.save();
      ctx.fillStyle = filled ? '#ff5a6e' : 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 0.3);
      ctx.bezierCurveTo(cx, cy, cx - s, cy - s * 0.5, cx - s, cy - s * 0.1);
      ctx.bezierCurveTo(cx - s, cy + s * 0.5, cx, cy + s * 0.7, cx, cy + s);
      ctx.bezierCurveTo(cx, cy + s * 0.7, cx + s, cy + s * 0.5, cx + s, cy - s * 0.1);
      ctx.bezierCurveTo(cx + s, cy - s * 0.5, cx, cy, cx, cy + s * 0.3);
      ctx.fill();
      ctx.restore();
    }

    function overlay(title, sub, color) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.font = '800 44px system-ui';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 12);
      ctx.fillStyle = '#fff';
      ctx.font = '20px system-ui';
      ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 24);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = '16px system-ui';
      ctx.fillText('Puntuación: ' + score, canvas.width / 2, canvas.height / 2 + 54);
      ctx.textAlign = 'left';
    }

    function drawCloud(x, y, alpha) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 22, y + 5, 24, 0, Math.PI * 2);
      ctx.arc(x + 50, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 28, y - 8, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Montañas en capas (parallax + niebla) y volcán humeante
    function drawBackdrop() {
      // capa lejana (más clara/brumosa)
      layerMountains(0.12, 230, '#cf9a6a', 380);
      // capa media
      layerMountains(0.22, 200, '#b97a45', 320);

      // Volcán
      const vx = 520 - ((cameraX * 0.22) % 1100);
      const grd = ctx.createLinearGradient(0, 130, 0, canvas.height);
      grd.addColorStop(0, '#8a542e');
      grd.addColorStop(1, '#6b3f22');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(vx - 10, canvas.height);
      ctx.lineTo(vx + 90, 130);
      ctx.lineTo(vx + 130, 130);
      ctx.lineTo(vx + 230, canvas.height);
      ctx.fill();
      // lava brillante
      const lava = ctx.createLinearGradient(0, 128, 0, 175);
      lava.addColorStop(0, '#ffd34d');
      lava.addColorStop(1, '#e8531f');
      ctx.fillStyle = lava;
      roundRect(vx + 88, 128, 44, 16, 5); ctx.fill();
      // chorritos de lava por la ladera
      ctx.strokeStyle = '#e8531f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(vx + 108, 140); ctx.lineTo(vx + 100, 175); ctx.lineTo(vx + 108, 205);
      ctx.stroke();
      // humo (bocanadas animadas)
      for (let i = 0; i < 3; i++) {
        const p = (t * 0.4 + i * 40) % 120;
        ctx.fillStyle = 'rgba(120,110,100,' + (0.35 - p / 400) + ')';
        ctx.beginPath();
        ctx.arc(vx + 110 + Math.sin(p * 0.05) * 12, 120 - p, 12 + p * 0.12, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function layerMountains(par, baseY, color, spacing) {
      const off = cameraX * par;
      ctx.fillStyle = color;
      for (let i = -1; i < 8; i++) {
        const mx = i * spacing - (off % spacing);
        ctx.beginPath();
        ctx.moveTo(mx, canvas.height);
        ctx.lineTo(mx + spacing * 0.5, baseY);
        ctx.lineTo(mx + spacing, canvas.height);
        ctx.fill();
      }
      // niebla en la base de la capa
      ctx.fillStyle = 'rgba(247,182,106,0.35)';
      ctx.fillRect(0, baseY + 70, canvas.width, canvas.height - baseY - 70);
    }

    function drawPlatform(p) {
      const isGround = p.y === GROUND_Y;
      const bottom = isGround ? canvas.height + cameraX * 0 : p.y + p.h;
      const h = isGround ? (canvas.height - p.y + 40) : p.h;
      // cuerpo de tierra con degradado
      const g = ctx.createLinearGradient(0, p.y, 0, p.y + h);
      g.addColorStop(0, '#9c6b3a');
      g.addColorStop(1, '#6e4a26');
      ctx.fillStyle = g;
      roundRect(p.x, p.y, p.w, h, isGround ? 6 : 8); ctx.fill();
      // franja de hierba
      ctx.fillStyle = '#5fa12f';
      roundRect(p.x, p.y, p.w, 9, isGround ? 6 : 8); ctx.fill();
      ctx.fillStyle = '#74bd3c';
      ctx.fillRect(p.x + 4, p.y, p.w - 8, 4);
      // briznas de hierba
      ctx.strokeStyle = '#4f8a28';
      ctx.lineWidth = 2;
      for (let gx = p.x + 6; gx < p.x + p.w - 4; gx += 12) {
        ctx.beginPath();
        ctx.moveTo(gx, p.y + 2);
        ctx.lineTo(gx + Math.sin((t + gx) * 0.05) * 2, p.y - 5);
        ctx.stroke();
      }
    }

    function drawRock(b) {
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, b.used ? '#8d8175' : '#bcab9b');
      g.addColorStop(1, b.used ? '#6b6056' : '#8f8073');
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill();
      // brillo superior
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      roundRect(b.x + 3, b.y + 3, b.w - 6, 7, 4); ctx.fill();
      // grietas
      ctx.strokeStyle = 'rgba(60,50,42,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + 9, b.y + 8); ctx.lineTo(b.x + 15, b.y + 17); ctx.lineTo(b.x + 10, b.y + 26);
      ctx.stroke();
      if (!b.used) {
        const pulse = 0.6 + Math.sin(t * 0.12) * 0.4;
        ctx.fillStyle = 'rgba(255,236,150,' + pulse + ')';
        ctx.font = 'bold 18px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('★', b.x + b.w / 2, b.y + b.h - 9);
        ctx.textAlign = 'left';
      }
    }

    function drawTotem() {
      const x = goal.x, y = goal.y, w = goal.w + 16;
      const g = ctx.createLinearGradient(x - 8, 0, x + w - 8, 0);
      g.addColorStop(0, '#8a7d6f');
      g.addColorStop(0.5, '#a4978a');
      g.addColorStop(1, '#7a6d5f');
      ctx.fillStyle = g;
      roundRect(x - 8, y, w, goal.h, 8); ctx.fill();
      // musgo en los lados
      ctx.fillStyle = 'rgba(95,140,47,0.6)';
      ctx.fillRect(x - 8, y + 50, 5, 40);
      ctx.fillRect(x + w - 13, y + 90, 5, 30);
      // cara tallada
      ctx.fillStyle = '#3a332c';
      ctx.beginPath(); ctx.arc(x, y + 28, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + goal.w, y + 28, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 4, y + 44, goal.w + 8, 5);
      // plumas decorativas arriba
      ctx.fillStyle = '#e0584a';
      ctx.beginPath();
      ctx.ellipse(x + goal.w / 2 - 6, y - 6, 4, 10, -0.4, 0, Math.PI * 2);
      ctx.ellipse(x + goal.w / 2 + 6, y - 6, 4, 10, 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hueso (recolectable / icono HUD) — dibujado en (x,y) con tamaño (w,h)
    function drawBone(x, y, w, h) {
      const cy = y + h / 2;
      ctx.save();
      ctx.fillStyle = '#fdf6e3';
      ctx.strokeStyle = 'rgba(120,110,90,0.5)';
      ctx.lineWidth = 1;
      // tallo
      roundRect(x + 4, cy - 2.5, w - 8, 5, 2.5); ctx.fill();
      // nudos
      const knob = (kx, ky) => { ctx.beginPath(); ctx.arc(kx, ky, 3.2, 0, Math.PI * 2); ctx.fill(); };
      knob(x + 4, cy - 3); knob(x + 4, cy + 3);
      knob(x + w - 4, cy - 3); knob(x + w - 4, cy + 3);
      // brillo
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(x + 6, cy - 1.5, w - 12, 1.5);
      ctx.restore();
    }

    // Dinosaurio enemigo (cuerpo redondeado con degradado)
    function drawDino(g) {
      const d = g.dir;
      const cx = g.x + g.w / 2, cy = g.y + g.h / 2;
      const wob = Math.sin(t * 0.2 + g.x) * 1.5;   // contoneo al andar
      dropShadow(cx, g.y + g.h + 2, g.w);

      ctx.save();
      // cola
      ctx.fillStyle = '#3f7d2c';
      ctx.beginPath();
      ctx.moveTo(cx - d * g.w * 0.4, cy + 4);
      ctx.lineTo(cx - d * (g.w * 0.7), cy - 2 + wob);
      ctx.lineTo(cx - d * g.w * 0.4, cy + 10);
      ctx.fill();

      // cuerpo
      const body = ctx.createLinearGradient(0, g.y, 0, g.y + g.h);
      body.addColorStop(0, '#67b84a');
      body.addColorStop(1, '#3f7d2c');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 2, g.w / 2, g.h / 2 - 1, 0, 0, Math.PI * 2);
      ctx.fill();

      // panza más clara
      ctx.fillStyle = 'rgba(220,240,180,0.45)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + 8, g.w / 3, g.h / 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // púas
      ctx.fillStyle = '#2f6320';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(g.x + 7 + i * 7, g.y + 5);
        ctx.lineTo(g.x + 10 + i * 7, g.y - 3);
        ctx.lineTo(g.x + 13 + i * 7, g.y + 5);
        ctx.fill();
      }

      // cabeza
      const hx = d === 1 ? g.x + g.w - 4 : g.x + 4;
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(hx, g.y + 6, 8, 0, Math.PI * 2);
      ctx.fill();
      // patitas que se mueven
      ctx.fillStyle = '#2f6320';
      const step = Math.sin(t * 0.3 + g.x) * 2;
      roundRect(g.x + 5, g.y + g.h - 4, 7, 5 + step, 2); ctx.fill();
      roundRect(g.x + g.w - 12, g.y + g.h - 4, 7, 5 - step, 2); ctx.fill();
      // ojo
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx + d * 2, g.y + 4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(hx + d * 3, g.y + 4, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Cavernícola (jugador) con sombreado y animación
    function drawPlayer() {
      const { x, y, w, h } = player;
      const cx = x + w / 2;
      const legSwing = Math.sin(player.anim) * 4;
      const squash = player.onGround ? 0 : -2;       // estira un poco al saltar
      dropShadow(cx, y + h + 2, w);

      ctx.save();
      // piernas (se balancean al andar)
      ctx.fillStyle = '#caa06a';
      roundRect(x + 5, y + h * 0.75, 7, h * 0.25 + legSwing * 0.3, 3); ctx.fill();
      roundRect(x + w - 12, y + h * 0.75, 7, h * 0.25 - legSwing * 0.3, 3); ctx.fill();

      // taparrabos (piel con degradado y manchas)
      const fur = ctx.createLinearGradient(0, y + h * 0.5, 0, y + h * 0.8);
      fur.addColorStop(0, '#8a5524');
      fur.addColorStop(1, '#643c16');
      ctx.fillStyle = fur;
      roundRect(x, y + h * 0.52, w, h * 0.28, 5); ctx.fill();
      ctx.fillStyle = '#4a2c10';
      ctx.beginPath(); ctx.arc(x + 8, y + h * 0.64, 2.5, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(x + w - 9, y + h * 0.7, 2.5, 0, 6.3); ctx.fill();

      // torso (piel con sombreado)
      const skin = ctx.createLinearGradient(x, 0, x + w, 0);
      skin.addColorStop(0, '#c98f57');
      skin.addColorStop(0.5, '#e3a86d');
      skin.addColorStop(1, '#c98f57');
      ctx.fillStyle = skin;
      roundRect(x + 2, y + h * 0.3, w - 4, h * 0.28, 6); ctx.fill();

      // brazo delantero
      ctx.fillStyle = '#d99a63';
      roundRect(cx + player.facing * 4, y + h * 0.34 + squash, 6, h * 0.22, 3); ctx.fill();

      // cabeza
      ctx.fillStyle = '#e8b07a';
      ctx.beginPath();
      ctx.arc(cx, y + h * 0.2, w * 0.42, 0, Math.PI * 2);
      ctx.fill();
      // melena revuelta
      ctx.fillStyle = '#3a2410';
      ctx.beginPath();
      ctx.arc(cx, y + h * 0.13, w * 0.45, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(cx - w * 0.45, y + 2, 5, 12);
      ctx.fillRect(cx + w * 0.45 - 5, y + 2, 5, 12);
      // ceja prominente
      ctx.fillStyle = '#caa06a';
      ctx.fillRect(cx - 8, y + h * 0.2, 16, 3);
      // ojo
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(cx + player.facing * 4, y + h * 0.26, 2, 0, Math.PI * 2);
      ctx.fill();

      // garrote
      ctx.strokeStyle = '#7a4a1e';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      const gx = cx + player.facing * 12;
      ctx.beginPath();
      ctx.moveTo(cx + player.facing * 6, y + h * 0.5);
      ctx.lineTo(gx, y + h * 0.32);
      ctx.stroke();
      ctx.fillStyle = '#8a5524';
      ctx.beginPath();
      ctx.arc(gx, y + h * 0.3, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function loop() {
      t++;
      update();
      updateParticles();
      draw();
      requestAnimationFrame(loop);
    }

    fullReset();
    loop();
  </script>
</body>
</html>
