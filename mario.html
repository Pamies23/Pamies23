<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Prehistórico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(#f6b26b, #e8a05a);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      color: #fff;
    }
    h1 { font-size: 1.5rem; text-shadow: 2px 2px 0 #000; }
    canvas {
      background: #f4c27a;
      border: 4px solid #3a2410;
      border-radius: 4px;
      max-width: 100%;
      image-rendering: pixelated;
    }
    .hint { font-size: 0.85rem; opacity: 0.95; text-shadow: 1px 1px 0 #000; text-align: center; }
  </style>
</head>
<body>
  <h1>🦴 MUNDO PREHISTÓRICO</h1>
  <canvas id="game" width="800" height="400"></canvas>
  <p class="hint">← → o A/D para moverte · ↑ / W / Espacio para saltar · Salta sobre los dinos · R para reiniciar</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- Constantes del mundo ---
    const GRAVITY = 0.8;
    const MOVE_SPEED = 4;
    const JUMP_FORCE = 15;
    const GROUND_Y = 360;          // altura del suelo principal
    const LEVEL_WIDTH = 3000;      // longitud total del nivel

    // --- Plataformas (suelo + flotantes) ---
    const platforms = [
      { x: 0,    y: GROUND_Y, w: 700,  h: 40 },
      { x: 760,  y: GROUND_Y, w: 900,  h: 40 },
      { x: 1720, y: GROUND_Y, w: 1280, h: 40 },
      { x: 250,  y: 280, w: 120, h: 20 },
      { x: 450,  y: 220, w: 120, h: 20 },
      { x: 640,  y: 170, w: 100, h: 20 },
      { x: 950,  y: 250, w: 140, h: 20 },
      { x: 1200, y: 200, w: 120, h: 20 },
      { x: 1450, y: 260, w: 120, h: 20 },
      { x: 1900, y: 230, w: 140, h: 20 },
      { x: 2200, y: 190, w: 120, h: 20 }
    ];

    // --- Bloques "?" (sueltan una moneda al golpearlos desde abajo) ---
    // {x, y, w, h, used}
    const blocksData = [
      { x: 480, y: 150, w: 32, h: 32, used: false },
      { x: 1000, y: 180, w: 32, h: 32, used: false },
      { x: 1230, y: 130, w: 32, h: 32, used: false },
      { x: 1950, y: 160, w: 32, h: 32, used: false }
    ];

    // --- Monedas sueltas {x, y, w, h, taken} ---
    const coinsData = [
      { x: 290, y: 240, taken: false },
      { x: 500, y: 180, taken: false },
      { x: 680, y: 130, taken: false },
      { x: 990, y: 210, taken: false },
      { x: 1240, y: 160, taken: false },
      { x: 1490, y: 220, taken: false },
      { x: 1620, y: 320, taken: false },
      { x: 1940, y: 190, taken: false },
      { x: 2240, y: 150, taken: false },
      { x: 2500, y: 320, taken: false }
    ].map(c => ({ ...c, w: 18, h: 18 }));

    // --- Goombas (enemigos que patrullan) {x, y, w, h, vx, dir, alive, range} ---
    const goombasData = [
      { x: 850,  y: GROUND_Y - 28, dir: -1, minX: 770,  maxX: 1100 },
      { x: 1300, y: GROUND_Y - 28, dir: 1,  minX: 1180, maxX: 1500 },
      { x: 1850, y: GROUND_Y - 28, dir: -1, minX: 1740, maxX: 2050 },
      { x: 2400, y: GROUND_Y - 28, dir: 1,  minX: 2250, maxX: 2700 }
    ];

    // Meta (bandera)
    const goal = { x: 2850, y: GROUND_Y - 160, w: 12, h: 160 };

    // --- Estado mutable (se reinicia) ---
    const player = { x: 60, y: 0, w: 28, h: 36, vx: 0, vy: 0, onGround: false, facing: 1 };
    let blocks, coins, goombas;
    let cameraX = 0, score = 0, lives = 3, won = false, dead = false, invuln = 0;

    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key.toLowerCase() === 'r') fullReset();
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function resetPlayer() {
      player.x = 60; player.y = 0; player.vx = 0; player.vy = 0;
      cameraX = 0; invuln = 90;
    }

    function fullReset() {
      blocks = blocksData.map(b => ({ ...b, used: false }));
      coins = coinsData.map(c => ({ ...c, taken: false }));
      goombas = goombasData.map(g => ({ ...g, w: 30, h: 28, vx: 1.2, alive: true, squashT: 0 }));
      score = 0; lives = 3; won = false; dead = false;
      resetPlayer();
    }

    function loseLife() {
      lives--;
      if (lives <= 0) { dead = true; }
      else { resetPlayer(); }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // Conjunto de sólidos con los que choca el jugador: plataformas + bloques sin usar (siguen siendo sólidos)
    function solids() {
      return platforms.concat(blocks);
    }

    function update() {
      if (won || dead) return;
      if (invuln > 0) invuln--;

      // Movimiento horizontal
      player.vx = 0;
      if (keys['arrowleft'] || keys['a']) { player.vx = -MOVE_SPEED; player.facing = -1; }
      if (keys['arrowright'] || keys['d']) { player.vx = MOVE_SPEED; player.facing = 1; }

      // Salto
      if ((keys['arrowup'] || keys['w'] || keys[' ']) && player.onGround) {
        player.vy = -JUMP_FORCE;
        player.onGround = false;
      }

      player.vy += GRAVITY;

      // --- Colisión en X ---
      player.x += player.vx;
      for (const p of solids()) {
        if (rectsOverlap(player, p)) {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
        }
      }
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > LEVEL_WIDTH) player.x = LEVEL_WIDTH - player.w;

      // --- Colisión en Y ---
      player.y += player.vy;
      player.onGround = false;
      for (const p of solids()) {
        if (rectsOverlap(player, p)) {
          if (player.vy > 0) {                 // aterriza encima
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0) {           // golpea por debajo
            player.y = p.y + p.h;
            player.vy = 0;
            // ¿es un bloque "?" sin usar? -> suelta moneda
            if (p.used === false && p.hasOwnProperty('used')) {
              p.used = true;
              score += 100;
            }
          }
        }
      }

      // Caída al vacío
      if (player.y > canvas.height + 200) loseLife();

      // --- Monedas ---
      for (const c of coins) {
        if (!c.taken && rectsOverlap(player, c)) { c.taken = true; score += 50; }
      }

      // --- Goombas ---
      for (const g of goombas) {
        if (!g.alive) { if (g.squashT > 0) g.squashT--; continue; }
        // patrulla
        g.x += g.vx * g.dir;
        if (g.x <= g.minX) { g.x = g.minX; g.dir = 1; }
        if (g.x + g.w >= g.maxX) { g.x = g.maxX - g.w; g.dir = -1; }

        if (rectsOverlap(player, g)) {
          const cayendoSobre = player.vy > 0 && (player.y + player.h) - g.y < 20;
          if (cayendoSobre) {
            g.alive = false; g.squashT = 30;
            player.vy = -JUMP_FORCE * 0.6;     // rebote
            score += 200;
          } else if (invuln === 0) {
            loseLife();
          }
        }
      }

      // Meta
      if (rectsOverlap(player, goal)) won = true;

      // Cámara
      cameraX = player.x + player.w / 2 - canvas.width / 2;
      cameraX = Math.max(0, Math.min(cameraX, LEVEL_WIDTH - canvas.width));
    }

    function draw() {
      // Cielo prehistórico (degradado cálido)
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#f7c873');
      sky.addColorStop(1, '#e89a4e');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Montañas y volcán (parallax lejano)
      drawBackdrop();

      // Nubes
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let i = 0; i < 8; i++) {
        const cx = (i * 450 - cameraX * 0.4) % LEVEL_WIDTH;
        drawCloud(cx, 60 + (i % 3) * 40);
      }

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Plataformas (tierra con hierba/musgo)
      for (const p of platforms) {
        const isGround = p.y === GROUND_Y;
        ctx.fillStyle = isGround ? '#8a5a2b' : '#9c6b3a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = isGround ? '#5a8a2b' : '#6fa03a';
        ctx.fillRect(p.x, p.y, p.w, 6);
      }

      // Rocas "?" (sueltan puntos al golpearlas desde abajo)
      for (const b of blocks) {
        ctx.fillStyle = b.used ? '#7a6f63' : '#a89484';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#5a4f45';
        ctx.lineWidth = 3;
        ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
        // grietas de la roca
        ctx.strokeStyle = '#6b6056';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x + 8, b.y + 6); ctx.lineTo(b.x + 14, b.y + 16); ctx.lineTo(b.x + 9, b.y + 26);
        ctx.moveTo(b.x + 20, b.y + 4); ctx.lineTo(b.x + 24, b.y + 14);
        ctx.stroke();
        if (!b.used) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 18px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('★', b.x + b.w / 2, b.y + b.h - 9);
        }
      }

      // Huesos (recolectables)
      for (const c of coins) {
        if (c.taken) continue;
        drawBone(c);
      }

      // Dinos
      for (const g of goombas) {
        if (!g.alive) {
          if (g.squashT > 0) {                  // animación de aplastado
            ctx.fillStyle = '#3f7a2b';
            ctx.fillRect(g.x, g.y + g.h - 8, g.w, 8);
          }
          continue;
        }
        drawDino(g);
      }

      // Meta (tótem de piedra)
      ctx.fillStyle = '#7a6f63';
      ctx.fillRect(goal.x - 8, goal.y, goal.w + 16, goal.h);
      ctx.fillStyle = '#5a4f45';
      ctx.fillRect(goal.x - 8, goal.y, goal.w + 16, 6);
      // cara tallada del tótem
      ctx.fillStyle = '#3a332c';
      ctx.fillRect(goal.x - 2, goal.y + 24, 6, 6);
      ctx.fillRect(goal.x + goal.w - 4, goal.y + 24, 6, 6);
      ctx.fillRect(goal.x, goal.y + 40, goal.w, 5);

      // Jugador (parpadea si es invulnerable)
      if (!(invuln > 0 && Math.floor(invuln / 5) % 2 === 0)) drawPlayer();

      ctx.restore();

      drawHUD();

      if (won) overlay('¡Nivel completado! 🎉', 'Pulsa R para volver a jugar', '#ffd700');
      if (dead) overlay('GAME OVER', 'Pulsa R para reiniciar', '#ff5050');
    }

    function drawHUD() {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(10, 10, 250, 36);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('🦴 ' + score, 24, 34);
      ctx.fillText('❤️ '.repeat(Math.max(0, lives)).trim() || '—', 130, 34);
    }

    function overlay(title, sub, color) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.font = 'bold 40px system-ui';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#fff';
      ctx.font = '20px system-ui';
      ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 30);
      ctx.font = '16px system-ui';
      ctx.fillText('Puntuación: ' + score, canvas.width / 2, canvas.height / 2 + 60);
    }

    function drawCloud(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 22, y + 4, 22, 0, Math.PI * 2);
      ctx.arc(x + 48, y, 18, 0, Math.PI * 2);
      ctx.fill();
    }

    // Montañas y volcán de fondo (parallax lejano)
    function drawBackdrop() {
      const off = cameraX * 0.25;
      ctx.fillStyle = '#b97a45';
      for (let i = 0; i < 10; i++) {
        const mx = i * 360 - (off % 360) - 200;
        ctx.beginPath();
        ctx.moveTo(mx, canvas.height);
        ctx.lineTo(mx + 130, 200);
        ctx.lineTo(mx + 260, canvas.height);
        ctx.fill();
      }
      // Volcán (más oscuro, con lava)
      const vx = 520 - (cameraX * 0.25) % 1200;
      ctx.fillStyle = '#7a4a28';
      ctx.beginPath();
      ctx.moveTo(vx, canvas.height);
      ctx.lineTo(vx + 90, 150);
      ctx.lineTo(vx + 130, 150);
      ctx.lineTo(vx + 220, canvas.height);
      ctx.fill();
      ctx.fillStyle = '#e8531f';      // lava en la boca
      ctx.fillRect(vx + 92, 150, 36, 14);
      ctx.fillStyle = '#f7a93b';
      ctx.fillRect(vx + 100, 150, 18, 8);
    }

    // Hueso recolectable
    function drawBone(c) {
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      ctx.fillStyle = '#f4f0e4';
      ctx.fillRect(c.x + 4, cy - 2, c.w - 8, 4);     // tallo
      ctx.beginPath();                                // nudos de los extremos
      ctx.arc(c.x + 4, cy - 3, 3, 0, Math.PI * 2);
      ctx.arc(c.x + 4, cy + 3, 3, 0, Math.PI * 2);
      ctx.arc(c.x + c.w - 4, cy - 3, 3, 0, Math.PI * 2);
      ctx.arc(c.x + c.w - 4, cy + 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Dinosaurio enemigo
    function drawDino(g) {
      const d = g.dir;                                // mira según avanza
      // cuerpo
      ctx.fillStyle = '#4f9c3a';
      ctx.beginPath();
      ctx.ellipse(g.x + g.w / 2, g.y + g.h / 2 + 2, g.w / 2, g.h / 2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();
      // cabeza
      const hx = d === 1 ? g.x + g.w - 6 : g.x - 6;
      ctx.fillRect(hx, g.y, 12, 12);
      // púas en el lomo
      ctx.fillStyle = '#357025';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(g.x + 6 + i * 7, g.y + 4);
        ctx.lineTo(g.x + 9 + i * 7, g.y - 3);
        ctx.lineTo(g.x + 12 + i * 7, g.y + 4);
        ctx.fill();
      }
      // patas
      ctx.fillRect(g.x + 4, g.y + g.h - 5, 6, 5);
      ctx.fillRect(g.x + g.w - 10, g.y + g.h - 5, 6, 5);
      // ojo
      ctx.fillStyle = '#fff';
      ctx.fillRect(hx + (d === 1 ? 5 : 2), g.y + 3, 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(hx + (d === 1 ? 6 : 3), g.y + 4, 2, 2);
    }

    // Cavernícola (jugador)
    function drawPlayer() {
      const { x, y, w, h } = player;
      // taparrabos de piel (marrón con manchas)
      ctx.fillStyle = '#7a4a1e';
      ctx.fillRect(x, y + h * 0.55, w, h * 0.45);
      ctx.fillStyle = '#5a3414';
      ctx.fillRect(x + 4, y + h * 0.62, 5, 5);
      ctx.fillRect(x + w - 10, y + h * 0.7, 5, 5);
      // torso (piel)
      ctx.fillStyle = '#d99a63';
      ctx.fillRect(x + 2, y + h * 0.32, w - 4, h * 0.25);
      // cara
      ctx.fillStyle = '#e8b07a';
      ctx.fillRect(x + 4, y + 6, w - 8, h * 0.26);
      // pelo/melena revuelta
      ctx.fillStyle = '#3a2410';
      ctx.fillRect(x + 1, y, w - 2, 7);
      ctx.fillRect(x + 1, y + 6, 4, 7);
      ctx.fillRect(x + w - 5, y + 6, 4, 7);
      // ojo
      ctx.fillStyle = '#000';
      ctx.fillRect(x + (player.facing === 1 ? w - 11 : 7), y + 13, 3, 3);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    fullReset();
    loop();
  </script>
</body>
</html>
