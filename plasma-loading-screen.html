<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pantalla de carga — Anillo de plasma</title>
<!--
  PANTALLA DE CARGA "ANILLO DE PLASMA"
  ------------------------------------
  Autocontenida: no necesita librerías ni archivos externos.

  Cómo usarla en tu página:
    1. Copia el bloque <div id="plasma-loader">...</div>, el <style> y el <script>.
    2. El loader se muestra al cargar la página.
    3. Cuando tu contenido esté listo, llama a:  PlasmaLoader.hide()
       (hace un fundido y elimina el loader del DOM).
    4. Para controlar el porcentaje manualmente:  PlasmaLoader.setProgress(0..100)
       o deja el modo automático por defecto.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ===== Loader ===== */
  #plasma-loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 1.1s ease;
  }
  #plasma-loader.hidden { opacity: 0; pointer-events: none; }

  #plasma-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Texto dentro del anillo */
  .loader-center {
    position: relative;
    z-index: 2;
    text-align: center;
    user-select: none;
    pointer-events: none;
  }
  .loader-percent {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem);
    font-weight: 200;
    letter-spacing: 0.08em;
    color: #e8e0ff;
    text-shadow: 0 0 18px rgba(150, 100, 255, 0.55);
    font-variant-numeric: tabular-nums;
  }
  .loader-label {
    margin-top: 0.5rem;
    font-size: clamp(0.6rem, 1.6vw, 0.78rem);
    font-weight: 400;
    letter-spacing: 0.55em;
    text-indent: 0.55em; /* compensa el letter-spacing del último carácter */
    color: rgba(190, 170, 230, 0.75);
    text-transform: uppercase;
    animation: label-pulse 2.4s ease-in-out infinite;
  }
  @keyframes label-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* ===== Fallback CSS si no hay WebGL ===== */
  .css-fallback-ring {
    position: absolute;
    width: min(58vmin, 420px);
    height: min(58vmin, 420px);
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #2b1bd8, #7a2bff, #ff8a2b, #b04dff, #2b34ff, #ff9a3c, #2b1bd8
    );
    -webkit-mask: radial-gradient(closest-side, transparent 78%, #000 80%, #000 92%, transparent 95%);
            mask: radial-gradient(closest-side, transparent 78%, #000 80%, #000 92%, transparent 95%);
    filter: blur(6px) saturate(1.4);
    animation: fb-spin 6s linear infinite;
  }
  @keyframes fb-spin { to { transform: rotate(360deg); } }

  /* ===== Contenido de ejemplo (tu página) ===== */
  .demo-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    color: #ddd;
    background: radial-gradient(ellipse at 50% 30%, #14101f 0%, #000 70%);
  }
  .demo-content h1 { font-weight: 300; letter-spacing: 0.05em; }
  .demo-content p  { color: #888; max-width: 34rem; text-align: center; line-height: 1.6; padding: 0 1rem; }
  .demo-content button {
    margin-top: 0.8rem;
    padding: 0.7rem 1.6rem;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #d8ccff;
    background: transparent;
    border: 1px solid rgba(150, 110, 255, 0.5);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .demo-content button:hover {
    background: rgba(110, 70, 255, 0.15);
    box-shadow: 0 0 24px rgba(120, 70, 255, 0.35);
  }
</style>
</head>
<body>

  <!-- Contenido de ejemplo que queda debajo del loader -->
  <main class="demo-content">
    <h1>Tu página ya ha cargado ✦</h1>
    <p>Esto es el contenido real del sitio. La pantalla de carga de plasma se desvanece
       automáticamente al llegar al 100&nbsp;%. Pulsa el botón para verla otra vez.</p>
    <button onclick="PlasmaLoader.replay()">Reproducir de nuevo</button>
  </main>

  <!-- ===== PANTALLA DE CARGA ===== -->
  <div id="plasma-loader">
    <canvas id="plasma-canvas"></canvas>
    <div class="loader-center">
      <div class="loader-percent" id="loader-percent">0%</div>
      <div class="loader-label">Cargando</div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     SHADER DE PLASMA
     El anillo se construye en coordenadas polares: varias capas
     de filamentos cuyo radio se desplaza con ruido fbm que fluye
     a lo largo de la circunferencia. Eso da el aspecto de seda /
     llama líquida del vídeo: vetas azul-violeta con brotes
     naranja-dorados y un halo magenta difuso.
     ============================================================ */

  const VERT = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

  const FRAG = `
    precision highp float;
    uniform vec2  u_res;
    uniform float u_time;

    /* ---- ruido de valor + fbm ---- */
    float hash(vec2 p) {
      p = fract(p * vec2(234.34, 435.345));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
      for (int i = 0; i < 5; i++) {
        v += a * noise(p);
        p = rot * p * 2.05 + 11.5;
        a *= 0.52;
      }
      return v;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
      float t = u_time;

      float r   = length(uv);
      float ang = atan(uv.y, uv.x) + t * 0.10;   /* rotación lenta global */

      float R = 0.62;                            /* radio base del anillo */
      vec3 col = vec3(0.0);

      /* ---- halo magenta difuso alrededor del anillo ---- */
      float halo = exp(-pow((r - R) / 0.30, 2.0));
      col += vec3(0.40, 0.13, 0.38) * halo * 0.10;

      /* ---- paletas ---- */
      vec3 BLUE   = vec3(0.05, 0.14, 1.10);
      vec3 VIOLET = vec3(0.55, 0.18, 1.08);
      vec3 ORANGE = vec3(1.15, 0.45, 0.08);
      vec3 GOLD   = vec3(1.20, 0.75, 0.25);

      /* ---- capas de filamentos ---- */
      for (int i = 0; i < 6; i++) {
        float fi = float(i);

        /* punto sobre la circunferencia -> el ruido es continuo en 360 grados */
        vec2 cp = vec2(cos(ang), sin(ang)) * (1.35 + fi * 0.42);

        /* dos campos de ruido fluyendo en sentidos opuestos = ondulación orgánica.
           w2 también depende del radio para que el velo sea 2D (sin rayos radiales) */
        float w1 = fbm(cp + vec2(t * 0.30 + fi * 7.31, -t * 0.16));
        float w2 = fbm(cp * 1.8 + vec2(-t * 0.22 + r * 1.4, t * 0.27) + fi * 3.7);

        /* el filamento se separa del radio base según el ruido */
        float radius = R + (w1 - 0.5) * 0.26 + (w2 - 0.5) * 0.10;
        float d = abs(r - radius);

        /* grosor variable: a veces hilo fino, a veces vela de seda ancha */
        float width = 0.004 + 0.022 * w2 * w2;

        /* núcleo brillante + cola suave (resplandor) */
        float line = exp(-d * d / (2.0 * width * width))
                   + 0.22 * exp(-d * 16.0);

        /* huecos: el filamento se desvanece por tramos, como en el vídeo */
        float gaps = smoothstep(0.30, 0.62, fbm(cp * 0.9 + fi * 13.7 + vec2(t * 0.12, 0.0)));
        line *= 0.25 + 0.75 * gaps;

        /* color: azul <-> violeta, con brotes naranja/dorados donde el ruido pica alto */
        vec3 base   = mix(BLUE, VIOLET, smoothstep(0.35, 0.85, w1));
        float spark = smoothstep(0.62, 0.82, w2);
        vec3 flame  = mix(ORANGE, GOLD, smoothstep(0.7, 0.9, w1));
        vec3 layerCol = mix(base, flame, spark);

        col += layerCol * line * 0.45;
      }

      /* ---- velos de seda anchos y translúcidos entre los hilos ---- */
      for (int i = 0; i < 3; i++) {
        float fi = float(i);
        vec2 cp = vec2(cos(ang), sin(ang)) * (1.1 + fi * 0.55);
        float w1 = fbm(cp + vec2(-t * 0.20 + fi * 19.7, t * 0.13));
        float w2 = fbm(cp * 1.5 + vec2(t * 0.17, -t * 0.21 + r * 1.2) + fi * 5.3);
        float radius = R + (w1 - 0.5) * 0.30;
        float d = abs(r - radius);
        float width = 0.045 + 0.050 * w2;
        float veil = exp(-d * d / (2.0 * width * width));
        veil *= smoothstep(0.35, 0.65, w2);          /* el velo aparece y desaparece por tramos */
        vec3 veilCol = mix(vec3(0.10, 0.16, 0.95), vec3(0.85, 0.40, 0.30),
                           smoothstep(0.55, 0.80, w1));
        col += veilCol * veil * 0.12;
      }

      /* ---- brillo interior tenue (efecto burbuja/esfera) ---- */
      float inner = smoothstep(R, R - 0.45, r);
      col += vec3(0.08, 0.05, 0.18) * inner * 0.12 * (0.6 + 0.4 * fbm(uv * 2.0 + t * 0.1));

      /* ---- tono final ---- */
      col = 1.0 - exp(-col * 1.35);          /* tone-map suave: las luces saturan a blanco */
      col = pow(col, vec3(0.95));

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  /* ============================================================
     Inicialización WebGL
     ============================================================ */
  const canvas = document.getElementById("plasma-canvas");
  const gl = canvas.getContext("webgl", { antialias: true })
          || canvas.getContext("experimental-webgl");

  let raf = null;

  function initGL() {
    if (!gl) return false;

    function compile(type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(sh));
        return null;
      }
      return sh;
    }

    const vs = compile(gl.VERTEX_SHADER, VERT);
    const fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.useProgram(prog);

    /* quad a pantalla completa */
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "a_pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes  = gl.getUniformLocation(prog, "u_res");
    const uTime = gl.getUniformLocation(prog, "u_time");

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
      }
    }
    window.addEventListener("resize", resize);

    const t0 = performance.now();
    function frame(now) {
      resize();
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, (now - t0) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return true;
  }

  if (!initGL()) {
    /* Sin WebGL: anillo CSS giratorio como alternativa */
    canvas.remove();
    const fb = document.createElement("div");
    fb.className = "css-fallback-ring";
    document.getElementById("plasma-loader").prepend(fb);
  }

  /* ============================================================
     API pública del loader + progreso simulado
     ============================================================ */
  const loaderEl  = document.getElementById("plasma-loader");
  const percentEl = document.getElementById("loader-percent");

  let progress   = 0;
  let autoTimer  = null;
  let manualMode = false;

  function render(p) {
    percentEl.textContent = Math.round(p) + "%";
  }

  function autoTick() {
    /* avance no lineal: rápido al principio, se frena cerca del final */
    const step = progress < 70 ? 1.6 : progress < 90 ? 0.7 : 0.35;
    progress = Math.min(progress + step, 100);
    render(progress);
    if (progress >= 100) {
      clearInterval(autoTimer);
      setTimeout(hide, 600);
    }
  }

  function startAuto() {
    manualMode = false;
    clearInterval(autoTimer);
    progress = 0;
    render(0);
    autoTimer = setInterval(autoTick, 60);
  }

  function hide() {
    clearInterval(autoTimer);
    loaderEl.classList.add("hidden");
    /* parar el render cuando ya no se ve, para no gastar GPU */
    setTimeout(() => { if (raf) cancelAnimationFrame(raf); raf = null; }, 1200);
  }

  function replay() {
    loaderEl.classList.remove("hidden");
    if (!raf && gl) initGL();
    startAuto();
  }

  window.PlasmaLoader = {
    hide,
    replay,
    /* Control manual del porcentaje desde tu código:
       PlasmaLoader.setProgress(42)  — al llegar a 100 se oculta solo */
    setProgress(p) {
      if (!manualMode) { manualMode = true; clearInterval(autoTimer); }
      progress = Math.max(0, Math.min(100, p));
      render(progress);
      if (progress >= 100) setTimeout(hide, 600);
    }
  };

  startAuto();
})();
</script>
</body>
</html>
