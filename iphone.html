<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verde">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Verde</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:    #FFFFFF;
      --card:  #ECE8DD;   /* beige avena (tarjetas) */
      --card2: #E2DDCF;   /* beige un punto más oscuro */
      --ink:   #131311;   /* casi negro */
      --lime:  #C7F23E;   /* verde lima eléctrico (consumido en la comida) */
      --lime-dim: #7FA22E; /* lima apagado (total del día / resto) */
      --green: #2FA84F;   /* verde check */
      --red:   #E2483D;   /* eliminar */
      --muted: #908C81;
      --line:  #E3DFD4;

      --r-lg: 24px;
      --r-md: 18px;
      --r-sm: 12px;

      --disp: 'Archivo', -apple-system, sans-serif;   /* titulares / números */
      --exp:  'Archivo', -apple-system, sans-serif;   /* display bestia (peso 900) */
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: #5A9F9F;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    html, body { height: 100%; height: 100dvh; position: fixed; width: 100%; overflow: hidden; }

    /* Fondo de agua a pantalla completa (fijo). El contenido scrollea por encima
       en toda la pantalla: nunca aparece blanco ni se corta. */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background: #5A9F9F url("water.jpg") center center / cover no-repeat;
    }

    .app {
      height: 100%;
      height: 100dvh;                 /* usa el alto real visible (evita el corte de abajo en Safari) */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;    /* sin rebote elástico → no aparece blanco al tirar */
      scroll-behavior: smooth;
      padding:
        calc(env(safe-area-inset-top) + 12px)
        18px
        calc(env(safe-area-inset-bottom) + 120px);
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .standalone .app { padding-top: calc(env(safe-area-inset-top) + 20px); }

    /* ---------- Región superior (sin fondo propio: usa el agua de pantalla completa) ---------- */
    .top-region {
      position: relative;
      margin: calc((env(safe-area-inset-top) + 12px) * -1) -18px 22px;
      padding: calc(env(safe-area-inset-top) + 16px) 18px 22px;
    }
    .standalone .top-region {
      margin-top: calc((env(safe-area-inset-top) + 20px) * -1);
      padding-top: calc(env(safe-area-inset-top) + 24px);
    }

    /* ---------- Splash de entrada (palmeras) ---------- */
    .splash {
      position: fixed; inset: 0; z-index: 200;
      background-color: #79908B;                 /* color de las palmeras (relleno) */
      background-image: url("palms.jpg");
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 0 30px calc(env(safe-area-inset-bottom) + 60px);
      opacity: 1; transition: opacity 0.65s ease;
    }
    .splash::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,0.5));
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .splash-title {
      position: relative; font-family: var(--exp); font-weight: 900;
      font-size: 58px; line-height: 0.9; letter-spacing: -0.02em;
      text-transform: uppercase; color: #fff;
    }
    .splash-sub { position: relative; margin-top: 12px; font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.9); }

    /* ---------- Cabecera ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    .greeting .eyebrow {
      font-family: var(--disp);
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }
    .greeting h1 {
      font-family: var(--exp);
      font-weight: 800; font-size: 30px; line-height: 0.98;
      letter-spacing: -0.01em; text-transform: uppercase;
      margin-top: 3px; color: var(--ink);
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--ink); color: var(--lime);
      font-family: var(--disp); font-weight: 800; font-size: 18px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* ---------- Selector de vista (pills sombreadas) ---------- */
    .view-tabs {
      display: flex; gap: 8px; overflow-x: auto;
      margin: 0 -18px 20px; padding: 0 18px 2px;
      scrollbar-width: none;
    }
    .view-tabs::-webkit-scrollbar { display: none; }
    .view-tabs button {
      flex: 0 0 auto; cursor: pointer;
      border: none; background: var(--bg); color: var(--ink);
      border-radius: 99px; padding: 9px 17px;
      font-family: var(--disp); font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: all 0.15s ease;
    }
    .view-tabs button.active { background: var(--ink); color: #fff; }

    /* ---------- Hero: contador de calorías (tarjeta negra) ---------- */
    .hero {
      background: var(--ink); color: #fff;
      border-radius: var(--r-lg);
      padding: 22px 22px 24px;
      margin-bottom: 14px;
    }
    .hero .label {
      font-family: var(--disp);
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
    }
    .hero .count {
      display: flex; align-items: baseline; gap: 8px; margin: 8px 0 4px;
    }
    .hero .count .now {
      font-family: var(--exp);
      font-weight: 900; font-size: 64px; line-height: 0.9;
      letter-spacing: -0.02em;
    }
    .hero .count .goal { font-family: var(--disp); font-weight: 700; font-size: 20px; color: rgba(255,255,255,0.45); }
    .hero .count .unit { font-family: var(--disp); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    .hero .remaining { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 18px; }
    .hero .remaining b { color: var(--lime); font-weight: 700; }

    .bar {
      height: 12px; border-radius: 99px;
      background: rgba(255,255,255,0.14); overflow: hidden; display: flex;
    }
    .bar .seg { height: 100%; background: var(--lime); width: 0; transition: width 0.8s cubic-bezier(.22,.61,.36,1); }
    .bar .seg.rest { background: var(--lime-dim); }

    /* ---------- Macros (cajetines blancos sobre el agua) ---------- */
    .macros { display: flex; flex-direction: column; gap: 10px; margin-bottom: 0; }
    .macro {
      background: var(--bg); border-radius: var(--r-md); padding: 15px 17px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .macro .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px; }
    .macro .name {
      font-family: var(--disp); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
    }
    .macro .val {
      font-family: var(--disp); font-size: 21px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em;
    }
    .macro .val span { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
    .macro .val .pct { color: var(--ink); font-weight: 700; }
    /* Mismo tratamiento que la barra de calorías: vía oscura + relleno lima idéntico */
    .macro .mini { height: 12px; border-radius: 99px; background: rgba(19,19,17,0.14); overflow: hidden; display: flex; }
    .macro .mini .seg { height: 100%; background: var(--lime); width: 0; transition: width 0.7s cubic-bezier(.22,.61,.36,1); }
    .macro .mini .seg.rest { background: var(--lime-dim); }

    /* ---------- Cabecera de sección ---------- */
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    .section-head h2 {
      font-family: var(--exp); font-weight: 800; font-size: 22px;
      letter-spacing: -0.01em; text-transform: uppercase; color: var(--ink);
    }
    .section-head .sh-meta { font-family: var(--disp); font-size: 13px; font-weight: 700; color: var(--muted); }

    .log-sub {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--disp); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      margin: 18px 2px 9px;
    }
    .log-sub .ls-kcal { margin-left: auto; color: var(--ink); }
    .log-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Tarjeta de alimento (cuadrícula, estilo producto) */
    .logf {
      border-radius: var(--r-md); overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      cursor: pointer;
    }
    .logf:active { transform: scale(0.98); }
    .logf-main {
      display: flex; flex-direction: column;
      background: var(--bg); border-radius: var(--r-md); overflow: hidden;
    }
    .logf-top {
      background: var(--card); aspect-ratio: 1 / 0.82;
      display: flex; align-items: center; justify-content: center;
    }
    .logf-emoji { font-size: 52px; line-height: 1; }
    .logf-info { padding: 12px 14px 14px; }
    .logf-name {
      font-family: var(--disp); font-size: 15px; font-weight: 800;
      letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); line-height: 1.05;
    }
    .logf-grams { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 500; }
    .logf-kcal { font-family: var(--disp); font-size: 18px; font-weight: 800; color: var(--ink); margin-top: 8px; }
    .logf-kcal span { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--muted); }

    .meal-empty {
      background: var(--card); border-radius: var(--r-md);
      padding: 26px; text-align: center; color: var(--muted); font-size: 14px; font-weight: 500;
    }

    /* ---------- Botón flotante añadir ---------- */
    .add {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(env(safe-area-inset-bottom) + 20px);
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--lime); color: var(--ink); border: none;
      font-size: 32px; font-weight: 400; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 26px rgba(19,19,17,0.22);
      cursor: pointer; transition: transform 0.15s ease;
    }
    .add:active { transform: scale(0.92); }
    .add.hidden { opacity: 0; pointer-events: none; transform: scale(0.6); }

    /* ---------- Pantalla Añadir comida (sheet) ---------- */
    .sheet {
      position: fixed; inset: 0; background: var(--bg); z-index: 50;
      display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(.22,.61,.36,1); will-change: transform;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-grip {
      width: 38px; height: 5px; border-radius: 99px; background: var(--line);
      margin: calc(env(safe-area-inset-top) + 10px) auto 0; flex-shrink: 0;
    }
    .standalone .sheet-grip { margin-top: calc(env(safe-area-inset-top) + 16px); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; flex-shrink: 0; }
    .sheet-head h2 { font-family: var(--exp); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: -0.01em; }
    .sheet-close { background: none; border: none; color: var(--ink); font-family: var(--disp); font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0; }
    .sheet-spacer { width: 48px; }

    .meal-tabs { display: flex; gap: 8px; padding: 10px 18px 4px; flex-shrink: 0; overflow-x: auto; }
    .meal-tabs button {
      flex: 1 0 auto; border: 1px solid var(--line); background: var(--card);
      color: var(--ink); border-radius: 99px; padding: 9px 16px;
      font-family: var(--disp); font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em; text-transform: uppercase; cursor: pointer;
      transition: all 0.15s ease; white-space: nowrap;
    }
    .meal-tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .search-wrap { position: relative; padding: 12px 18px 8px; flex-shrink: 0; }
    .search-ico { position: absolute; left: 32px; top: 50%; transform: translateY(-30%); font-size: 15px; opacity: 0.55; pointer-events: none; }
    .search-wrap input {
      width: 100%; border: none; background: var(--card); border-radius: var(--r-md);
      padding: 14px 14px 14px 40px; font-family: var(--sans); font-size: 16px; color: var(--ink);
      outline: none; -webkit-appearance: none;
    }
    .search-wrap input:focus { box-shadow: inset 0 0 0 2px var(--ink); }

    /* Lista de alimentos en formato cuadro, igual que la Home */
    .food-list {
      list-style: none; flex: 1; min-height: 0; overflow-y: auto;
      -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
      padding: 4px 18px calc(env(safe-area-inset-bottom) + 20px);
      display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px;
    }
    .addf {
      width: calc(50% - 6px);
      position: relative; cursor: pointer;
      background: var(--bg); border-radius: var(--r-md); overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: transform 0.12s ease;
    }
    .addf:active { transform: scale(0.97); }
    .addf-top {
      background: var(--card); height: 124px;
      display: flex; align-items: center; justify-content: center;
    }
    .addf-emoji { font-size: 50px; line-height: 1; }
    .addf-info { padding: 12px 14px 14px; }
    .addf-name {
      font-family: var(--disp); font-size: 15px; font-weight: 800;
      letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); line-height: 1.05;
    }
    .addf-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 500; }
    .addf-kcal { font-family: var(--disp); font-size: 18px; font-weight: 800; color: var(--ink); margin-top: 8px; }
    .addf-kcal span { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--muted); }
    .addf-plus {
      position: absolute; top: 8px; right: 8px;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--lime); color: var(--ink);
      font-size: 22px; font-weight: 400; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(19,19,17,0.20);
    }
    .food-empty {
      grid-column: 1 / -1; background: var(--card); border-radius: var(--r-md);
      padding: 26px; text-align: center; color: var(--muted); font-size: 14px; font-weight: 500;
    }

    .sheet-foot { flex-shrink: 0; padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px); border-top: 1px solid var(--line); background: var(--bg); }
    .confirm {
      width: 100%; border: none; background: var(--ink); color: #fff;
      border-radius: 99px; padding: 17px;
      font-family: var(--disp); font-size: 15px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
      transition: transform 0.12s ease;
    }
    .confirm:active { transform: scale(0.98); }

    /* ---------- Modal de gramos (añadir / editar) ---------- */
    .modal {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(19,19,17,0); visibility: hidden;
      transition: background 0.25s ease, visibility 0.25s ease;
    }
    .modal.open { visibility: visible; background: rgba(19,19,17,0.5); }
    .modal-card {
      width: 100%; max-width: 460px; background: var(--bg);
      border-radius: 24px 24px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom) + 20px);
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(.22,.61,.36,1);
    }
    .modal.open .modal-card { transform: translateY(0); }
    .modal-top { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
    .modal-emoji {
      width: 48px; height: 48px; border-radius: 12px; background: var(--card);
      display: flex; align-items: center; justify-content: center; font-size: 23px; flex-shrink: 0;
    }
    .modal-title { flex: 1; min-width: 0; }
    .modal-title h3 { font-family: var(--disp); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: 0.01em; color: var(--ink); }
    .modal-ref { font-size: 13px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    .grams-field {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border-radius: var(--r-md);
      padding: 10px 12px; margin-bottom: 14px;
    }
    .grams-field button {
      border: none; width: 42px; height: 42px; border-radius: 50%;
      background: var(--ink); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .grams-field .gminus { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
    .grams-field .gwrap { flex: 1; text-align: center; }
    .grams-field input {
      width: 100%; border: none; background: none; outline: none;
      font-family: var(--exp); font-weight: 900; font-size: 36px; color: var(--ink);
      text-align: center; -webkit-appearance: none; -moz-appearance: textfield; letter-spacing: -0.02em;
    }
    .grams-field input::-webkit-outer-spin-button,
    .grams-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .grams-field .gunit { font-family: var(--disp); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-top: -2px; }

    .modal-preview {
      display: flex; justify-content: space-around; text-align: center;
      background: var(--ink); border-radius: var(--r-md); padding: 14px; margin-bottom: 16px;
    }
    .modal-preview .pv-n { font-family: var(--disp); font-size: 20px; font-weight: 800; color: #fff; }
    .modal-preview .pv-n.kcal { color: var(--lime); }
    .modal-preview .pv-l { font-family: var(--disp); font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }

    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button {
      flex: 1; border: none; border-radius: 99px; padding: 16px;
      font-family: var(--disp); font-size: 14px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
    }
    .modal-actions .m-cancel { background: var(--card); color: var(--ink); }
    .modal-actions .m-delete { background: var(--red); color: #fff; flex: 0 0 auto; padding: 16px 22px; }
    .modal-actions .m-save { background: var(--ink); color: #fff; }
  </style>
</head>
<body>

 <div class="app" id="app">

  <div class="top-region">
    <header class="topbar">
      <div class="greeting">
        <h1 id="greeting">Hola</h1>
      </div>
      <div class="avatar" id="avatar">V</div>
    </header>

    <div class="view-tabs" id="viewTabs">
      <button data-view="Desayuno">Desayuno</button>
      <button data-view="Comida">Comida</button>
      <button data-view="Cena">Cena</button>
      <button data-view="Snack">Snack</button>
    </div>

    <section class="hero">
      <div class="label" id="heroLabel">Hoy</div>
      <div class="count">
        <span class="now" id="kcalNow">0</span>
        <span class="goal" id="kcalGoal">/ 0</span>
        <span class="unit">kcal</span>
      </div>
      <div class="remaining" id="kcalSub">Te quedan <b id="kcalLeft">0 kcal</b> para tu objetivo</div>
      <div class="bar">
        <span class="seg" id="kcalSel"></span>
        <span class="seg rest" id="kcalRest"></span>
      </div>
    </section>

    <section class="macros" id="macros"></section>
  </div><!-- /.top-region -->

  <div class="section-head">
    <h2 id="logTitle">Comidas de hoy</h2>
    <span class="sh-meta" id="logMeta"></span>
  </div>
  <div id="foodLog"></div>

 </div><!-- /.app -->

  <!-- ===================== Splash de entrada ===================== -->
  <div class="splash" id="splash">
    <div class="splash-title">Verde</div>
    <div class="splash-sub">Cuenta tus calorías. Easy.</div>
  </div>

  <button class="add" id="addBtn" aria-label="Añadir comida">+</button>

  <!-- ===================== Pantalla Añadir comida ===================== -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-grip"></div>
    <header class="sheet-head">
      <button class="sheet-close" id="sheetClose">Cerrar</button>
      <h2>Añadir comida</h2>
      <span class="sheet-spacer"></span>
    </header>

    <div class="meal-tabs" id="mealTabs">
      <button data-meal="Desayuno">Desayuno</button>
      <button data-meal="Comida">Comida</button>
      <button data-meal="Cena">Cena</button>
      <button data-meal="Snack">Snack</button>
    </div>

    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input id="search" type="search" placeholder="Buscar alimento…"
             autocomplete="off" autocorrect="off" autocapitalize="none">
    </div>

    <ul class="food-list" id="foodList"></ul>

    <div class="sheet-foot" id="sheetFoot">
      <button class="confirm" id="sheetDone">Hecho</button>
    </div>
  </section>

  <!-- ===================== Modal de gramos (añadir / editar) ===================== -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-emoji" id="mEmoji">🍽️</div>
        <div class="modal-title">
          <h3 id="mTitle">Alimento</h3>
          <div class="modal-ref" id="mRef">—</div>
        </div>
      </div>

      <div class="grams-field">
        <button class="gminus" id="mMinus" aria-label="Menos">−</button>
        <div class="gwrap">
          <input id="mGrams" type="number" inputmode="numeric" min="0" step="1" value="100">
          <span class="gunit">gramos</span>
        </div>
        <button class="gplus" id="mPlus" aria-label="Más">+</button>
      </div>

      <div class="modal-preview">
        <div><div class="pv-n kcal" id="pvKcal">0</div><div class="pv-l">kcal</div></div>
        <div><div class="pv-n" id="pvP">0</div><div class="pv-l">Prot</div></div>
        <div><div class="pv-n" id="pvC">0</div><div class="pv-l">Carb</div></div>
        <div><div class="pv-n" id="pvF">0</div><div class="pv-l">Grasa</div></div>
      </div>

      <div class="modal-actions">
        <button class="m-delete" id="mDelete" hidden>Eliminar</button>
        <button class="m-cancel" id="mCancel">Cancelar</button>
        <button class="m-save" id="mSave">Añadir</button>
      </div>
    </div>
  </div>

  <script>
    /* Detección modo app vs Safari */
    if (navigator.standalone === true ||
        matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('standalone');
    }

    /* Splash de entrada: se oculta sola tras un momento (o al tocar) */
    (function () {
      const splash = document.getElementById('splash');
      if (!splash) return;
      let gone = false;
      const dismiss = () => {
        if (gone) return; gone = true;
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 700);
      };
      setTimeout(dismiss, 1700);
      splash.addEventListener('click', dismiss);
    })();

    /* =========================================================
       DATOS  —  estructura lista para rellenar con Vitrubio.
       Solo hay que sustituir estos valores; la vista se pinta sola.
       ========================================================= */
    const DATA = {
      user: { name: "Verde", initial: "V" },
      // Objetivos diarios (laborables) — de Vitruvio
      goal: { kcal: 1176, protein: 140, carbs: 37, fat: 52 },
      meals: [
        // Comidas registradas hoy: { food, time, grams }
        { food: "claras_huevo",    time: "Desayuno", grams: 150 },
        { food: "arandanos",       time: "Desayuno", grams: 100 },
        { food: "pollo_solomillo", time: "Comida",   grams: 200 },
        { food: "rucula",          time: "Comida",   grams: 100 },
        { food: "queso_cottage",   time: "Snack",    grams: 100 }
      ]
    };

    /* =========================================================
       CATÁLOGO DE ALIMENTOS  —  datos nutricionales (de Vitruvio).
       Los valores kcal/protein/carbs/fat son POR la ración 'base' (en gramos).
       'ration' es solo la etiqueta de referencia que se muestra.
       Añade aquí nuevos alimentos y úsalos en DATA.meals por su clave.
       ========================================================= */
    const FOODS = {
      claras_huevo:    { name: "Claras de huevo",     emoji: "🥚", base: 150, ration: "150 ml", kcal: 63,  protein: 16.5, carbs: 0.5,  fat: 0.2 },
      jamon_serrano:   { name: "Jamón serrano",       emoji: "🍖", base: 55,  ration: "55 g",   kcal: 137, protein: 18.5, carbs: 0.6,  fat: 6.7 },
      pollo_solomillo: { name: "Solomillo de pollo",  emoji: "🍗", base: 100, ration: "100 g",  kcal: 108, protein: 22,   carbs: 0.5,  fat: 1.8 },
      fajitas:         { name: "Fajitas (sin pan)",   emoji: "🌮", base: 300, ration: "300 g",  kcal: 219, protein: 26.7, carbs: 21.9, fat: 1.8 },
      queso_cottage:   { name: "Queso Cottage",       emoji: "🧀", base: 100, ration: "100 g",  kcal: 99,  protein: 14,   carbs: 1.7,  fat: 4.0 },
      champinones:     { name: "Champiñones",         emoji: "🍄", base: 100, ration: "100 g",  kcal: 20,  protein: 2.6,  carbs: 0.8,  fat: 0.6 },
      rucula:          { name: "Rúcula",              emoji: "🥬", base: 100, ration: "100 g",  kcal: 26,  protein: 3.4,  carbs: 1.0,  fat: 0.4 },
      arandanos:       { name: "Arándanos",           emoji: "🫐", base: 100, ration: "100 g",  kcal: 57,  protein: 0.7,  carbs: 14,   fat: 0.3 },
      mermelada0:      { name: "Mermelada 0%",        emoji: "🍓", base: 25,  ration: "25 g",   kcal: 10,  protein: 0.2,  carbs: 2.9,  fat: 0 },
      platano:         { name: "Plátano",             emoji: "🍌", base: 120, ration: "120 g",  kcal: 107, protein: 1.3,  carbs: 27,   fat: 0.3 },
      queso_viejo:     { name: "Queso viejo tostado", emoji: "🧀", base: 100, ration: "100 g",  kcal: 474, protein: 27,   carbs: 1.5,  fat: 40 },
      naranja:         { name: "Naranja",             emoji: "🍊", base: 150, ration: "150 g",  kcal: 70,  protein: 1.4,  carbs: 17,   fat: 0.2 },
      sandia:          { name: "Sandía",              emoji: "🍉", base: 300, ration: "300 g",  kcal: 90,  protein: 1.8,  carbs: 21,   fat: 0.3 },
      roquefort:       { name: "Queso Roquefort",     emoji: "🧀", base: 100, ration: "100 g",  kcal: 364, protein: 19,   carbs: 0.5,  fat: 32 },
      bowl_salmon:     { name: "Bowl salmón y arroz", emoji: "🐟", base: 400, ration: "400 g",  kcal: 628, protein: 38.4, carbs: 48,   fat: 30 }
    };

    // Momentos del día (orden e icono para la Home)
    const MEAL_ORDER = ["Desayuno", "Comida", "Cena", "Snack"];
    const MEAL_ICON  = { Desayuno: "🌅", Comida: "🍽️", Cena: "🌙", Snack: "🍎" };

    // Nutrición de un alimento para una cantidad en gramos
    const round1 = (n) => Math.round(n * 10) / 10;
    function nutri(foodKey, grams) {
      const f = FOODS[foodKey];
      const r = grams / f.base;
      return {
        kcal: Math.round(f.kcal * r),
        protein: round1(f.protein * r),
        carbs: round1(f.carbs * r),
        fat: round1(f.fat * r)
      };
    }

    /* =========================================================
       PERSISTENCIA  —  el registro del día aguanta recargas (localStorage)
       ========================================================= */
    const STORE_KEY = "verde.log.v2";
    const todayKey = () => {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    };
    function loadLog() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY));
        if (raw && raw.date === todayKey() && Array.isArray(raw.meals)) {
          DATA.meals = raw.meals;            // mismo día → recuperar
        } else if (raw && raw.date !== todayKey()) {
          DATA.meals = [];                   // día nuevo → empezar vacío
        }
      } catch (e) { /* sin almacenamiento, seguimos con los datos por defecto */ }
    }
    function saveLog() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ date: todayKey(), meals: DATA.meals }));
      } catch (e) {}
    }

    /* =========================================================
       RENDER
       ========================================================= */
    const $ = (id) => document.getElementById(id);

    function hello() {
      const h = new Date().getHours();
      if (h < 6)  return "Buenas noches";
      if (h < 14) return "Buenos días";
      if (h < 21) return "Buenas tardes";
      return "Buenas noches";
    }

    // Vista activa para el filtro de estadísticas: "dia" o un momento del día
    let activeView = "dia";

    function render() {
      // Cabecera — el título muestra la fecha de hoy (mismo formato que la antigua línea pequeña)
      const d = new Date();
      $("greeting").textContent = d.toLocaleDateString("es-ES",
        { weekday: "long", day: "numeric", month: "long" }).toUpperCase();
      $("avatar").textContent = DATA.user.initial;

      // Resolver cada comida (con su índice original) y totales del día
      const sum = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
      const resolved = DATA.meals.map((m, idx) => {
        if (!FOODS[m.food]) return null;
        const n = nutri(m.food, m.grams);
        sum.kcal += n.kcal; sum.protein += n.protein; sum.carbs += n.carbs; sum.fat += n.fat;
        return { idx, food: m.food, time: m.time, grams: m.grams, n };
      }).filter(Boolean);
      sum.protein = Math.round(sum.protein);
      sum.carbs = Math.round(sum.carbs);
      sum.fat = Math.round(sum.fat);

      // Totales por momento del día
      const byMeal = {};
      MEAL_ORDER.forEach(t => byMeal[t] = { kcal: 0, protein: 0, carbs: 0, fat: 0, items: [] });
      resolved.forEach(r => {
        const b = byMeal[r.time];
        if (!b) return;
        b.kcal += r.n.kcal; b.protein += r.n.protein; b.carbs += r.n.carbs; b.fat += r.n.fat;
        b.items.push(r);
      });
      MEAL_ORDER.forEach(t => {
        const b = byMeal[t];
        b.protein = Math.round(b.protein); b.carbs = Math.round(b.carbs); b.fat = Math.round(b.fat);
      });

      const isDay = activeView === "dia";
      const view = isDay ? sum : byMeal[activeView];
      const dayKcal = sum.kcal;
      const goal = DATA.goal.kcal;

      // Chips de vista activos
      $("viewTabs").querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.view === activeView));

      // ---- Contador de calorías (hero) ----
      $("heroLabel").textContent = isDay ? "Hoy" : activeView;
      $("kcalNow").textContent = view.kcal.toLocaleString("es-ES");
      if (isDay) {
        const leftK = Math.max(0, goal - sum.kcal);
        $("kcalGoal").textContent = "/ " + goal.toLocaleString("es-ES");
        $("kcalSub").innerHTML = "Te quedan <b>" + leftK.toLocaleString("es-ES") + " kcal</b> para tu objetivo";
      } else {
        const pctDay = dayKcal > 0 ? Math.round(view.kcal / dayKcal * 100) : 0;
        $("kcalGoal").textContent = "";
        $("kcalSub").innerHTML = "<b>" + pctDay + "%</b> de las " + dayKcal.toLocaleString("es-ES") + " kcal de hoy";
      }
      const kSel = Math.min(100, Math.round(view.kcal / goal * 100));
      const kRest = isDay ? 0 : Math.min(100 - kSel, Math.round(Math.max(0, dayKcal - view.kcal) / goal * 100));
      requestAnimationFrame(() => {
        $("kcalSel").style.width = kSel + "%";
        $("kcalRest").style.width = kRest + "%";
      });

      // ---- Macros (con resaltado tipo Power BI) ----
      const macros = [
        { key: "p", name: "Proteínas",     vVal: view.protein, dVal: sum.protein, goal: DATA.goal.protein },
        { key: "c", name: "Carbohidratos", vVal: view.carbs,   dVal: sum.carbs,   goal: DATA.goal.carbs },
        { key: "f", name: "Grasas",        vVal: view.fat,     dVal: sum.fat,     goal: DATA.goal.fat }
      ];
      $("macros").innerHTML = macros.map(m => {
        const sPct = Math.min(100, Math.round(m.vVal / m.goal * 100));
        const rPct = isDay ? 0 : Math.min(100 - sPct, Math.round(Math.max(0, m.dVal - m.vVal) / m.goal * 100));
        const valText = isDay
          ? `${m.vVal}<span> / ${m.goal} g</span>`
          : `${m.vVal}<span> g · <span class="pct">${m.dVal > 0 ? Math.round(m.vVal / m.dVal * 100) : 0}%</span> del día</span>`;
        return `
          <div class="macro ${m.key}">
            <div class="top">
              <div class="name">${m.name}</div>
              <div class="val">${valText}</div>
            </div>
            <div class="mini">
              <span class="seg" data-w="${sPct}"></span>
              <span class="seg rest" data-w="${rPct}"></span>
            </div>
          </div>`;
      }).join("");

      // ---- Log de alimentos (según vista, con swipe para eliminar) ----
      $("logTitle").textContent = isDay ? "Comidas de hoy" : activeView;
      $("logMeta").textContent = view.kcal ? view.kcal.toLocaleString("es-ES") + " kcal" : "";

      const rowHTML = (r) => `
        <li class="logf" data-idx="${r.idx}">
          <div class="logf-main">
            <div class="logf-top"><span class="logf-emoji">${FOODS[r.food].emoji}</span></div>
            <div class="logf-info">
              <div class="logf-name">${FOODS[r.food].name}</div>
              <div class="logf-grams">${r.grams} g</div>
              <div class="logf-kcal">${r.n.kcal} <span>kcal</span></div>
            </div>
          </div>
        </li>`;

      const log = $("foodLog");
      if (isDay) {
        const blocks = MEAL_ORDER.map(t => {
          const b = byMeal[t];
          if (!b.items.length) return "";
          return `
            <div class="log-sub">${MEAL_ICON[t]} ${t}<span class="ls-kcal">${b.kcal} kcal</span></div>
            <ul class="log-list">${b.items.map(rowHTML).join("")}</ul>`;
        }).join("");
        log.innerHTML = blocks || `<div class="meal-empty">Aún no has registrado nada hoy</div>`;
      } else {
        const b = byMeal[activeView];
        log.innerHTML = b.items.length
          ? `<ul class="log-list">${b.items.map(rowHTML).join("")}</ul>`
          : `<div class="meal-empty">No has registrado nada en ${activeView}</div>`;
      }

      // Animar barras (segmento seleccionado + resto)
      requestAnimationFrame(() => {
        document.querySelectorAll('.macro .mini .seg').forEach(s => { s.style.width = s.dataset.w + "%"; });
      });
    }

    /* =========================================================
       SELECTOR DE VISTA (filtro de estadísticas)
       ========================================================= */
    $("viewTabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-view]");
      if (!b) return;
      // Tocar el chip activo lo deselecciona → vuelve a "día completo" (sin filtro)
      activeView = (activeView === b.dataset.view) ? "dia" : b.dataset.view;
      render();
    });

    /* =========================================================
       LOG: tocar una tarjeta para editar / eliminar (en el modal)
       ========================================================= */
    const foodLog = $("foodLog");
    foodLog.addEventListener("click", (e) => {
      const card = e.target.closest(".logf");
      if (card) openEdit(parseInt(card.dataset.idx, 10));
    });

    /* =========================================================
       PANTALLA AÑADIR COMIDA (sheet)
       ========================================================= */
    const sheet = $("sheet");
    let activeMeal = "Desayuno";

    function defaultMeal() {
      const h = new Date().getHours();
      if (h < 11) return "Desayuno";
      if (h < 16) return "Comida";
      if (h < 19) return "Snack";
      return "Cena";
    }

    function openSheet() {
      activeMeal = defaultMeal();
      $("search").value = "";
      syncTabs();
      renderFoodList();
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      $("addBtn").classList.add("hidden");
    }
    function closeSheet() {
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      $("addBtn").classList.remove("hidden");
    }
    function syncTabs() {
      $("mealTabs").querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.meal === activeMeal));
    }

    function renderFoodList() {
      const q = $("search").value.trim().toLowerCase();
      const entries = Object.entries(FOODS).filter(([, f]) =>
        !q || f.name.toLowerCase().includes(q));
      const list = $("foodList");
      if (!entries.length) {
        list.innerHTML = `<li class="food-empty">Sin resultados</li>`;
        return;
      }
      list.innerHTML = entries.map(([k, f]) => `
        <li class="addf" data-add="${k}">
          <div class="addf-top"><span class="addf-emoji">${f.emoji}</span></div>
          <div class="addf-info">
            <div class="addf-name">${f.name}</div>
            <div class="addf-sub">${f.ration}</div>
            <div class="addf-kcal">${f.kcal} <span>kcal</span></div>
          </div>
          <div class="addf-plus">+</div>
        </li>`).join("");
    }

    $("addBtn").addEventListener("click", openSheet);
    $("sheetClose").addEventListener("click", closeSheet);
    $("sheetDone").addEventListener("click", closeSheet);
    $("search").addEventListener("input", renderFoodList);

    $("mealTabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-meal]");
      if (!b) return;
      activeMeal = b.dataset.meal;
      syncTabs();
    });

    $("foodList").addEventListener("click", (e) => {
      const li = e.target.closest("[data-add]");
      if (li) openAdd(li.dataset.add, activeMeal);
    });

    /* =========================================================
       MODAL DE GRAMOS  (sirve para añadir y para editar/eliminar)
       ========================================================= */
    const modal = $("modal");
    let modalState = null;   // { mode:'add'|'edit', foodKey, time, idx }

    function showModal() {
      const f = FOODS[modalState.foodKey];
      $("mEmoji").textContent = f.emoji;
      $("mTitle").textContent = f.name;
      $("mRef").textContent = "Referencia: " + f.ration + " · " + f.kcal + " kcal";
      $("mDelete").hidden = modalState.mode !== "edit";
      $("mSave").textContent = modalState.mode === "edit" ? "Guardar" : "Añadir";
      updatePreview();
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalState = null;
    }

    function openAdd(foodKey, time) {
      modalState = { mode: "add", foodKey, time };
      $("mGrams").value = FOODS[foodKey].base;
      showModal();
    }
    function openEdit(idx) {
      const meal = DATA.meals[idx];
      if (!meal || !FOODS[meal.food]) return;
      modalState = { mode: "edit", foodKey: meal.food, idx };
      $("mGrams").value = meal.grams;
      showModal();
    }

    function currentGrams() {
      const v = parseInt($("mGrams").value, 10);
      return isNaN(v) ? 0 : Math.max(0, v);
    }
    function setGrams(v) {
      $("mGrams").value = Math.max(0, v);
      updatePreview();
    }
    function updatePreview() {
      const n = nutri(modalState.foodKey, currentGrams());
      $("pvKcal").textContent = n.kcal;
      $("pvP").textContent = n.protein;
      $("pvC").textContent = n.carbs;
      $("pvF").textContent = n.fat;
    }

    $("mGrams").addEventListener("input", updatePreview);
    $("mPlus").addEventListener("click", () => setGrams(currentGrams() + 10));
    $("mMinus").addEventListener("click", () => setGrams(currentGrams() - 10));
    $("mCancel").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

    $("mSave").addEventListener("click", () => {
      const g = Math.max(1, currentGrams());
      if (modalState.mode === "add") {
        DATA.meals.push({ food: modalState.foodKey, time: modalState.time, grams: g });
      } else {
        DATA.meals[modalState.idx].grams = g;
      }
      saveLog();
      render();
      closeModal();
    });

    $("mDelete").addEventListener("click", () => {
      if (modalState.mode === "edit") {
        DATA.meals.splice(modalState.idx, 1);
        saveLog();
        render();
      }
      closeModal();
    });

    /* ---------- Arranque ---------- */
    loadLog();
    render();
  </script>
</body>
</html>
