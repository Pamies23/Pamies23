<!-- iOS / PWA: pantalla completa al añadir a inicio -->

<meta name="theme-color" content="#79bda6" />
<script>
  // Aplica el tema guardado ANTES del primer pintado: Safari decide el tinte
  // de la barra de estado al parsear, y mutarlo después es poco fiable (la
  // franja del notch quedaba desincronizada). Clase en <html> + meta en head.
  (() => {
    try {
      if (localStorage.getItem('nre-theme') === 'ocean') {
        document.documentElement.classList.add('theme-ocean');
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', '#bfd2d8');
      }
    } catch (_) {}
  })();
</script>

<style>
  :root {
    --bg: #f4f5fa;
    --card: #ffffff;
    --ink: #14151a;
    --ink-soft: #6b7080;
    --ink-faint: #9aa0ae;
    --accent: #5b5bf0;
    --accent-soft: #ececfe;
    --positive: #1fc787;
    --negative: #ff5c7a;
    --radius-xl: 30px;
    --radius-lg: 24px;
    --radius-md: 18px;
    --shadow: 0 18px 50px -22px rgba(20, 21, 40, 0.20);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* ---- temas de fondo (degradado claro arriba → oscuro abajo) ---- */
    --grad-top: #79bda6;
    --scrim-rgb: 121, 189, 166;
  }
  /* la clase de tema vive en <html>: se aplica en el <head> antes de pintar */
  html.theme-ocean {
    --grad-top: #bfd2d8;
    --scrim-rgb: 191, 210, 216;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }
  /* el lienzo raíz también del color del tope: es lo que Safari muestrea
     para tintar la franja del notch si decide ignorar el theme-color */
  html { background: var(--grad-top); transition: background 0.5s ease; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    /* mismo color que el tope del degradado: Safari pinta con él la franja
       de la barra de estado / Dynamic Island, manteniendo la continuidad */
    background: var(--grad-top);
    color: var(--ink);
    transition: background 0.5s ease;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  /* ---------- fondo FIJO: el contenido se desliza por encima ----------
     El degradado va de claro (arriba) a oscuro (abajo). Como las tarjetas
     son de cristal con backdrop-filter, al hacer scroll van muestreando la
     zona del fondo que tienen detrás y su tinte cambia con la posición. */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(180deg,
      #79bda6 0%, #569681 26%, #3a7261 52%, #27554a 76%, #18382f 100%);
    overflow: hidden;
    pointer-events: none;
  }
  /* los degradados CSS no se interpolan: el cambio de tema se hace por
     crossfade de una segunda capa con el degradado océano encima */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #bfd2d8 0%, #8ea6ad 26%, #5c7981 52%, #2e5059 76%, #002731 100%);
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  html.theme-ocean .bg::after { opacity: 1; }
  .blobs {
    position: absolute;
    inset: 0;
    z-index: 1;
    filter: blur(60px) saturate(120%);
    will-change: transform;
  }
  .blob { position: absolute; border-radius: 50%; opacity: 0.34; will-change: transform; }
  .blob-1 {
    width: 90vw; height: 90vw;
    background: radial-gradient(circle at 30% 30%, #d6f6e7, transparent 65%);
    top: -34vw; left: -25vw;
    animation: drift1 24s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 80vw; height: 80vw;
    background: radial-gradient(circle at 60% 40%, #8fe0c4, transparent 65%);
    bottom: -25vw; right: -22vw;
    animation: drift2 30s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 65vw; height: 65vw;
    background: radial-gradient(circle at 50% 50%, #b9efd9, transparent 65%);
    top: 35%; left: 40%;
    animation: drift3 34s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(12vw, 8vw) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-10vw, -10vw) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-12vw, 8vw) scale(0.88); } }

  /* ---------- shell ---------- */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100%;
    padding: calc(var(--safe-top) + 8px) 14px calc(var(--safe-bottom) + 72px);
    max-width: 520px;
    margin: 0 auto;
  }

  /* ---------- velo superior: funde el contenido con el fondo bajo la
     Dynamic Island. Mismo color que el tope del degradado, desvaneciéndose
     hacia abajo, para que no haya recuadro ni línea de corte: un único fondo
     continuo en el que el contenido se degrada al subir. ---------- */
  /* Liquid glass progresivo en dos capas apiladas: la suave llega más abajo
     y la intensa se concentra arriba. Al superponerse, el blur crece de forma
     continua hacia la barra de estado sin ninguna costura visible, y muere
     justo antes del borde de la primera tarjeta. */
  .topscrim-soft {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(var(--safe-top) + 64px);
    -webkit-backdrop-filter: blur(7px) saturate(150%);
    backdrop-filter: blur(7px) saturate(150%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 40%, rgba(0,0,0,0.5) 72%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 40%, rgba(0,0,0,0.5) 72%, transparent 100%);
    z-index: 9;
    pointer-events: none;
  }
  .topscrim {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(var(--safe-top) + 54px);
    -webkit-backdrop-filter: blur(14px) saturate(170%);
    backdrop-filter: blur(14px) saturate(170%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, rgba(0,0,0,0.4) 78%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 45%, rgba(0,0,0,0.4) 78%, transparent 100%);
    /* Película del color del fondo: opaca SOLO en el borde superior, para
       empalmar sin costura con la franja que pinta Safari/el notch, y
       desvaneciéndose enseguida. El contenido llega arriba y se le ve a
       través del cristal, cada vez más tenue — como Revolut. */
    background: linear-gradient(180deg,
      rgba(var(--scrim-rgb), 0.90) 0%,
      rgba(var(--scrim-rgb), 0.55) 34%,
      rgba(var(--scrim-rgb), 0.16) 68%,
      rgba(var(--scrim-rgb), 0) 100%);
    z-index: 10;
    pointer-events: none;
  }

  /* ---------- título: texto sobre el fondo continuo, sin pastilla ---------- */
  .topbar {
    position: sticky;
    top: calc(var(--safe-top) + 6px);
    z-index: 20;
    padding: 8px 14px 14px;
    margin-bottom: 14px;
  }
  .topbar h1 {
    font-size: 17px; font-weight: 700; color: #fff;
    letter-spacing: 0.14em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(20,50,40,0.18);
  }
  .topbar p {
    font-size: 11.5px; color: rgba(255,255,255,0.72); margin-top: 2px; letter-spacing: 0.01em;
    text-shadow: 0 1px 6px rgba(20,50,40,0.14);
  }

  /* ---------- liquid glass ----------
     Relleno muy ligero para que el cristal deje pasar el tono del fondo:
     la tarjeta se aclara u oscurece según la zona del degradado que cruza. */
  .card {
    position: relative;
    background: linear-gradient(155deg, rgba(255,255,255,0.15), rgba(255,255,255,0.04));
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    backdrop-filter: blur(30px) saturate(190%);
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: var(--radius-xl);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.32);
    padding: 22px;
    margin-bottom: 16px;
  }

  /* ---------- hero ---------- */
  .hero .label {
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.72);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .hero .big {
    font-size: 38px; font-weight: 700; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; margin: 4px 0 2px;
    line-height: 1.05; color: #fff;
  }
  .hero .big.pos, .hero .big.neg { color: #fff; }
  .hero .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.82);
    background: rgba(255,255,255,0.12); border-radius: 999px; padding: 5px 12px;
    margin-top: 4px;
    border: 1px solid rgba(255,255,255,0.14);
  }
  .chip .arrow { font-weight: 800; }
  .chip.pos { color: #3fe7ab; background: rgba(63,231,171,0.16); border-color: rgba(63,231,171,0.22); }
  .chip.neg { color: #ff8097; background: rgba(255,128,151,0.16); border-color: rgba(255,128,151,0.22); }

  /* ---------- chart ---------- */
  .chart-wrap { position: relative; width: 100%; margin-top: 14px; touch-action: pan-y; }
  svg { display: block; width: 100%; height: auto; }

  .tooltip {
    position: absolute;
    background: var(--ink); color: #fff;
    border-radius: 14px; padding: 9px 13px;
    font-size: 12px; line-height: 1.45;
    pointer-events: none; opacity: 0; white-space: nowrap;
    transform: translate(-50%, -8px) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,0.4);
    z-index: 5;
  }
  .tooltip.show { opacity: 1; transform: translate(-50%, -14px) scale(1); }
  .tooltip .ty { color: #b9bdc9; font-size: 11px; }
  .tooltip .tv { font-weight: 700; font-size: 14px; }

  /* ---------- metric strip ---------- */
  .metrics {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 18px;
  }
  .metric {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-md); padding: 13px 12px;
  }
  .metric .k {
    font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px;
  }
  .metric .v {
    font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .metric .v.pos, .metric .v.neg { color: #fff; }

  /* ---------- inputs como filas (nombre · cifra) ---------- */
  .section-title {
    font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.62);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 4px 6px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 15px 4px;
  }
  .row-name { font-size: 15.5px; font-weight: 500; color: #fff; letter-spacing: 0.01em; }
  .row-val { display: flex; align-items: center; gap: 6px; }
  .row-val input {
    font-family: inherit;
    font-size: 18px;            /* >=16px evita el zoom de iOS al enfocar */
    font-weight: 600; color: #fff;
    text-align: right;
    border: none; background: transparent; outline: none;
    padding: 4px 2px; margin: -4px 0;
    width: 130px; max-width: 46vw;
    font-variant-numeric: tabular-nums;
    appearance: none;
    transition: color 0.2s ease;
  }
  .row-val input:focus { color: #5fe7c0; }
  .row-val input[type="date"] { width: 150px; color-scheme: dark; }
  .row-val .unit { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.5); white-space: nowrap; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .foot {
    text-align: center; font-size: 11px; color: rgba(255,255,255,0.7);
    padding: 10px 20px 0; line-height: 1.6;
  }
  .foot a { color: #fff !important; }

  /* ---------- vistas: entran con un fundido ascendente ---------- */
  .view[hidden] { display: none; }
  .view { animation: viewIn 0.38s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(12px) scale(0.992); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- ajustes: selector de fondo ---------- */
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
  .swatch {
    position: relative;
    border: 1px solid rgba(255,255,255,0.18);
    background: transparent;
    border-radius: var(--radius-md);
    padding: 10px; cursor: pointer;
    font-family: inherit;
    transition: border-color 0.25s ease, transform 0.15s ease;
  }
  .swatch:active { transform: scale(0.98); }
  .swatch.active { border-color: rgba(255,255,255,0.9); }
  .swatch-prev {
    display: block; height: 92px; border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .prev-green { background: linear-gradient(180deg, #79bda6, #3a7261 55%, #18382f); }
  .prev-ocean { background: linear-gradient(180deg, #bfd2d8, #5c7981 55%, #002731); }
  .swatch-label {
    display: block; text-align: center; color: #fff;
    font-size: 13px; font-weight: 600; margin-top: 10px;
  }
  .swatch-check {
    position: absolute; top: 16px; right: 16px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; color: #1c3b32; font-size: 14px; font-weight: 800;
    display: grid; place-items: center;
    opacity: 0; transform: scale(0.6); transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .swatch.active .swatch-check { opacity: 1; transform: scale(1); }

  /* ---------- menú inferior: cristal bien marcado ---------- */
  .tabbar {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(var(--safe-bottom) + 10px);
    z-index: 30;
    display: flex; gap: 4px;
    padding: 4px;
    border-radius: 20px;
    background: linear-gradient(155deg, rgba(255,255,255,0.26), rgba(255,255,255,0.10));
    -webkit-backdrop-filter: blur(34px) saturate(200%);
    backdrop-filter: blur(34px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.30);
    box-shadow: 0 14px 36px -12px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.4);
  }
  /* píldora deslizante bajo la pestaña activa, como en iOS */
  .tab-pill {
    position: absolute;
    top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 12px) / 2);
    border-radius: 16px;
    background: rgba(255,255,255,0.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.38s cubic-bezier(0.3, 1.3, 0.4, 1);
    pointer-events: none;
  }
  .tabbar.on-ajustes .tab-pill { transform: translateX(calc(100% + 4px)); }
  .tab {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    flex: 1; min-width: 88px; padding: 4px 16px;
    border: none; background: transparent; cursor: pointer;
    border-radius: 16px;
    color: rgba(255,255,255,0.62);
    font-family: inherit; font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.03em;
    transition: color 0.3s ease, transform 0.15s ease;
  }
  .tab:active { transform: scale(0.95); }
  .tab svg { width: 16px; height: 16px; display: block; }
  .tab.active { color: #fff; }
</style>
</head>
<body>

<div class="bg">
  <div class="blobs" id="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
</div>

<div class="app">
  <div class="topscrim-soft"></div>
  <div class="topscrim"></div>
  <div class="topbar">
    <h1>NRE Real Estate</h1>
  </div>

  <!-- ============ VISTA: ANÁLISIS ============ -->
  <div id="view-analisis" class="view">

  <!-- ===== hero / gráfica ===== -->
  <div class="card hero">
    <div class="label">Beneficio neto del inversor</div>
    <div class="big" id="hProfit">—</div>
    <div class="chip" id="hChip"><span class="arrow">↑</span><span id="hChipTxt">—</span></div>

    <div class="chart-wrap" id="chartWrap">
      <svg id="chart" viewBox="0 0 390 300" role="img" aria-label="Gráfica de cashflow acumulado">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5b5bf0" stop-opacity="0.26"/>
            <stop offset="100%" stop-color="#5b5bf0" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7b6cf6"/>
            <stop offset="100%" stop-color="#4f8df9"/>
          </linearGradient>
        </defs>
        <path id="area" fill="url(#areaGrad)"></path>
        <!-- línea de 0 -->
        <line id="zeroLine" stroke="rgba(255,255,255,0.42)" stroke-width="1.25" stroke-dasharray="1 7" stroke-linecap="round"></line>
        <path id="line" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <g id="xLabels"></g>
        <g id="hoverLayer" style="opacity:0; transition: opacity 0.18s ease;">
          <line id="hoverLine" stroke="#c3c6d4" stroke-width="1.4" stroke-dasharray="3 4"></line>
          <circle id="hoverDot" r="6" fill="#fff" stroke="#5b5bf0" stroke-width="3.5"></circle>
        </g>
      </svg>
      <div class="tooltip" id="tooltip">
        <div class="ty" id="ttYear"></div>
        <div class="tv" id="ttValue"></div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="k">Capital</div>
        <div class="v" id="mEquity">—</div>
      </div>
      <div class="metric">
        <div class="k">Multiplic.</div>
        <div class="v" id="mMoic">—</div>
      </div>
      <div class="metric">
        <div class="k">TIR</div>
        <div class="v" id="mIrr">—</div>
      </div>
    </div>
  </div>

  <!-- ===== inputs ===== -->
  <div class="card">
    <div class="section-title">Tu inversión</div>

    <div class="row">
      <span class="row-name">Equity</span>
      <span class="row-val">
        <input id="equity" class="num" type="text" inputmode="numeric" autocomplete="off">
        <span class="unit">€</span>
      </span>
    </div>

    <div class="row">
      <span class="row-name">Deuda</span>
      <span class="row-val">
        <input id="debt" class="num" type="text" inputmode="numeric" autocomplete="off">
        <span class="unit">€</span>
      </span>
    </div>

    <div class="row">
      <span class="row-name">Cashflow anual</span>
      <span class="row-val">
        <input id="cashflow" class="num" data-signed="1" type="text" inputmode="numeric" autocomplete="off">
        <span class="unit">€/año</span>
      </span>
    </div>

    <div class="row">
      <span class="row-name">Valor de venta</span>
      <span class="row-val">
        <input id="saleValue" class="num" type="text" inputmode="numeric" autocomplete="off">
        <span class="unit">€</span>
      </span>
    </div>

    <div class="row">
      <span class="row-name">Fecha de venta</span>
      <span class="row-val">
        <input id="saleDate" type="date">
      </span>
    </div>
  </div>

  <div class="foot">
    <a href="index.html?desktop=1" style="color:var(--accent);font-weight:600;text-decoration:none;">Ver versión de escritorio →</a>
  </div>

  </div><!-- /view-analisis -->

  <!-- ============ VISTA: AJUSTES ============ -->
  <div id="view-ajustes" class="view" hidden>
    <div class="card">
      <div class="section-title">Color de fondo</div>
      <div class="swatches">
        <button class="swatch active" data-theme="green" type="button">
          <span class="swatch-prev prev-green"></span>
          <span class="swatch-label">Verde</span>
          <span class="swatch-check">✓</span>
        </button>
        <button class="swatch" data-theme="ocean" type="button">
          <span class="swatch-prev prev-ocean"></span>
          <span class="swatch-label">Océano</span>
          <span class="swatch-check">✓</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ menú inferior ============ -->
  <nav class="tabbar" id="tabbar">
    <span class="tab-pill"></span>
    <button class="tab active" data-view="analisis" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/><path d="M7 14l3.5-4 3 3L21 7"/>
      </svg>
      Análisis
    </button>
    <button class="tab" data-view="ajustes" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Ajustes
    </button>
  </nav>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const fmtEUR = n => n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const fmtEURshort = n => {
    const a = Math.abs(n);
    if (a >= 1e6) return (n/1e6).toLocaleString('es-ES',{maximumFractionDigits:2}) + 'M €';
    if (a >= 1e4) return Math.round(n/1e3).toLocaleString('es-ES') + 'k €';
    return fmtEUR(n);
  };
  const fmtPct = n => (n * 100).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' %';

  // ---------- formato de miles (1.234.567) ----------
  const groupThousands = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  // normaliza lo tecleado a "signo + dígitos" y devuelve display + valor numérico
  function sanitizeNum(raw, allowNeg) {
    const neg = allowNeg && /^\s*-/.test(raw);
    let digits = raw.replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
    const display = (neg ? '-' : '') + (digits === '' ? '' : groupThousands(digits));
    const value = (digits === '' ? 0 : parseInt(digits, 10)) * (neg ? -1 : 1);
    return { display, value };
  }
  const fmtModel = (n, allowNeg) => sanitizeNum(String(n), allowNeg).display;

  // ---------- modelo (valores numéricos en memoria) ----------
  const model = { equity: 100000, debt: 150000, cashflow: 12000, saleValue: 320000 };
  const NUM_FIELDS = [
    { id: 'equity', signed: false },
    { id: 'debt', signed: false },
    { id: 'cashflow', signed: true },   // el cashflow puede ser negativo
    { id: 'saleValue', signed: false },
  ];

  // fecha de venta por defecto: +10 años
  const defDate = new Date();
  defDate.setFullYear(defDate.getFullYear() + 10);
  $('saleDate').value = defDate.toISOString().slice(0, 10);

  // pinta los valores iniciales ya formateados con puntos de miles
  NUM_FIELDS.forEach(f => { $(f.id).value = fmtModel(model[f.id], f.signed); });

  function readInputs() {
    const now = new Date();
    const sale = new Date($('saleDate').value);
    let years = isNaN(sale) ? 10 : Math.round((sale - now) / (365.25 * 24 * 3600 * 1000));
    years = Math.min(40, Math.max(1, years));
    return {
      equity: Math.max(0, model.equity),
      debt: Math.max(0, model.debt),
      cashflow: model.cashflow,
      saleValue: Math.max(0, model.saleValue),
      years, startYear: now.getFullYear(),
    };
  }

  function buildFlows({ equity, debt, cashflow, saleValue, years }) {
    const flows = [-equity];
    for (let y = 1; y <= years; y++) flows.push(cashflow);
    flows[years] += saleValue - debt; // venta: precio neto de devolución de deuda
    return flows;
  }

  function cumulative(flows) {
    const out = []; let acc = 0;
    for (const f of flows) { acc += f; out.push(acc); }
    return out;
  }

  // TIR (IRR): tasa que hace VAN = 0. Requiere al menos un cambio de signo en los flujos.
  // Barremos un rango amplio para encontrar el primer tramo donde el VAN cambia de signo
  // y afinamos con bisección. Robusto ante flujos intermedios negativos.
  function irr(flows) {
    const npv = r => flows.reduce((s, f, t) => s + f / Math.pow(1 + r, t), 0);
    if (!flows.some(f => f > 0) || !flows.some(f => f < 0)) return null;
    let prevR = -0.99, prevV = npv(prevR);
    for (let r = -0.98; r <= 5; r += 0.005) {
      const v = npv(r);
      if (prevV === 0) return prevR;
      if (prevV * v < 0) {                  // cruce localizado en [prevR, r]
        let lo = prevR, hi = r;
        for (let i = 0; i < 100; i++) {
          const mid = (lo + hi) / 2;
          (npv(lo) * npv(mid) <= 0) ? (hi = mid) : (lo = mid);
        }
        return (lo + hi) / 2;
      }
      prevR = r; prevV = v;
    }
    return null;
  }

  // ---------- geometría (espacio de coordenadas del viewBox) ----------
  const W = 390, H = 300;
  const PAD = { top: 18, right: 14, bottom: 34, left: 14 };
  const IW = W - PAD.left - PAD.right;
  const IH = H - PAD.top - PAD.bottom;

  function computePoints(cum) {
    const n = cum.length;
    let min = Math.min(0, ...cum);
    let max = Math.max(0, ...cum);
    if (max === min) { max += 1; min -= 1; }
    const span = max - min;
    min -= span * 0.10; max += span * 0.10;
    const x = i => PAD.left + (n === 1 ? IW / 2 : (i / (n - 1)) * IW);
    const y = v => PAD.top + (1 - (v - min) / (max - min)) * IH;
    return { pts: cum.map((v, i) => ({ x: x(i), y: y(v), v })), zeroY: y(0) };
  }

  function smoothPath(pts) {
    if (pts.length < 2) return '';
    let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i], p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return d;
  }

  // ---------- animación fluida entre estados ----------
  let currentPts = null, animFrame = null, displayState = null;

  function resamplePoints(pts, n) {
    if (pts.length === n) return pts;
    const out = [];
    for (let i = 0; i < n; i++) {
      const t = (i / (n - 1)) * (pts.length - 1);
      const lo = Math.floor(t), hi = Math.min(pts.length - 1, lo + 1), f = t - lo;
      out.push({
        x: pts[lo].x + (pts[hi].x - pts[lo].x) * f,
        y: pts[lo].y + (pts[hi].y - pts[lo].y) * f,
        v: pts[lo].v + (pts[hi].v - pts[lo].v) * f,
      });
    }
    return out;
  }

  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function render(pts, zeroY) {
    $('line').setAttribute('d', smoothPath(pts));
    const last = pts[pts.length - 1], first = pts[0];
    const baseline = H - PAD.bottom + 2;
    $('area').setAttribute('d',
      smoothPath(pts) + ` L ${last.x.toFixed(2)} ${baseline} L ${first.x.toFixed(2)} ${baseline} Z`);
    const z = $('zeroLine');
    z.setAttribute('x1', PAD.left); z.setAttribute('x2', W - PAD.right);
    z.setAttribute('y1', zeroY); z.setAttribute('y2', zeroY);
  }

  function animateTo(target) {
    if (animFrame) cancelAnimationFrame(animFrame);
    const n = target.pts.length;
    const from = currentPts ? resamplePoints(currentPts, n)
      : target.pts.map(p => ({ x: p.x, y: H - PAD.bottom, v: 0 }));
    const fromZero = displayState ? displayState.zeroY : target.zeroY;
    const t0 = performance.now(), DUR = 650;
    const step = now => {
      const t = Math.min(1, (now - t0) / DUR), e = easeOut(t);
      const pts = target.pts.map((p, i) => ({
        x: from[i].x + (p.x - from[i].x) * e,
        y: from[i].y + (p.y - from[i].y) * e, v: p.v,
      }));
      const zeroY = fromZero + (target.zeroY - fromZero) * e;
      render(pts, zeroY);
      currentPts = pts;
      if (t < 1) animFrame = requestAnimationFrame(step);
    };
    animFrame = requestAnimationFrame(step);
    displayState = target;
  }

  function drawLabels(years, startYear) {
    const g = $('xLabels'); g.innerHTML = '';
    const n = years + 1, maxLabels = 5;
    const stride = Math.max(1, Math.ceil(n / maxLabels));
    const idx = new Set();
    for (let i = 0; i < n; i += stride) idx.add(i);
    idx.add(n - 1);
    [...idx].forEach(i => {
      const x = PAD.left + (i / (n - 1)) * IW;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      el.setAttribute('x', x); el.setAttribute('y', H - 12);
      el.setAttribute('text-anchor', i === 0 ? 'start' : (i === n-1 ? 'end' : 'middle'));
      el.setAttribute('font-size', '11'); el.setAttribute('font-weight', '600');
      el.setAttribute('fill', 'rgba(255,255,255,0.55)');
      el.textContent = "'" + String(startYear + i).slice(2);
      g.appendChild(el);
    });
  }

  // ---------- count-up de métricas ----------
  const metricState = {};
  function setMetric(id, value, format) {
    const el = $(id);
    const from = metricState[id] ?? 0;
    metricState[id] = value;
    const t0 = performance.now(), DUR = 600;
    const step = now => {
      const t = Math.min(1, (now - t0) / DUR);
      el.textContent = format(from + (value - from) * easeOut(t));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ---------- update ----------
  function update() {
    const inp = readInputs();
    const flows = buildFlows(inp);
    const cum = cumulative(flows);
    const { pts, zeroY } = computePoints(cum);

    animateTo({ pts, zeroY, years: inp.years, startYear: inp.startYear });
    drawLabels(inp.years, inp.startYear);

    const profit = cum[cum.length - 1];
    const moic = inp.equity > 0 ? (profit + inp.equity) / inp.equity : 0;
    const r = irr(flows);

    // hero
    setMetric('hProfit', profit, fmtEUR);
    $('hProfit').classList.toggle('pos', profit >= 0);
    $('hProfit').classList.toggle('neg', profit < 0);
    const chip = $('hChip');
    chip.classList.toggle('pos', profit >= 0);
    chip.classList.toggle('neg', profit < 0);
    chip.querySelector('.arrow').textContent = profit >= 0 ? '↑' : '↓';
    $('hChipTxt').textContent = inp.equity > 0
      ? fmtPct(profit / inp.equity) + ' sobre equity'
      : '—';

    setMetric('mEquity', inp.equity, fmtEURshort);
    setMetric('mMoic', moic, v => v.toLocaleString('es-ES', { maximumFractionDigits: 2 }) + '×');
    if (r === null) { $('mIrr').textContent = '—'; }
    else {
      setMetric('mIrr', r, fmtPct);
      $('mIrr').classList.toggle('pos', r >= 0);
      $('mIrr').classList.toggle('neg', r < 0);
    }
  }

  // ---------- inputs numéricos ----------
  NUM_FIELDS.forEach(({ id, signed }) => {
    const el = $(id);
    // (3) al enfocar se vacía: tecleas el número nuevo sin tener que borrar
    el.addEventListener('focus', () => { el.value = ''; });
    // (1) al escribir: separador de miles en vivo y modelo actualizado al instante
    el.addEventListener('input', () => {
      const { display, value } = sanitizeNum(el.value, signed);
      el.value = display;
      const end = el.value.length;           // cursor al final (escribimos desde vacío)
      try { el.setSelectionRange(end, end); } catch (_) {}
      model[id] = value;
      update();
    });
    // al salir, si quedó vacío restauramos el último valor formateado
    el.addEventListener('blur', () => { el.value = fmtModel(model[id], signed); });
  });
  $('saleDate').addEventListener('input', update);

  // ---------- scrubbing táctil ----------
  const svg = $('chart'), wrap = $('chartWrap'), tip = $('tooltip');
  const hoverLayer = $('hoverLayer'), hoverLine = $('hoverLine'), hoverDot = $('hoverDot');

  function scrub(clientX) {
    if (!displayState) return;
    const rect = svg.getBoundingClientRect();
    const sx = ((clientX - rect.left) / rect.width) * W;
    const { pts, years, startYear } = displayState;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(p.x - sx); if (d < bd) { bd = d; best = i; } });
    const p = pts[best];
    hoverLayer.style.opacity = 1;
    hoverLine.setAttribute('x1', p.x); hoverLine.setAttribute('x2', p.x);
    hoverLine.setAttribute('y1', PAD.top); hoverLine.setAttribute('y2', H - PAD.bottom);
    hoverDot.setAttribute('cx', p.x); hoverDot.setAttribute('cy', p.y);
    const wr = wrap.getBoundingClientRect();
    tip.style.left = (p.x / W) * wr.width + 'px';
    tip.style.top = (p.y / H) * wr.height + 'px';
    tip.classList.add('show');
    $('ttYear').textContent = best === 0 ? `${startYear} · inversión`
      : (best === years ? `${startYear + best} · venta` : `${startYear + best}`);
    $('ttValue').textContent = fmtEUR(p.v);
  }
  let hideTimer = null;
  function endScrub(delay = 0) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      hoverLayer.style.opacity = 0;
      tip.classList.remove('show');
    }, delay);
  }

  // puntero (cubre ratón y dedo)
  svg.addEventListener('pointerdown', e => { clearTimeout(hideTimer); scrub(e.clientX); });
  svg.addEventListener('pointermove', e => { if (e.pressure > 0 || e.buttons || e.pointerType === 'mouse') scrub(e.clientX); });
  // al levantar el dedo, dejamos el valor visible un instante; con ratón se oculta al salir
  svg.addEventListener('pointerup', e => endScrub(e.pointerType === 'mouse' ? 0 : 1100));
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') endScrub(0); });
  svg.addEventListener('pointercancel', () => endScrub(0));

  // ---------- navegación por pestañas ----------
  const views = { analisis: $('view-analisis'), ajustes: $('view-ajustes') };
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const v = tab.dataset.view;
      if (!views[v].hidden) return;                 // ya estamos en esa vista
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      $('tabbar').classList.toggle('on-ajustes', v === 'ajustes');
      views.analisis.hidden = v !== 'analisis';
      views.ajustes.hidden = v !== 'ajustes';
      window.scrollTo(0, 0);   // la animación de entrada de la vista ya suaviza el cambio
    });
  });

  // ---------- selector de tema (color de fondo) ----------
  const THEME_TOP = { green: '#79bda6', ocean: '#bfd2d8' };
  function applyTheme(name, persist) {
    document.documentElement.classList.toggle('theme-ocean', name === 'ocean');
    document.querySelectorAll('.swatch').forEach(s =>
      s.classList.toggle('active', s.dataset.theme === name));
    // Safari a veces ignora cambios en caliente del theme-color: recrear el
    // nodo <meta> fuerza la relectura y la franja del notch acompaña al tema
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
    const meta = document.createElement('meta');
    meta.name = 'theme-color';
    meta.content = THEME_TOP[name] || THEME_TOP.green;
    document.head.appendChild(meta);
    if (persist) { try { localStorage.setItem('nre-theme', name); } catch (_) {} }
  }
  document.querySelectorAll('.swatch').forEach(s =>
    s.addEventListener('click', () => applyTheme(s.dataset.theme, true)));
  // el tema guardado ya se aplicó en el <head>; aquí solo sincronizamos los swatches
  if (document.documentElement.classList.contains('theme-ocean')) applyTheme('ocean', false);

  // ---------- parallax: los blobs del fondo se desplazan más despacio
  // que el contenido, reforzando la sensación de capas ----------
  const blobs = $('blobs');
  let parallaxTick = false;
  window.addEventListener('scroll', () => {
    if (parallaxTick) return;
    parallaxTick = true;
    requestAnimationFrame(() => {
      blobs.style.transform = `translateY(${window.scrollY * -0.08}px)`;
      parallaxTick = false;
    });
  }, { passive: true });

  // primer render
  update();
})();
</script>
</body>
</html>
