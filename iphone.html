<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verde">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Verde</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:      #F4F1EA;
      --cream-card: #FBF9F4;
      --forest:     #1E3A2B;
      --olive:      #5E7355;
      --terracotta: #C9694A;
      --lime:       #A8C256;
      --ink:        #22241F;
      --muted:      #8A8A7E;
      --line:       #E6E1D6;

      --r-lg: 26px;
      --r-md: 18px;
      --r-sm: 12px;

      --serif: 'Fraunces', Georgia, serif;
      --sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* El body NO scrollea: queda fijo a la pantalla. Así evitamos el
       "tirón" del scroll de página en iOS y los saltos al ocultarse barras. */
    html, body {
      height: 100%;
      position: fixed;
      width: 100%;
      overflow: hidden;
    }

    /* Contenedor real de scroll con momentum/rebote nativos de iOS. */
    .app {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;   /* inercia tipo nativo */
      overscroll-behavior-y: contain;       /* el rebote se queda dentro */
      scroll-behavior: smooth;
      padding:
        calc(env(safe-area-inset-top) + 12px)
        20px
        calc(env(safe-area-inset-bottom) + 110px);
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    /* En modo app, un pelín más de respiro bajo el reloj/Dynamic Island */
    .standalone .app { padding-top: calc(env(safe-area-inset-top) + 20px); }

    /* ---------- Cabecera ---------- */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 26px;
    }
    .greeting .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--olive);
    }
    .greeting h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 30px;
      line-height: 1.1;
      margin-top: 4px;
      color: var(--forest);
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--forest);
      color: var(--cream);
      font-family: var(--serif);
      font-size: 19px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ---------- Tarjeta principal (contador) ---------- */
    .hero {
      background: var(--forest);
      color: var(--cream);
      border-radius: var(--r-lg);
      padding: 26px 24px 24px;
      margin-bottom: 16px;
    }
    .hero .label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(244, 241, 234, 0.65);
    }
    .hero .count {
      font-family: var(--serif);
      font-weight: 500;
      line-height: 1;
      margin: 12px 0 2px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .hero .count .now { font-size: 58px; }
    .hero .count .goal { font-size: 22px; color: rgba(244, 241, 234, 0.6); }
    .hero .count .unit { font-size: 15px; color: rgba(244, 241, 234, 0.6); font-family: var(--sans); font-weight: 500; }

    .hero .remaining {
      font-size: 14px;
      color: rgba(244, 241, 234, 0.75);
      margin-bottom: 18px;
    }
    .hero .remaining b { color: var(--lime); font-weight: 600; }

    /* Barra horizontal mate */
    .bar {
      height: 12px;
      border-radius: 99px;
      background: rgba(244, 241, 234, 0.16);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--lime);
      width: 0;
      transition: width 0.9s cubic-bezier(.22,.61,.36,1);
    }

    /* ---------- Macros (cajetines rectangulares a lo ancho) ---------- */
    .macros {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }
    .macro {
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 14px 16px;
    }
    .macro .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .macro .name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .macro .val {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 500;
      color: var(--forest);
    }
    .macro .val span { font-size: 13px; color: var(--muted); font-family: var(--sans); }
    .macro .mini {
      height: 8px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }
    .macro .mini > span { display: block; height: 100%; border-radius: 99px; width: 0; transition: width 0.9s cubic-bezier(.22,.61,.36,1); }
    .macro.p .mini > span { background: var(--olive); }
    .macro.c .mini > span { background: var(--lime); }
    .macro.f .mini > span { background: var(--terracotta); }

    /* ---------- Sección comidas (desplegables) ---------- */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-head h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      color: var(--forest);
    }

    .meal-groups { display: flex; flex-direction: column; gap: 10px; }

    .mgroup {
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .mg-head {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 16px;
      cursor: pointer;
      font-family: var(--sans);
      text-align: left;
    }
    .mg-emoji {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .mg-info { flex: 1; min-width: 0; }
    .mg-name { font-weight: 600; font-size: 16px; color: var(--ink); }
    .mg-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .mg-kcal {
      font-family: var(--serif); font-size: 18px; font-weight: 500;
      color: var(--forest); flex-shrink: 0;
    }
    .mg-kcal span { font-size: 11px; color: var(--muted); font-family: var(--sans); font-weight: 500; }
    .mg-chev {
      font-size: 13px; color: var(--olive); flex-shrink: 0; width: 14px; text-align: center;
      transition: transform 0.28s ease;
    }
    .mgroup.open .mg-chev { transform: rotate(180deg); }

    .mg-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.32s ease;
    }
    .mgroup.open .mg-body { max-height: 1200px; }
    .mg-list { list-style: none; padding: 0 16px 8px; }
    .mg-food {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 0;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }
    .mgf-emoji { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
    .mgf-body { flex: 1; min-width: 0; }
    .mgf-name { font-size: 15px; font-weight: 500; color: var(--ink); }
    .mgf-grams { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
    .mgf-kcal { font-size: 14px; font-weight: 600; color: var(--olive); flex-shrink: 0; }
    .mgf-edit { font-size: 14px; color: var(--muted); flex-shrink: 0; opacity: 0.5; }

    .meal-empty {
      background: var(--cream-card);
      border: 1px dashed var(--line);
      border-radius: var(--r-md);
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* ---------- Botón añadir ---------- */
    .add {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(env(safe-area-inset-bottom) + 22px);
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--terracotta);
      color: var(--cream);
      border: none;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(201, 105, 74, 0.32);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .add:active { transform: scale(0.92); }
    .add.hidden { opacity: 0; pointer-events: none; transform: scale(0.6); }

    /* ---------- Pantalla Añadir comida (sheet) ---------- */
    .sheet {
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(.22,.61,.36,1);
      will-change: transform;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-grip {
      width: 38px; height: 5px; border-radius: 99px;
      background: var(--line);
      margin: 0 auto;
      margin-top: calc(env(safe-area-inset-top) + 10px);
      flex-shrink: 0;
    }
    .standalone .sheet-grip { margin-top: calc(env(safe-area-inset-top) + 16px); }

    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 6px;
      flex-shrink: 0;
    }
    .sheet-head h2 {
      font-family: var(--serif); font-weight: 500; font-size: 19px; color: var(--forest);
    }
    .sheet-close {
      background: none; border: none; color: var(--terracotta);
      font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
      padding: 4px 0;
    }
    .sheet-spacer { width: 48px; }

    .meal-tabs {
      display: flex; gap: 8px; padding: 10px 20px 4px; flex-shrink: 0;
      overflow-x: auto;
    }
    .meal-tabs button {
      flex: 1 0 auto;
      border: 1px solid var(--line);
      background: var(--cream-card);
      color: var(--olive);
      border-radius: 99px;
      padding: 9px 16px;
      font-family: var(--sans); font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .meal-tabs button.active {
      background: var(--forest); color: var(--cream); border-color: var(--forest);
    }

    .search-wrap {
      position: relative; padding: 12px 20px 8px; flex-shrink: 0;
    }
    .search-ico {
      position: absolute; left: 34px; top: 50%; transform: translateY(-30%);
      font-size: 15px; opacity: 0.6; pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--cream-card);
      border-radius: var(--r-md);
      padding: 13px 14px 13px 40px;
      font-family: var(--sans); font-size: 16px; color: var(--ink);
      outline: none;
      -webkit-appearance: none;
    }
    .search-wrap input:focus { border-color: var(--olive); }

    .food-list {
      list-style: none;
      flex: 1; min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 4px 20px 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .food {
      display: flex; align-items: center; gap: 12px;
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 12px 14px;
    }
    .food.picked { border-color: var(--olive); background: #F3F5EC; }
    .food .fe {
      width: 38px; height: 38px; border-radius: 11px; background: var(--cream);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      flex-shrink: 0;
    }
    .food .fb { flex: 1; min-width: 0; }
    .food .fb .ft { font-weight: 600; font-size: 15px; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food .fb .fs { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

    /* Botón añadir / stepper */
    .food .pick {
      border: none; background: var(--forest); color: var(--cream);
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 20px; font-weight: 300; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .stepper {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .stepper button {
      border: none; width: 30px; height: 30px; border-radius: 50%;
      background: var(--forest); color: var(--cream);
      font-size: 18px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .stepper button.minus { background: var(--cream); color: var(--forest); border: 1px solid var(--line); }
    .stepper .qty {
      font-family: var(--serif); font-size: 17px; font-weight: 500;
      color: var(--forest); min-width: 18px; text-align: center;
    }

    .sheet-foot {
      flex-shrink: 0;
      padding: 12px 20px calc(env(safe-area-inset-bottom) + 14px);
      border-top: 1px solid var(--line);
      background: var(--cream);
    }
    .confirm {
      width: 100%;
      border: none;
      background: var(--terracotta);
      color: var(--cream);
      border-radius: var(--r-md);
      padding: 16px;
      font-family: var(--sans); font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .confirm:active { transform: scale(0.98); }
    .confirm:disabled { background: var(--line); color: var(--muted); cursor: default; }

    /* ---------- Modal de gramos (añadir / editar) ---------- */
    .modal {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(34, 36, 31, 0);
      visibility: hidden;
      transition: background 0.25s ease, visibility 0.25s ease;
    }
    .modal.open { visibility: visible; background: rgba(34, 36, 31, 0.45); }
    .modal-card {
      width: 100%; max-width: 460px;
      background: var(--cream);
      border-radius: 26px 26px 0 0;
      padding: 22px 22px calc(env(safe-area-inset-bottom) + 22px);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.22,.61,.36,1);
    }
    .modal.open .modal-card { transform: translateY(0); }

    .modal-top { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
    .modal-emoji {
      width: 46px; height: 46px; border-radius: 13px; background: var(--cream-card);
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
    }
    .modal-title { flex: 1; min-width: 0; }
    .modal-title h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; color: var(--forest); }
    .modal-ref { font-size: 13px; color: var(--muted); margin-top: 2px; }

    .grams-field {
      display: flex; align-items: center; gap: 14px;
      background: var(--cream-card); border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 10px 14px; margin-bottom: 14px;
    }
    .grams-field button {
      border: none; width: 40px; height: 40px; border-radius: 50%;
      background: var(--forest); color: var(--cream);
      font-size: 22px; line-height: 1; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .grams-field .gminus { background: var(--cream); color: var(--forest); border: 1px solid var(--line); }
    .grams-field .gwrap { flex: 1; text-align: center; }
    .grams-field input {
      width: 100%; border: none; background: none; outline: none;
      font-family: var(--serif); font-weight: 500; font-size: 32px; color: var(--forest);
      text-align: center; -webkit-appearance: none; -moz-appearance: textfield;
    }
    .grams-field input::-webkit-outer-spin-button,
    .grams-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .grams-field .gunit { font-size: 13px; color: var(--muted); display: block; margin-top: -4px; }

    .modal-preview {
      display: flex; justify-content: space-around; text-align: center;
      background: var(--forest); color: var(--cream);
      border-radius: var(--r-md); padding: 14px; margin-bottom: 16px;
    }
    .modal-preview .pv-n { font-family: var(--serif); font-size: 19px; font-weight: 500; }
    .modal-preview .pv-l { font-size: 11px; color: rgba(244,241,234,0.6); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
    .modal-preview .pv-n.kcal { color: var(--lime); }

    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button {
      flex: 1; border: none; border-radius: var(--r-md); padding: 15px;
      font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .modal-actions .m-cancel { background: var(--cream-card); border: 1px solid var(--line); color: var(--olive); }
    .modal-actions .m-delete { background: #F2E4DF; color: var(--terracotta); flex: 0 0 auto; padding: 15px 20px; }
    .modal-actions .m-save { background: var(--terracotta); color: var(--cream); }
  </style>
</head>
<body>

 <div class="app" id="app">

  <header class="topbar">
    <div class="greeting">
      <div class="eyebrow" id="dateLabel">—</div>
      <h1 id="greeting">Hola</h1>
    </div>
    <div class="avatar" id="avatar">V</div>
  </header>

  <section class="hero">
    <div class="label">Hoy</div>
    <div class="count">
      <span class="now" id="kcalNow">0</span>
      <span class="goal" id="kcalGoal">/ 0</span>
      <span class="unit">kcal</span>
    </div>
    <div class="remaining">Te quedan <b id="kcalLeft">0 kcal</b> para tu objetivo</div>
    <div class="bar"><span id="kcalBar"></span></div>
  </section>

  <section class="macros" id="macros"></section>

  <div class="section-head">
    <h2>Comidas de hoy</h2>
  </div>
  <div class="meal-groups" id="mealGroups"></div>

 </div><!-- /.app -->

  <button class="add" id="addBtn" aria-label="Añadir comida">+</button>

  <!-- ===================== Pantalla Añadir comida ===================== -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-grip"></div>
    <header class="sheet-head">
      <button class="sheet-close" id="sheetClose">Cerrar</button>
      <h2>Añadir comida</h2>
      <span class="sheet-spacer"></span>
    </header>

    <div class="meal-tabs" id="mealTabs">
      <button data-meal="Desayuno">Desayuno</button>
      <button data-meal="Comida">Comida</button>
      <button data-meal="Cena">Cena</button>
      <button data-meal="Snack">Snack</button>
    </div>

    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input id="search" type="search" placeholder="Buscar alimento…"
             autocomplete="off" autocorrect="off" autocapitalize="none">
    </div>

    <ul class="food-list" id="foodList"></ul>

    <div class="sheet-foot" id="sheetFoot">
      <button class="confirm" id="sheetDone">Hecho</button>
    </div>
  </section>

  <!-- ===================== Modal de gramos (añadir / editar) ===================== -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-emoji" id="mEmoji">🍽️</div>
        <div class="modal-title">
          <h3 id="mTitle">Alimento</h3>
          <div class="modal-ref" id="mRef">—</div>
        </div>
      </div>

      <div class="grams-field">
        <button class="gminus" id="mMinus" aria-label="Menos">−</button>
        <div class="gwrap">
          <input id="mGrams" type="number" inputmode="numeric" min="0" step="1" value="100">
          <span class="gunit">gramos</span>
        </div>
        <button class="gplus" id="mPlus" aria-label="Más">+</button>
      </div>

      <div class="modal-preview">
        <div><div class="pv-n kcal" id="pvKcal">0</div><div class="pv-l">kcal</div></div>
        <div><div class="pv-n" id="pvP">0</div><div class="pv-l">Prot</div></div>
        <div><div class="pv-n" id="pvC">0</div><div class="pv-l">Carb</div></div>
        <div><div class="pv-n" id="pvF">0</div><div class="pv-l">Grasa</div></div>
      </div>

      <div class="modal-actions">
        <button class="m-delete" id="mDelete" hidden>Eliminar</button>
        <button class="m-cancel" id="mCancel">Cancelar</button>
        <button class="m-save" id="mSave">Añadir</button>
      </div>
    </div>
  </div>

  <script>
    /* Detección modo app vs Safari */
    if (navigator.standalone === true ||
        matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('standalone');
    }

    /* =========================================================
       DATOS  —  estructura lista para rellenar con Vitrubio.
       Solo hay que sustituir estos valores; la vista se pinta sola.
       ========================================================= */
    const DATA = {
      user: { name: "Verde", initial: "V" },
      // Objetivos diarios (laborables) — de Vitruvio
      goal: { kcal: 1176, protein: 140, carbs: 37, fat: 52 },
      meals: [
        // Comidas registradas hoy: { food, time, grams }
        { food: "claras_huevo",    time: "Desayuno", grams: 150 },
        { food: "arandanos",       time: "Desayuno", grams: 100 },
        { food: "pollo_solomillo", time: "Comida",   grams: 200 },
        { food: "rucula",          time: "Comida",   grams: 100 },
        { food: "queso_cottage",   time: "Snack",    grams: 100 }
      ]
    };

    /* =========================================================
       CATÁLOGO DE ALIMENTOS  —  datos nutricionales (de Vitruvio).
       Los valores kcal/protein/carbs/fat son POR la ración 'base' (en gramos).
       'ration' es solo la etiqueta de referencia que se muestra.
       Añade aquí nuevos alimentos y úsalos en DATA.meals por su clave.
       ========================================================= */
    const FOODS = {
      claras_huevo:    { name: "Claras de huevo",     emoji: "🥚", base: 150, ration: "150 ml", kcal: 63,  protein: 16.5, carbs: 0.5,  fat: 0.2 },
      jamon_serrano:   { name: "Jamón serrano",       emoji: "🍖", base: 55,  ration: "55 g",   kcal: 137, protein: 18.5, carbs: 0.6,  fat: 6.7 },
      pollo_solomillo: { name: "Solomillo de pollo",  emoji: "🍗", base: 100, ration: "100 g",  kcal: 108, protein: 22,   carbs: 0.5,  fat: 1.8 },
      fajitas:         { name: "Fajitas (sin pan)",   emoji: "🌮", base: 300, ration: "300 g",  kcal: 219, protein: 26.7, carbs: 21.9, fat: 1.8 },
      queso_cottage:   { name: "Queso Cottage",       emoji: "🧀", base: 100, ration: "100 g",  kcal: 99,  protein: 14,   carbs: 1.7,  fat: 4.0 },
      champinones:     { name: "Champiñones",         emoji: "🍄", base: 100, ration: "100 g",  kcal: 20,  protein: 2.6,  carbs: 0.8,  fat: 0.6 },
      rucula:          { name: "Rúcula",              emoji: "🥬", base: 100, ration: "100 g",  kcal: 26,  protein: 3.4,  carbs: 1.0,  fat: 0.4 },
      arandanos:       { name: "Arándanos",           emoji: "🫐", base: 100, ration: "100 g",  kcal: 57,  protein: 0.7,  carbs: 14,   fat: 0.3 },
      mermelada0:      { name: "Mermelada 0%",        emoji: "🍓", base: 25,  ration: "25 g",   kcal: 10,  protein: 0.2,  carbs: 2.9,  fat: 0 },
      platano:         { name: "Plátano",             emoji: "🍌", base: 120, ration: "120 g",  kcal: 107, protein: 1.3,  carbs: 27,   fat: 0.3 },
      queso_viejo:     { name: "Queso viejo tostado", emoji: "🧀", base: 100, ration: "100 g",  kcal: 474, protein: 27,   carbs: 1.5,  fat: 40 },
      naranja:         { name: "Naranja",             emoji: "🍊", base: 150, ration: "150 g",  kcal: 70,  protein: 1.4,  carbs: 17,   fat: 0.2 },
      sandia:          { name: "Sandía",              emoji: "🍉", base: 300, ration: "300 g",  kcal: 90,  protein: 1.8,  carbs: 21,   fat: 0.3 },
      roquefort:       { name: "Queso Roquefort",     emoji: "🧀", base: 100, ration: "100 g",  kcal: 364, protein: 19,   carbs: 0.5,  fat: 32 },
      bowl_salmon:     { name: "Bowl salmón y arroz", emoji: "🐟", base: 400, ration: "400 g",  kcal: 628, protein: 38.4, carbs: 48,   fat: 30 }
    };

    // Momentos del día (orden e icono para la Home)
    const MEAL_ORDER = ["Desayuno", "Comida", "Cena", "Snack"];
    const MEAL_ICON  = { Desayuno: "🌅", Comida: "🍽️", Cena: "🌙", Snack: "🍎" };

    // Nutrición de un alimento para una cantidad en gramos
    const round1 = (n) => Math.round(n * 10) / 10;
    function nutri(foodKey, grams) {
      const f = FOODS[foodKey];
      const r = grams / f.base;
      return {
        kcal: Math.round(f.kcal * r),
        protein: round1(f.protein * r),
        carbs: round1(f.carbs * r),
        fat: round1(f.fat * r)
      };
    }

    /* =========================================================
       PERSISTENCIA  —  el registro del día aguanta recargas (localStorage)
       ========================================================= */
    const STORE_KEY = "verde.log.v2";
    const todayKey = () => {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    };
    function loadLog() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY));
        if (raw && raw.date === todayKey() && Array.isArray(raw.meals)) {
          DATA.meals = raw.meals;            // mismo día → recuperar
        } else if (raw && raw.date !== todayKey()) {
          DATA.meals = [];                   // día nuevo → empezar vacío
        }
      } catch (e) { /* sin almacenamiento, seguimos con los datos por defecto */ }
    }
    function saveLog() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ date: todayKey(), meals: DATA.meals }));
      } catch (e) {}
    }

    /* =========================================================
       RENDER
       ========================================================= */
    const $ = (id) => document.getElementById(id);

    function hello() {
      const h = new Date().getHours();
      if (h < 6)  return "Buenas noches";
      if (h < 14) return "Buenos días";
      if (h < 21) return "Buenas tardes";
      return "Buenas noches";
    }

    function render() {
      // Cabecera
      const d = new Date();
      $("dateLabel").textContent = d.toLocaleDateString("es-ES",
        { weekday: "long", day: "numeric", month: "long" }).toUpperCase();
      $("greeting").textContent = hello() + ", " + DATA.user.name;
      $("avatar").textContent = DATA.user.initial;

      // Resolver cada comida (con su índice original) y totales del día
      const sum = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
      const resolved = DATA.meals.map((m, idx) => {
        if (!FOODS[m.food]) return null;
        const n = nutri(m.food, m.grams);
        sum.kcal += n.kcal; sum.protein += n.protein; sum.carbs += n.carbs; sum.fat += n.fat;
        return { idx, food: m.food, time: m.time, grams: m.grams, n };
      }).filter(Boolean);
      sum.protein = Math.round(sum.protein);
      sum.carbs = Math.round(sum.carbs);
      sum.fat = Math.round(sum.fat);

      // Contador principal (calorías)
      const goal = DATA.goal.kcal;
      const left = Math.max(0, goal - sum.kcal);
      $("kcalNow").textContent = sum.kcal.toLocaleString("es-ES");
      $("kcalGoal").textContent = "/ " + goal.toLocaleString("es-ES");
      $("kcalLeft").textContent = left.toLocaleString("es-ES") + " kcal";
      const pct = Math.min(100, Math.round((sum.kcal / goal) * 100));
      requestAnimationFrame(() => { $("kcalBar").style.width = pct + "%"; });

      // Macros (cajetines rectangulares)
      const macros = [
        { key: "p", name: "Proteínas", val: sum.protein, goal: DATA.goal.protein },
        { key: "c", name: "Carbohidratos", val: sum.carbs, goal: DATA.goal.carbs },
        { key: "f", name: "Grasas", val: sum.fat, goal: DATA.goal.fat }
      ];
      $("macros").innerHTML = macros.map(m => {
        const p = Math.min(100, Math.round((m.val / m.goal) * 100));
        return `
          <div class="macro ${m.key}">
            <div class="top">
              <div class="name">${m.name}</div>
              <div class="val">${m.val}<span> / ${m.goal} g</span></div>
            </div>
            <div class="mini"><span data-w="${p}"></span></div>
          </div>`;
      }).join("");

      // Comidas agrupadas por momento del día (desplegables)
      const groups = $("mealGroups");
      const blocks = MEAL_ORDER.map(time => {
        const its = resolved.filter(r => r.time === time);
        if (!its.length) return "";
        const tot = its.reduce((a, r) => a + r.n.kcal, 0);
        const open = openMeals.has(time);
        const rows = its.map(r => `
          <li class="mg-food" data-idx="${r.idx}">
            <span class="mgf-emoji">${FOODS[r.food].emoji}</span>
            <div class="mgf-body">
              <div class="mgf-name">${FOODS[r.food].name}</div>
              <div class="mgf-grams">${r.grams} g</div>
            </div>
            <span class="mgf-kcal">${r.n.kcal} kcal</span>
            <span class="mgf-edit">✎</span>
          </li>`).join("");
        return `
          <div class="mgroup ${open ? "open" : ""}" data-meal="${time}">
            <button class="mg-head" data-toggle="${time}">
              <div class="mg-emoji">${MEAL_ICON[time]}</div>
              <div class="mg-info">
                <div class="mg-name">${time}</div>
                <div class="mg-sub">${its.length} ${its.length === 1 ? "alimento" : "alimentos"}</div>
              </div>
              <div class="mg-kcal">${tot} <span>kcal</span></div>
              <div class="mg-chev">▾</div>
            </button>
            <div class="mg-body"><ul class="mg-list">${rows}</ul></div>
          </div>`;
      }).join("");
      groups.innerHTML = blocks || `<div class="meal-empty">Aún no has registrado nada hoy</div>`;

      // Animar mini-barras de macros
      requestAnimationFrame(() => {
        document.querySelectorAll('.macro .mini > span').forEach(s => {
          s.style.width = s.dataset.w + "%";
        });
      });
    }

    /* =========================================================
       ACORDEÓN DE COMIDAS EN LA HOME (desplegar / plegar + editar)
       ========================================================= */
    const openMeals = new Set(MEAL_ORDER);   // por defecto, todas desplegadas

    $("mealGroups").addEventListener("click", (e) => {
      const toggle = e.target.closest("[data-toggle]");
      if (toggle) {
        const time = toggle.dataset.toggle;
        const grp = toggle.closest(".mgroup");
        const nowOpen = grp.classList.toggle("open");
        nowOpen ? openMeals.add(time) : openMeals.delete(time);
        return;
      }
      const row = e.target.closest(".mg-food");
      if (row) openEdit(parseInt(row.dataset.idx, 10));   // editar / eliminar
    });

    /* =========================================================
       PANTALLA AÑADIR COMIDA (sheet)
       ========================================================= */
    const sheet = $("sheet");
    let activeMeal = "Desayuno";

    function defaultMeal() {
      const h = new Date().getHours();
      if (h < 11) return "Desayuno";
      if (h < 16) return "Comida";
      if (h < 19) return "Snack";
      return "Cena";
    }

    function openSheet() {
      activeMeal = defaultMeal();
      $("search").value = "";
      syncTabs();
      renderFoodList();
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      $("addBtn").classList.add("hidden");
    }
    function closeSheet() {
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      $("addBtn").classList.remove("hidden");
    }
    function syncTabs() {
      $("mealTabs").querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.meal === activeMeal));
    }

    function renderFoodList() {
      const q = $("search").value.trim().toLowerCase();
      const entries = Object.entries(FOODS).filter(([, f]) =>
        !q || f.name.toLowerCase().includes(q));
      const list = $("foodList");
      if (!entries.length) {
        list.innerHTML = `<li class="food" style="justify-content:center;color:var(--muted)">Sin resultados</li>`;
        return;
      }
      list.innerHTML = entries.map(([k, f]) => `
        <li class="food" data-add="${k}">
          <div class="fe">${f.emoji}</div>
          <div class="fb">
            <div class="ft">${f.name}</div>
            <div class="fs">${f.ration} · ${f.kcal} kcal</div>
          </div>
          <button class="pick" aria-label="Añadir">+</button>
        </li>`).join("");
    }

    $("addBtn").addEventListener("click", openSheet);
    $("sheetClose").addEventListener("click", closeSheet);
    $("sheetDone").addEventListener("click", closeSheet);
    $("search").addEventListener("input", renderFoodList);

    $("mealTabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-meal]");
      if (!b) return;
      activeMeal = b.dataset.meal;
      syncTabs();
    });

    $("foodList").addEventListener("click", (e) => {
      const li = e.target.closest("[data-add]");
      if (li) openAdd(li.dataset.add, activeMeal);
    });

    /* =========================================================
       MODAL DE GRAMOS  (sirve para añadir y para editar/eliminar)
       ========================================================= */
    const modal = $("modal");
    let modalState = null;   // { mode:'add'|'edit', foodKey, time, idx }

    function showModal() {
      const f = FOODS[modalState.foodKey];
      $("mEmoji").textContent = f.emoji;
      $("mTitle").textContent = f.name;
      $("mRef").textContent = "Referencia: " + f.ration + " · " + f.kcal + " kcal";
      $("mDelete").hidden = modalState.mode !== "edit";
      $("mSave").textContent = modalState.mode === "edit" ? "Guardar" : "Añadir";
      updatePreview();
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalState = null;
    }

    function openAdd(foodKey, time) {
      modalState = { mode: "add", foodKey, time };
      $("mGrams").value = FOODS[foodKey].base;
      showModal();
    }
    function openEdit(idx) {
      const meal = DATA.meals[idx];
      if (!meal || !FOODS[meal.food]) return;
      modalState = { mode: "edit", foodKey: meal.food, idx };
      $("mGrams").value = meal.grams;
      showModal();
    }

    function currentGrams() {
      const v = parseInt($("mGrams").value, 10);
      return isNaN(v) ? 0 : Math.max(0, v);
    }
    function setGrams(v) {
      $("mGrams").value = Math.max(0, v);
      updatePreview();
    }
    function updatePreview() {
      const n = nutri(modalState.foodKey, currentGrams());
      $("pvKcal").textContent = n.kcal;
      $("pvP").textContent = n.protein;
      $("pvC").textContent = n.carbs;
      $("pvF").textContent = n.fat;
    }

    $("mGrams").addEventListener("input", updatePreview);
    $("mPlus").addEventListener("click", () => setGrams(currentGrams() + 10));
    $("mMinus").addEventListener("click", () => setGrams(currentGrams() - 10));
    $("mCancel").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

    $("mSave").addEventListener("click", () => {
      const g = Math.max(1, currentGrams());
      if (modalState.mode === "add") {
        DATA.meals.push({ food: modalState.foodKey, time: modalState.time, grams: g });
      } else {
        DATA.meals[modalState.idx].grams = g;
      }
      saveLog();
      render();
      closeModal();
    });

    $("mDelete").addEventListener("click", () => {
      if (modalState.mode === "edit") {
        DATA.meals.splice(modalState.idx, 1);
        saveLog();
        render();
      }
      closeModal();
    });

    /* ---------- Arranque ---------- */
    loadLog();
    render();
  </script>
</body>
</html>
