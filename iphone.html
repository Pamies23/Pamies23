<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verde">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Verde</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:      #F4F1EA;
      --cream-card: #FBF9F4;
      --forest:     #1E3A2B;
      --olive:      #5E7355;
      --terracotta: #C9694A;
      --lime:       #A8C256;
      --ink:        #22241F;
      --muted:      #8A8A7E;
      --line:       #E6E1D6;

      --r-lg: 26px;
      --r-md: 18px;
      --r-sm: 12px;

      --serif: 'Fraunces', Georgia, serif;
      --sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* El body NO scrollea: queda fijo a la pantalla. Así evitamos el
       "tirón" del scroll de página en iOS y los saltos al ocultarse barras. */
    html, body {
      height: 100%;
      position: fixed;
      width: 100%;
      overflow: hidden;
    }

    /* Contenedor real de scroll con momentum/rebote nativos de iOS. */
    .app {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;   /* inercia tipo nativo */
      overscroll-behavior-y: contain;       /* el rebote se queda dentro */
      scroll-behavior: smooth;
      padding:
        calc(env(safe-area-inset-top) + 12px)
        20px
        calc(env(safe-area-inset-bottom) + 110px);
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    /* En modo app, un pelín más de respiro bajo el reloj/Dynamic Island */
    .standalone .app { padding-top: calc(env(safe-area-inset-top) + 20px); }

    /* ---------- Cabecera ---------- */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 26px;
    }
    .greeting .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--olive);
    }
    .greeting h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 30px;
      line-height: 1.1;
      margin-top: 4px;
      color: var(--forest);
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--forest);
      color: var(--cream);
      font-family: var(--serif);
      font-size: 19px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ---------- Tarjeta principal (contador) ---------- */
    .hero {
      background: var(--forest);
      color: var(--cream);
      border-radius: var(--r-lg);
      padding: 26px 24px 24px;
      margin-bottom: 16px;
    }
    .hero .label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(244, 241, 234, 0.65);
    }
    .hero .count {
      font-family: var(--serif);
      font-weight: 500;
      line-height: 1;
      margin: 12px 0 2px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .hero .count .now { font-size: 58px; }
    .hero .count .goal { font-size: 22px; color: rgba(244, 241, 234, 0.6); }
    .hero .count .unit { font-size: 15px; color: rgba(244, 241, 234, 0.6); font-family: var(--sans); font-weight: 500; }

    .hero .remaining {
      font-size: 14px;
      color: rgba(244, 241, 234, 0.75);
      margin-bottom: 18px;
    }
    .hero .remaining b { color: var(--lime); font-weight: 600; }

    /* Barra horizontal mate */
    .bar {
      height: 12px;
      border-radius: 99px;
      background: rgba(244, 241, 234, 0.16);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--lime);
      width: 0;
      transition: width 0.9s cubic-bezier(.22,.61,.36,1);
    }

    /* ---------- Macros ---------- */
    .macros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 26px;
    }
    .macro {
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 14px;
    }
    .macro .name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .macro .val {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      color: var(--forest);
      margin: 4px 0 10px;
    }
    .macro .val span { font-size: 13px; color: var(--muted); font-family: var(--sans); }
    .macro .mini {
      height: 6px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }
    .macro .mini > span { display: block; height: 100%; border-radius: 99px; width: 0; transition: width 0.9s ease; }
    .macro.p .mini > span { background: var(--olive); }
    .macro.c .mini > span { background: var(--lime); }
    .macro.f .mini > span { background: var(--terracotta); }

    /* ---------- Sección comidas ---------- */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-head h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      color: var(--forest);
    }
    .section-head .link {
      font-size: 14px;
      font-weight: 600;
      color: var(--terracotta);
    }

    .meals { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .meal {
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .meal .emoji {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .meal .body { flex: 1; min-width: 0; }
    .meal .body .t {
      font-weight: 600;
      font-size: 16px;
      color: var(--ink);
    }
    .meal .body .s {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meal .kcal {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      color: var(--forest);
      flex-shrink: 0;
    }
    .meal .kcal span { font-size: 11px; color: var(--muted); font-family: var(--sans); display: block; text-align: right; font-weight: 500; }

    .meal.empty {
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      border-style: dashed;
      padding: 22px;
    }

    /* ---------- Botón añadir ---------- */
    .add {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(env(safe-area-inset-bottom) + 22px);
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--terracotta);
      color: var(--cream);
      border: none;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(201, 105, 74, 0.32);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .add:active { transform: scale(0.92); }
    .add.hidden { opacity: 0; pointer-events: none; transform: scale(0.6); }

    /* ---------- Pantalla Añadir comida (sheet) ---------- */
    .sheet {
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(.22,.61,.36,1);
      will-change: transform;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-grip {
      width: 38px; height: 5px; border-radius: 99px;
      background: var(--line);
      margin: 0 auto;
      margin-top: calc(env(safe-area-inset-top) + 10px);
      flex-shrink: 0;
    }
    .standalone .sheet-grip { margin-top: calc(env(safe-area-inset-top) + 16px); }

    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 6px;
      flex-shrink: 0;
    }
    .sheet-head h2 {
      font-family: var(--serif); font-weight: 500; font-size: 19px; color: var(--forest);
    }
    .sheet-close {
      background: none; border: none; color: var(--terracotta);
      font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
      padding: 4px 0;
    }
    .sheet-spacer { width: 48px; }

    .meal-tabs {
      display: flex; gap: 8px; padding: 10px 20px 4px; flex-shrink: 0;
      overflow-x: auto;
    }
    .meal-tabs button {
      flex: 1 0 auto;
      border: 1px solid var(--line);
      background: var(--cream-card);
      color: var(--olive);
      border-radius: 99px;
      padding: 9px 16px;
      font-family: var(--sans); font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .meal-tabs button.active {
      background: var(--forest); color: var(--cream); border-color: var(--forest);
    }

    .search-wrap {
      position: relative; padding: 12px 20px 8px; flex-shrink: 0;
    }
    .search-ico {
      position: absolute; left: 34px; top: 50%; transform: translateY(-30%);
      font-size: 15px; opacity: 0.6; pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--cream-card);
      border-radius: var(--r-md);
      padding: 13px 14px 13px 40px;
      font-family: var(--sans); font-size: 16px; color: var(--ink);
      outline: none;
      -webkit-appearance: none;
    }
    .search-wrap input:focus { border-color: var(--olive); }

    .food-list {
      list-style: none;
      flex: 1; min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 4px 20px 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .food {
      display: flex; align-items: center; gap: 12px;
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 12px 14px;
    }
    .food.picked { border-color: var(--olive); background: #F3F5EC; }
    .food .fe {
      width: 38px; height: 38px; border-radius: 11px; background: var(--cream);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      flex-shrink: 0;
    }
    .food .fb { flex: 1; min-width: 0; }
    .food .fb .ft { font-weight: 600; font-size: 15px; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food .fb .fs { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

    /* Botón añadir / stepper */
    .food .pick {
      border: none; background: var(--forest); color: var(--cream);
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 20px; font-weight: 300; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .stepper {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .stepper button {
      border: none; width: 30px; height: 30px; border-radius: 50%;
      background: var(--forest); color: var(--cream);
      font-size: 18px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .stepper button.minus { background: var(--cream); color: var(--forest); border: 1px solid var(--line); }
    .stepper .qty {
      font-family: var(--serif); font-size: 17px; font-weight: 500;
      color: var(--forest); min-width: 18px; text-align: center;
    }

    .sheet-foot {
      flex-shrink: 0;
      padding: 12px 20px calc(env(safe-area-inset-bottom) + 14px);
      border-top: 1px solid var(--line);
      background: var(--cream);
    }
    .confirm {
      width: 100%;
      border: none;
      background: var(--terracotta);
      color: var(--cream);
      border-radius: var(--r-md);
      padding: 16px;
      font-family: var(--sans); font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .confirm:active { transform: scale(0.98); }
    .confirm:disabled { background: var(--line); color: var(--muted); cursor: default; }
  </style>
</head>
<body>

 <div class="app" id="app">

  <header class="topbar">
    <div class="greeting">
      <div class="eyebrow" id="dateLabel">—</div>
      <h1 id="greeting">Hola</h1>
    </div>
    <div class="avatar" id="avatar">V</div>
  </header>

  <section class="hero">
    <div class="label">Hoy</div>
    <div class="count">
      <span class="now" id="kcalNow">0</span>
      <span class="goal" id="kcalGoal">/ 0</span>
      <span class="unit">kcal</span>
    </div>
    <div class="remaining">Te quedan <b id="kcalLeft">0 kcal</b> para tu objetivo</div>
    <div class="bar"><span id="kcalBar"></span></div>
  </section>

  <section class="macros" id="macros"></section>

  <div class="section-head">
    <h2>Comidas de hoy</h2>
    <span class="link">Ver todo</span>
  </div>
  <ul class="meals" id="meals"></ul>

 </div><!-- /.app -->

  <button class="add" id="addBtn" aria-label="Añadir comida">+</button>

  <!-- ===================== Pantalla Añadir comida ===================== -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-grip"></div>
    <header class="sheet-head">
      <button class="sheet-close" id="sheetClose">Cerrar</button>
      <h2>Añadir comida</h2>
      <span class="sheet-spacer"></span>
    </header>

    <div class="meal-tabs" id="mealTabs">
      <button data-meal="Desayuno">Desayuno</button>
      <button data-meal="Comida">Comida</button>
      <button data-meal="Cena">Cena</button>
      <button data-meal="Snack">Snack</button>
    </div>

    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input id="search" type="search" placeholder="Buscar alimento…"
             autocomplete="off" autocorrect="off" autocapitalize="none">
    </div>

    <ul class="food-list" id="foodList"></ul>

    <div class="sheet-foot" id="sheetFoot">
      <button class="confirm" id="confirmAdd" disabled>Selecciona alimentos</button>
    </div>
  </section>

  <script>
    /* Detección modo app vs Safari */
    if (navigator.standalone === true ||
        matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('standalone');
    }

    /* =========================================================
       DATOS  —  estructura lista para rellenar con Vitrubio.
       Solo hay que sustituir estos valores; la vista se pinta sola.
       ========================================================= */
    const DATA = {
      user: { name: "Verde", initial: "V" },
      goal: { kcal: 2000, protein: 140, carbs: 220, fat: 65 }, // objetivos diarios (placeholder)
      meals: [
        // Comidas registradas hoy. Referencian alimentos del catálogo FOODS por su clave.
        { food: "claras_huevo", time: "Desayuno", qty: 1 },
        { food: "arandanos",    time: "Desayuno", qty: 1 },
        { food: "pollo_solomillo", time: "Comida", qty: 2 },
        { food: "rucula",       time: "Comida",   qty: 1 },
        { food: "queso_cottage", time: "Snack",   qty: 1 }
      ]
    };

    /* =========================================================
       CATÁLOGO DE ALIMENTOS  —  datos nutricionales (de Vitruvio).
       Valores POR RACIÓN indicada. Solo info nutricional.
       Añade aquí nuevos alimentos y úsalos en DATA.meals por su clave.
       ========================================================= */
    const FOODS = {
      claras_huevo:    { name: "Claras de huevo",    emoji: "🥚", ration: "150 ml", kcal: 63,  protein: 16.5, carbs: 0.5,  fat: 0.2 },
      jamon_serrano:   { name: "Jamón serrano",      emoji: "🍖", ration: "50–60 g", kcal: 137, protein: 18.5, carbs: 0.6,  fat: 6.7 },
      pollo_solomillo: { name: "Solomillo de pollo", emoji: "🍗", ration: "100 g", kcal: 108, protein: 22,   carbs: 0.5,  fat: 1.8 },
      fajitas:         { name: "Fajitas (sin pan)",  emoji: "🌮", ration: "300 g", kcal: 219, protein: 26.7, carbs: 21.9, fat: 1.8 },
      queso_cottage:   { name: "Queso Cottage",      emoji: "🧀", ration: "100 g", kcal: 99,  protein: 14,   carbs: 1.7,  fat: 4.0 },
      champinones:     { name: "Champiñones",        emoji: "🍄", ration: "100 g", kcal: 20,  protein: 2.6,  carbs: 0.8,  fat: 0.6 },
      rucula:          { name: "Rúcula",             emoji: "🥬", ration: "100 g", kcal: 26,  protein: 3.4,  carbs: 1.0,  fat: 0.4 },
      arandanos:       { name: "Arándanos",          emoji: "🫐", ration: "100 g", kcal: 57,  protein: 0.7,  carbs: 14,   fat: 0.3 },
      mermelada0:      { name: "Mermelada 0%",       emoji: "🍓", ration: "25 g",  kcal: 10,  protein: 0.2,  carbs: 2.9,  fat: 0 },
      platano:         { name: "Plátano",            emoji: "🍌", ration: "120 g", kcal: 107, protein: 1.3,  carbs: 27,   fat: 0.3 },
      queso_viejo:     { name: "Queso viejo tostado", emoji: "🧀", ration: "100 g", kcal: 474, protein: 27,  carbs: 1.5,  fat: 40 },
      naranja:         { name: "Naranja",            emoji: "🍊", ration: "150 g", kcal: 70,  protein: 1.4,  carbs: 17,   fat: 0.2 },
      sandia:          { name: "Sandía",             emoji: "🍉", ration: "300 g", kcal: 90,  protein: 1.8,  carbs: 21,   fat: 0.3 },
      roquefort:       { name: "Queso Roquefort",    emoji: "🧀", ration: "100 g", kcal: 364, protein: 19,   carbs: 0.5,  fat: 32 },
      bowl_salmon:     { name: "Bowl salmón y arroz", emoji: "🐟", ration: "400 g", kcal: 628, protein: 38.4, carbs: 48,  fat: 30 }
    };

    /* =========================================================
       PERSISTENCIA  —  el registro del día aguanta recargas (localStorage)
       ========================================================= */
    const STORE_KEY = "verde.log.v1";
    const todayKey = () => {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    };
    function loadLog() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY));
        if (raw && raw.date === todayKey() && Array.isArray(raw.meals)) {
          DATA.meals = raw.meals;            // mismo día → recuperar
        } else if (raw && raw.date !== todayKey()) {
          DATA.meals = [];                   // día nuevo → empezar vacío
        }
      } catch (e) { /* sin almacenamiento, seguimos con los datos por defecto */ }
    }
    function saveLog() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ date: todayKey(), meals: DATA.meals }));
      } catch (e) {}
    }

    /* =========================================================
       RENDER
       ========================================================= */
    const $ = (id) => document.getElementById(id);

    function hello() {
      const h = new Date().getHours();
      if (h < 6)  return "Buenas noches";
      if (h < 14) return "Buenos días";
      if (h < 21) return "Buenas tardes";
      return "Buenas noches";
    }

    function render() {
      // Cabecera
      const d = new Date();
      $("dateLabel").textContent = d.toLocaleDateString("es-ES",
        { weekday: "long", day: "numeric", month: "long" }).toUpperCase();
      $("greeting").textContent = hello() + ", " + DATA.user.name;
      $("avatar").textContent = DATA.user.initial;

      // Resolver comidas desde el catálogo FOODS (cantidad × ración)
      const round = (n) => Math.round(n * 10) / 10;
      const items = DATA.meals.map(m => {
        const f = FOODS[m.food];
        if (!f) return null;
        const q = m.qty || 1;
        return {
          name: f.name, emoji: f.emoji, time: m.time,
          kcal: Math.round(f.kcal * q),
          protein: round(f.protein * q),
          carbs: round(f.carbs * q),
          fat: round(f.fat * q)
        };
      }).filter(Boolean);

      // Totales del día
      const sum = items.reduce((a, m) => ({
        kcal: a.kcal + m.kcal,
        protein: a.protein + m.protein,
        carbs: a.carbs + m.carbs,
        fat: a.fat + m.fat
      }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
      sum.protein = Math.round(sum.protein);
      sum.carbs = Math.round(sum.carbs);
      sum.fat = Math.round(sum.fat);

      // Contador principal
      const goal = DATA.goal.kcal;
      const left = Math.max(0, goal - sum.kcal);
      $("kcalNow").textContent = sum.kcal.toLocaleString("es-ES");
      $("kcalGoal").textContent = "/ " + goal.toLocaleString("es-ES");
      $("kcalLeft").textContent = left.toLocaleString("es-ES") + " kcal";
      const pct = Math.min(100, Math.round((sum.kcal / goal) * 100));
      requestAnimationFrame(() => { $("kcalBar").style.width = pct + "%"; });

      // Macros
      const macros = [
        { key: "p", name: "Proteínas", val: sum.protein, goal: DATA.goal.protein },
        { key: "c", name: "Carbos",    val: sum.carbs,   goal: DATA.goal.carbs },
        { key: "f", name: "Grasas",    val: sum.fat,     goal: DATA.goal.fat }
      ];
      $("macros").innerHTML = macros.map(m => {
        const p = Math.min(100, Math.round((m.val / m.goal) * 100));
        return `
          <div class="macro ${m.key}">
            <div class="name">${m.name}</div>
            <div class="val">${m.val}<span> /${m.goal}g</span></div>
            <div class="mini"><span data-w="${p}"></span></div>
          </div>`;
      }).join("");

      // Comidas
      const list = $("meals");
      if (!items.length) {
        list.innerHTML = `<li class="meal empty">Aún no has registrado nada hoy</li>`;
      } else {
        list.innerHTML = items.map(m => `
          <li class="meal">
            <div class="emoji">${m.emoji || "🍽️"}</div>
            <div class="body">
              <div class="t">${m.name}</div>
              <div class="s">${m.time}</div>
            </div>
            <div class="kcal">${m.kcal}<span>kcal</span></div>
          </li>`).join("");
      }

      // Animar mini-barras de macros
      requestAnimationFrame(() => {
        document.querySelectorAll('.macro .mini > span').forEach(s => {
          s.style.width = s.dataset.w + "%";
        });
      });
    }

    /* =========================================================
       PANTALLA AÑADIR COMIDA
       ========================================================= */
    const sheet = $("sheet");
    let activeMeal = "Desayuno";
    let draft = {};                 // claveAlimento -> nº de raciones a añadir

    function defaultMeal() {
      const h = new Date().getHours();
      if (h < 11) return "Desayuno";
      if (h < 16) return "Comida";
      if (h < 19) return "Snack";
      return "Cena";
    }

    function openSheet() {
      activeMeal = defaultMeal();
      draft = {};
      $("search").value = "";
      syncTabs();
      renderFoodList();
      updateFoot();
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      $("addBtn").classList.add("hidden");
    }
    function closeSheet() {
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      $("addBtn").classList.remove("hidden");
    }

    function syncTabs() {
      $("mealTabs").querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.meal === activeMeal));
    }

    function renderFoodList() {
      const q = $("search").value.trim().toLowerCase();
      const entries = Object.entries(FOODS).filter(([, f]) =>
        !q || f.name.toLowerCase().includes(q));
      const list = $("foodList");
      if (!entries.length) {
        list.innerHTML = `<li class="food" style="justify-content:center;color:var(--muted)">Sin resultados</li>`;
        return;
      }
      list.innerHTML = entries.map(([k, f]) => {
        const picked = draft[k] > 0;
        const control = picked
          ? `<div class="stepper">
               <button class="minus" data-dec="${k}" aria-label="Quitar">−</button>
               <span class="qty">${draft[k]}</span>
               <button data-inc="${k}" aria-label="Añadir">+</button>
             </div>`
          : `<button class="pick" data-inc="${k}" aria-label="Añadir">+</button>`;
        return `
          <li class="food ${picked ? "picked" : ""}">
            <div class="fe">${f.emoji}</div>
            <div class="fb">
              <div class="ft">${f.name}</div>
              <div class="fs">${f.ration} · ${f.kcal} kcal</div>
            </div>
            ${control}
          </li>`;
      }).join("");
    }

    function updateFoot() {
      const keys = Object.keys(draft).filter(k => draft[k] > 0);
      const btn = $("confirmAdd");
      if (!keys.length) {
        btn.disabled = true;
        btn.textContent = "Selecciona alimentos";
        return;
      }
      let kcal = 0;
      keys.forEach(k => { kcal += FOODS[k].kcal * draft[k]; });
      btn.disabled = false;
      btn.textContent = `Añadir a ${activeMeal} · ${Math.round(kcal)} kcal`;
    }

    // Eventos
    $("addBtn").addEventListener("click", openSheet);
    $("sheetClose").addEventListener("click", closeSheet);
    $("search").addEventListener("input", renderFoodList);

    $("mealTabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-meal]");
      if (!b) return;
      activeMeal = b.dataset.meal;
      syncTabs();
      updateFoot();
    });

    $("foodList").addEventListener("click", (e) => {
      const inc = e.target.closest("[data-inc]");
      const dec = e.target.closest("[data-dec]");
      if (inc) { const k = inc.dataset.inc; draft[k] = (draft[k] || 0) + 1; }
      else if (dec) { const k = dec.dataset.dec; draft[k] = Math.max(0, (draft[k] || 0) - 1); }
      else return;
      renderFoodList();
      updateFoot();
    });

    $("confirmAdd").addEventListener("click", () => {
      Object.keys(draft).forEach(k => {
        if (draft[k] > 0) DATA.meals.push({ food: k, time: activeMeal, qty: draft[k] });
      });
      saveLog();
      closeSheet();
      render();
    });

    /* ---------- Arranque ---------- */
    loadLog();
    render();
  </script>
</body>
</html>
