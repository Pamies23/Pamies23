<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a2a52">
  <title>Rayo - Carreras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      background: radial-gradient(circle at 50% 0%, #2a4a8b, #14213e 70%);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 14px; color: #fff;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    h1 {
      font-size: 1.6rem; letter-spacing: 1px; font-weight: 800;
      background: linear-gradient(#fff3b0, #ffcf3f);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    canvas {
      border-radius: 18px; display: block;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.12);
      touch-action: none;
    }
    .hint { font-size: 0.85rem; opacity: 0.85; text-shadow: 0 1px 3px rgba(0,0,0,0.5); text-align: center; }

    #rotate {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: #14213e; color: #fff; text-align: center; padding: 24px;
    }
    #rotate .ico { font-size: 56px; animation: spin 2s ease-in-out infinite; }
    @keyframes spin { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(78deg)} }

    @media (pointer: coarse) and (orientation: landscape) {
      body { padding: 0; gap: 0; }
      h1, .hint { display: none; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <h1>⚡ RAYO — ¡A CORRER!</h1>
  <canvas id="game"></canvas>
  <p class="hint">Toca o arrastra para mover el coche · Recoge las Copas 🏆 · Flechas/A-D en el ordenador</p>

  <div id="rotate">
    <div class="ico">📱</div>
    <div style="font-size:1.1rem;font-weight:700">Gira el móvil en horizontal</div>
    <div style="opacity:.7">Para jugar a pantalla completa</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- Resolución responsive (llena la pantalla sin deformar) ---
    const VIEW_H = 400;
    let VIEW_W = 800;
    const DPR = Math.min(2, window.devicePixelRatio || 1) * 1.5;

    function resize() {
      const coarse = matchMedia('(pointer: coarse)').matches;
      const landscape = window.innerWidth >= window.innerHeight;
      let cssW, cssH;
      if (coarse && landscape) {
        cssW = window.innerWidth; cssH = window.innerHeight;
        canvas.style.borderRadius = '0'; canvas.style.boxShadow = 'none';
      } else {
        cssH = Math.min(window.innerHeight * 0.82, (window.innerWidth * 0.94) / 2);
        cssW = cssH * 2;
        canvas.style.borderRadius = '18px';
        canvas.style.boxShadow = '0 24px 60px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.12)';
      }
      VIEW_W = Math.round(VIEW_H * (cssW / cssH));
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width = Math.round(VIEW_W * DPR);
      canvas.height = Math.round(VIEW_H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

    // --- Perspectiva (cámara trasera) ---
    const HORIZON = VIEW_H * 0.34;
    const HALF_HORIZON = 12;
    function CX() { return VIEW_W / 2; }
    function halfBottom() { return VIEW_W * 0.42; }
    function fPersp(d) { return 1 / (1 + Math.max(d, 0) * 6); }
    function projY(d) { return HORIZON + (VIEW_H - HORIZON) * fPersp(d); }
    function halfRoad(d) { return HALF_HORIZON + (halfBottom() - HALF_HORIZON) * fPersp(d); }
    function projX(lane, d) { return CX() + lane * halfRoad(d); }

    // --- Estado del juego ---
    const car = { w: 78, h: 70, lane: 0, targetLane: 0, wobble: 0, tilt: 0 };
    let roadScroll = 0, speed = 5, cups = 0, started = false, t = 0;
    const items = [];        // {lane, depth, type:'cup'|'cone', bob, done}
    const particles = [];
    const floats = [];
    let spawnTimer = 0;
    const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 220, y: 40 + (i % 2) * 30 }));

    // --- Sonido (se activa con el primer toque) ---
    let actx = null;
    function ensureAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
    function beep(freq, dur, type, vol) {
      if (!actx) return;
      try {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'sine'; o.frequency.value = freq;
        g.gain.value = vol || 0.08;
        o.connect(g); g.connect(actx.destination);
        const now = actx.currentTime;
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        o.start(now); o.stop(now + dur);
      } catch (e) {}
    }
    function happySound() { beep(660, 0.12, 'triangle', 0.09); setTimeout(() => beep(990, 0.14, 'triangle', 0.09), 90); }
    function boingSound() { beep(180, 0.18, 'sawtooth', 0.06); }

    // --- Entrada: el coche va hacia donde tocas ---
    const keys = {};
    function pointerToTarget(clientX) {
      const rect = canvas.getBoundingClientRect();
      const gx = (clientX - rect.left) / rect.width * VIEW_W;
      car.targetLane = Math.max(-0.92, Math.min(0.92, (gx - CX()) / (halfBottom() * 0.8)));
    }
    function onDown(e) { started = true; ensureAudio(); pointerToTarget(e.clientX); e.preventDefault(); }
    function onMove(e) { if (e.buttons || e.pointerType === 'touch') pointerToTarget(e.clientX); }
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true; started = true; ensureAudio();
      if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function spawnParticles(x, y, color, n) {
      for (let i = 0; i < n; i++) particles.push({
        x, y, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5 - 1,
        life: 1, color, r: 2 + Math.random() * 3
      });
    }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    // ===================== LÓGICA =====================
    function update() {
      t++;
      if (started) {
        if (keys['arrowleft'] || keys['a']) car.targetLane = Math.max(-0.92, car.targetLane - 0.05);
        if (keys['arrowright'] || keys['d']) car.targetLane = Math.min(0.92, car.targetLane + 0.05);

        const dl = car.targetLane - car.lane;
        car.lane += dl * 0.18;
        car.tilt = Math.max(-0.18, Math.min(0.18, dl * 0.6));
        if (car.wobble > 0) car.wobble--;

        speed = Math.min(9, 5 + cups * 0.05);
        roadScroll += speed * 0.02;

        // Generar objetos lejos (en el horizonte)
        if (--spawnTimer <= 0) {
          spawnTimer = Math.max(26, 64 - cups);
          const isCone = Math.random() < 0.28;
          items.push({ lane: (Math.random() * 1.6 - 0.8), depth: 2.7, type: isCone ? 'cone' : 'cup', bob: Math.random() * 6, done: false });
        }

        // Acercar objetos y comprobar recogida/choque
        const dz = speed * 0.0017;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.depth -= dz;
          if (it.depth < -0.18) { items.splice(i, 1); continue; }
          if (!it.done && it.depth < 0.14 && Math.abs(it.lane - car.lane) < 0.26) {
            it.done = true;
            const px = projX(it.lane, Math.max(it.depth, 0)), py = projY(Math.max(it.depth, 0));
            if (it.type === 'cup') {
              cups++;
              spawnParticles(px, py, '#ffd23f', 14);
              floats.push({ x: px, y: py, life: 1, txt: pick(['¡BIEN!', '¡GENIAL!', '¡YUJU!', '¡TOMA!', '¡KA-CHOW!']) });
              happySound();
            } else {
              car.wobble = 18; boingSound();
              spawnParticles(px, py, '#ff7a3c', 10);
            }
            items.splice(i, 1);
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = floats.length - 1; i >= 0; i--) {
        floats[i].y -= 1.2; floats[i].life -= 0.02;
        if (floats[i].life <= 0) floats.splice(i, 1);
      }
    }

    // ===================== HELPERS =====================
    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function ell(cx, cy, rx, ry) { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
    function star(cx, cy, r, rot) {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = rot + i * Math.PI / 4;
        const rr = i % 2 === 0 ? r : r * 0.42;
        ctx[i === 0 ? 'moveTo' : 'lineTo'](cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr);
      }
      ctx.closePath(); ctx.fill();
    }

    // ===================== RENDER =====================
    function draw() {
      // Cielo
      const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 30);
      sky.addColorStop(0, '#4db8ec'); sky.addColorStop(1, '#bfeaff');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, HORIZON + 30);

      // Sol
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath(); ctx.arc(VIEW_W - 90, 56, 28, 0, Math.PI * 2); ctx.fill();

      // Nubes
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      for (const c of clouds) {
        c.x -= 0.15; if (c.x < -90) c.x = VIEW_W + 60;
        cloud(c.x, c.y);
      }

      // Colinas en el horizonte
      ctx.fillStyle = '#7cc85e';
      for (let i = -1; i < 7; i++) {
        const hx = i * 170 - ((roadScroll * 4) % 170);
        ctx.beginPath(); ctx.moveTo(hx, HORIZON + 2);
        ctx.quadraticCurveTo(hx + 85, HORIZON - 34, hx + 170, HORIZON + 2); ctx.fill();
      }

      drawRoad();

      // Objetos: de lejos a cerca
      const sorted = items.slice().sort((a, b) => b.depth - a.depth);
      for (const it of sorted) {
        const d = Math.max(it.depth, 0);
        const s = 0.5 + fPersp(d) * 1.1;
        const x = projX(it.lane, d), y = projY(d);
        if (it.type === 'cup') drawCup(x, y + Math.sin((t + it.bob) * 0.15) * 2, s);
        else drawCone(x, y, s);
      }

      drawCar();

      // Partículas
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        star(p.x, p.y, p.r + 1.5, p.life * 6);
      }
      ctx.globalAlpha = 1;

      // Textos flotantes
      ctx.textAlign = 'center';
      for (const f of floats) {
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e8a000'; ctx.lineWidth = 4;
        ctx.font = '800 26px system-ui';
        ctx.strokeText(f.txt, f.x, f.y); ctx.fillText(f.txt, f.x, f.y);
      }
      ctx.globalAlpha = 1; ctx.textAlign = 'left';

      drawHUD();
      if (!started) startSplash();
    }

    function cloud(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.arc(x + 18, y + 5, 20, 0, Math.PI * 2);
      ctx.arc(x + 42, y + 2, 16, 0, Math.PI * 2);
      ctx.arc(x + 24, y - 7, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRoad() {
      const cx = CX();
      // Césped base
      ctx.fillStyle = '#62c24c';
      ctx.fillRect(0, HORIZON, VIEW_W, VIEW_H - HORIZON);

      // Bandas en perspectiva (suelo + carretera) para sensación de velocidad
      const ROWS = 22, STEP = 0.16;
      const scrollD = roadScroll * 0.9;
      for (let i = ROWS; i >= 0; i--) {
        const dF = (i + 1) * STEP - (scrollD % STEP);
        const dN = i * STEP - (scrollD % STEP);
        const yF = projY(Math.max(dF, 0));
        const yN = projY(Math.max(dN, 0));
        if (yN <= yF) continue;
        const parity = (i + Math.floor(scrollD / STEP)) % 2;
        const hF = halfRoad(Math.max(dF, 0)), hN = halfRoad(Math.max(dN, 0));

        // césped (dos verdes alternos)
        ctx.fillStyle = parity ? '#5cbb44' : '#67c952';
        ctx.fillRect(0, yF, VIEW_W, yN - yF + 1);

        // rumble (bordes rojo/blanco)
        ctx.fillStyle = parity ? '#e23b2b' : '#f4f4f4';
        band(cx - hF * 1.16, cx - hF, yF, cx - hN * 1.16, cx - hN, yN);
        band(cx + hF, cx + hF * 1.16, yF, cx + hN, cx + hN * 1.16, yN);

        // asfalto
        ctx.fillStyle = parity ? '#3b4048' : '#434851';
        band(cx - hF, cx + hF, yF, cx - hN, cx + hN, yN);

        // línea discontinua central (en bandas claras)
        if (!parity) {
          ctx.fillStyle = 'rgba(255,220,90,0.95)';
          band(cx - hF * 0.04, cx + hF * 0.04, yF, cx - hN * 0.04, cx + hN * 0.04, yN);
        }
      }
    }
    // Cuadrilátero (trapecio) entre dos líneas horizontales
    function band(xLF, xRF, yF, xLN, xRN, yN) {
      ctx.beginPath();
      ctx.moveTo(xLF, yF); ctx.lineTo(xRF, yF); ctx.lineTo(xRN, yN); ctx.lineTo(xLN, yN);
      ctx.closePath(); ctx.fill();
    }

    // Copa Pistón
    function drawCup(x, y, sc) {
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      const tw = 0.5 + Math.sin(t * 0.1 + x) * 0.5;
      ctx.fillStyle = 'rgba(255,240,160,' + (0.3 * tw) + ')';
      ell(0, 0, 20, 20);
      const g = ctx.createLinearGradient(-12, -12, 12, 12);
      g.addColorStop(0, '#ffe98a'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#e0a000');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-11, -12); ctx.quadraticCurveTo(-13, 4, 0, 8); ctx.quadraticCurveTo(13, 4, 11, -12);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#e0a000'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(-11, -7, 5, Math.PI * 0.4, Math.PI * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, -7, 5, -Math.PI * 0.6, Math.PI * 0.6); ctx.stroke();
      ctx.fillStyle = '#e0a000';
      roundRect(-3, 8, 6, 6, 1); ctx.fill();
      roundRect(-9, 13, 18, 5, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + tw + ')';
      star(6, -8, 3, t * 0.1);
      ctx.restore();
    }

    function drawCone(x, y, sc) {
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ell(0, 16, 16, 5);
      const g = ctx.createLinearGradient(0, -18, 0, 16);
      g.addColorStop(0, '#ff8a3c'); g.addColorStop(1, '#ef5f1f');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(-14, 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-8, 1); ctx.lineTo(8, 1); ctx.lineTo(10, 7); ctx.lineTo(-10, 7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d84e16';
      roundRect(-16, 14, 32, 5, 2); ctx.fill();
      ctx.restore();
    }

    // Coche estilo carrera (vista TRASERA / cámara de persecución)
    function drawCar() {
      const wob = car.wobble > 0 ? Math.sin(t * 0.8) * 3 : 0;
      const bounce = Math.sin(t * 0.25) * 1.0;
      const x = CX() + car.lane * halfBottom() * 0.8 + wob;
      const y = VIEW_H - 58 + bounce;
      const w = car.w, h = car.h;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(car.tilt);

      // sombra
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ell(0, h / 2 + 6, w / 2 + 8, 12);

      // ruedas traseras (grandes, cerca)
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#15171a';
        roundRect(s * (w / 2 - 5) - 9, h / 2 - 20, 18, 26, 7); ctx.fill();
        ctx.fillStyle = '#3a3d42';
        roundRect(s * (w / 2 - 5) - 6, h / 2 - 16, 12, 16, 4); ctx.fill();
      }

      // carrocería (trapecio: más ancho atrás/abajo)
      const body = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      body.addColorStop(0, '#b41a0c'); body.addColorStop(0.5, '#f0331f'); body.addColorStop(1, '#b41a0c');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(-w * 0.32, -h / 2 + 6); ctx.lineTo(w * 0.32, -h / 2 + 6);
      ctx.lineTo(w * 0.5, h / 2 - 4); ctx.lineTo(-w * 0.5, h / 2 - 4);
      ctx.closePath(); ctx.fill();
      roundRect(-w / 2, h / 2 - 18, w, 16, 9); ctx.fill();

      // techo (delante, lejos) más estrecho
      ctx.fillStyle = '#e22a18';
      roundRect(-w * 0.26, -h / 2, w * 0.52, 15, 8); ctx.fill();
      // brillo
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(-w * 0.22, -h / 2 + 3, w * 0.44, 5, 3); ctx.fill();

      // parabrisas + OJOS asomando por delante (Rayo reconocible)
      const ws = ctx.createLinearGradient(0, -h / 2 + 4, 0, -h / 2 + 20);
      ws.addColorStop(0, '#d6f1ff'); ws.addColorStop(1, '#8ccbef');
      ctx.fillStyle = ws;
      ctx.beginPath();
      ctx.moveTo(-w * 0.22, -h / 2 + 6); ctx.lineTo(w * 0.22, -h / 2 + 6);
      ctx.lineTo(w * 0.17, -h / 2 + 19); ctx.lineTo(-w * 0.17, -h / 2 + 19);
      ctx.closePath(); ctx.fill();
      const blink = (t % 220) < 8;
      for (const s of [-1, 1]) {
        const ex = s * 9, ey = -h / 2 + 12;
        ctx.fillStyle = '#fff'; ell(ex, ey, 5.5, 6);
        if (!blink) {
          ctx.fillStyle = '#2aa3e0'; ell(ex, ey + 1, 3, 3.4);
          ctx.fillStyle = '#10243a'; ell(ex, ey + 1.5, 1.5, 1.8);
          ctx.fillStyle = '#fff'; ell(ex + 1, ey, 0.8, 0.9);
        } else {
          ctx.strokeStyle = '#2b4a5c'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(ex - 4, ey); ctx.lineTo(ex + 4, ey); ctx.stroke();
        }
      }

      // luneta trasera oscura
      ctx.fillStyle = '#2a2f36';
      ctx.beginPath();
      ctx.moveTo(-w * 0.22, -h / 2 + 16); ctx.lineTo(w * 0.22, -h / 2 + 16);
      ctx.lineTo(w * 0.28, -h / 2 + 30); ctx.lineTo(-w * 0.28, -h / 2 + 30);
      ctx.closePath(); ctx.fill();

      // rayo amarillo + 95
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#e8a000'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-9, -h / 2 + 34); ctx.lineTo(6, -h / 2 + 34); ctx.lineTo(-1, -h / 2 + 42);
      ctx.lineTo(9, -h / 2 + 42); ctx.lineTo(-7, h / 2 - 20); ctx.lineTo(0, -h / 2 + 46);
      ctx.lineTo(-10, -h / 2 + 46); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ell(0, h / 2 - 22, 12, 12);
      ctx.fillStyle = '#111'; ctx.font = '900 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('95', 0, h / 2 - 21); ctx.textBaseline = 'alphabetic';

      // alerón trasero
      ctx.fillStyle = '#7a0f06';
      roundRect(-w * 0.42, h / 2 - 12, w * 0.84, 6, 3); ctx.fill();
      ctx.fillStyle = '#c81f0f';
      roundRect(-w * 0.30, h / 2 - 11, 6, 9, 2); ctx.fill();
      roundRect(w * 0.30 - 6, h / 2 - 11, 6, 9, 2); ctx.fill();

      // pilotos traseros
      ctx.fillStyle = '#ff5a4a';
      roundRect(-w * 0.46, h / 2 - 6, 12, 5, 2); ctx.fill();
      roundRect(w * 0.46 - 12, h / 2 - 6, 12, 5, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,150,0.95)';
      roundRect(-w * 0.44, h / 2 - 5, 5, 3, 1); ctx.fill();
      roundRect(w * 0.44 - 5, h / 2 - 5, 5, 3, 1); ctx.fill();

      // escapes
      ctx.fillStyle = '#cdd3da';
      ell(-7, h / 2 - 1, 2.5, 2); ell(7, h / 2 - 1, 2.5, 2);

      ctx.restore();
      ctx.textAlign = 'left';
    }

    function drawHUD() {
      ctx.save();
      ctx.fillStyle = 'rgba(20,14,8,0.42)';
      roundRect(12, 12, 132, 44, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
      roundRect(12, 12, 132, 44, 14); ctx.stroke();
      drawCup(34, 34, 1);
      ctx.fillStyle = '#fff'; ctx.font = '800 24px system-ui';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('×' + cups, 56, 35);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }

    function startSplash() {
      ctx.fillStyle = 'rgba(10,20,40,0.55)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd23f'; ctx.font = '800 40px system-ui';
      ctx.fillText('⚡ ¡A CORRER!', VIEW_W / 2, VIEW_H / 2 - 14);
      ctx.fillStyle = '#fff'; ctx.font = '700 20px system-ui';
      ctx.globalAlpha = 0.6 + Math.sin(t * 0.08) * 0.4;
      ctx.fillText('Toca la pantalla para empezar', VIEW_W / 2, VIEW_H / 2 + 22);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
