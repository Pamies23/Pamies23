<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a2a52">
  <title>Rayo - Carreras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      background: radial-gradient(circle at 50% 0%, #2a4a8b, #14213e 70%);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 14px; color: #fff;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    h1 {
      font-size: 1.6rem; letter-spacing: 1px; font-weight: 800;
      background: linear-gradient(#fff3b0, #ffcf3f);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    canvas {
      border-radius: 18px; display: block;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.12);
      touch-action: none;
    }
    .hint { font-size: 0.85rem; opacity: 0.85; text-shadow: 0 1px 3px rgba(0,0,0,0.5); text-align: center; }

    /* ---- Flechas táctiles (una a cada lado) ---- */
    #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 20; }
    .arrow {
      position: absolute;
      bottom: calc(22px + env(safe-area-inset-bottom));
      width: 92px; height: 92px; border-radius: 26px;
      background: rgba(255,255,255,0.13);
      border: 2px solid rgba(255,255,255,0.30);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      color: rgba(255,255,255,0.85); font-size: 46px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
      pointer-events: auto; transition: transform .05s, background .05s;
    }
    .arrow.left  { left:  calc(18px + env(safe-area-inset-left)); }
    .arrow.right { right: calc(18px + env(safe-area-inset-right)); }
    .arrow.pressed, .arrow:active { background: rgba(255,255,255,0.32); transform: scale(0.94); }

    #rotate {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: #14213e; color: #fff; text-align: center; padding: 24px;
    }
    #rotate .ico { font-size: 56px; animation: spin 2s ease-in-out infinite; }
    @keyframes spin { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(78deg)} }

    @media (pointer: coarse) { #touch { display: block; } }
    @media (pointer: coarse) and (orientation: landscape) {
      body { padding: 0; gap: 0; }
      h1, .hint { display: none; }
      canvas { position: fixed; inset: 0; border-radius: 0; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <h1>⚡ RAYO — ¡A CORRER!</h1>
  <canvas id="game"></canvas>
  <p class="hint">Usa las flechas de los lados para mover a Rayo · Recoge las Copas 🏆</p>

  <div id="touch">
    <div class="arrow left"  id="btnLeft"  aria-label="Izquierda">‹</div>
    <div class="arrow right" id="btnRight" aria-label="Derecha">›</div>
  </div>

  <div id="rotate">
    <div class="ico">📱</div>
    <div style="font-size:1.1rem;font-weight:700">Gira el móvil en horizontal</div>
    <div style="opacity:.7">Para jugar a pantalla completa</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- Resolución responsive (llena toda la pantalla) ---
    const VIEW_H = 400;
    let VIEW_W = 800;
    const DPR = Math.min(2, window.devicePixelRatio || 1) * 1.5;

    function resize() {
      const coarse = matchMedia('(pointer: coarse)').matches;
      const landscape = window.innerWidth >= window.innerHeight;
      let cssW, cssH;
      if (coarse && landscape) {
        cssW = window.innerWidth; cssH = window.innerHeight;
        canvas.style.borderRadius = '0'; canvas.style.boxShadow = 'none';
      } else {
        cssH = Math.min(window.innerHeight * 0.82, (window.innerWidth * 0.94) / 2);
        cssW = cssH * 2;
        canvas.style.borderRadius = '18px';
        canvas.style.boxShadow = '0 24px 60px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.12)';
      }
      VIEW_W = Math.round(VIEW_H * (cssW / cssH));
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width = Math.round(VIEW_W * DPR);
      canvas.height = Math.round(VIEW_H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

    // --- Perspectiva (cámara trasera) ---
    const HORIZON = VIEW_H * 0.36;
    const HALF_HORIZON = 10;
    function CX() { return VIEW_W / 2; }
    function halfBottom() { return VIEW_W * 0.42; }
    function fPersp(d) { return 1 / (1 + Math.max(d, 0) * 6); }
    function projY(d) { return HORIZON + (VIEW_H - HORIZON) * fPersp(d); }
    function halfRoad(d) { return HALF_HORIZON + (halfBottom() - HALF_HORIZON) * fPersp(d); }
    function projX(lane, d) { return CX() + lane * halfRoad(d); }

    // --- Estado ---
    const car = { w: 86, h: 78, lane: 0, targetLane: 0, wobble: 0, tilt: 0 };
    let roadScroll = 0, speed = 3, cups = 0, started = false, t = 0;
    const items = [];        // {lane, depth, type, bob, done}
    const props = [];        // árboles decorativos a los lados
    const particles = [];
    const floats = [];
    let spawnTimer = 0, propTimer = 0;
    const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 220, y: 38 + (i % 2) * 26 }));

    // --- Sonido (se activa con el primer toque) ---
    let actx = null;
    function ensureAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
    function beep(freq, dur, type, vol) {
      if (!actx) return;
      try {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'sine'; o.frequency.value = freq;
        g.gain.value = vol || 0.08; o.connect(g); g.connect(actx.destination);
        const now = actx.currentTime;
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        o.start(now); o.stop(now + dur);
      } catch (e) {}
    }
    function happySound() { beep(660, 0.12, 'triangle', 0.09); setTimeout(() => beep(990, 0.14, 'triangle', 0.09), 90); }
    function boingSound() { beep(180, 0.18, 'sawtooth', 0.06); }

    // --- Entrada: flechas a los lados (+ teclado en ordenador) ---
    const keys = {};
    function holdButton(id, key) {
      const el = document.getElementById(id); if (!el) return;
      const press = e => { e.preventDefault(); keys[key] = true; started = true; ensureAudio(); el.classList.add('pressed'); };
      const release = e => { if (e) e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);
      el.addEventListener('contextmenu', e => e.preventDefault());
    }
    holdButton('btnLeft', 'arrowleft');
    holdButton('btnRight', 'arrowright');
    canvas.addEventListener('pointerdown', e => { started = true; ensureAudio(); e.preventDefault(); });
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true; started = true; ensureAudio();
      if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function spawnParticles(x, y, color, n) {
      for (let i = 0; i < n; i++) particles.push({
        x, y, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5 - 1,
        life: 1, color, r: 2 + Math.random() * 3
      });
    }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    // ===================== LÓGICA =====================
    function update() {
      t++;
      if (started) {
        if (keys['arrowleft'] || keys['a']) car.targetLane = Math.max(-0.9, car.targetLane - 0.035);
        if (keys['arrowright'] || keys['d']) car.targetLane = Math.min(0.9, car.targetLane + 0.035);

        const dl = car.targetLane - car.lane;
        car.lane += dl * 0.15;
        car.tilt = Math.max(-0.16, Math.min(0.16, dl * 0.5));
        if (car.wobble > 0) car.wobble--;

        // Velocidad tranquila (sube muy poquito)
        speed = Math.min(5, 3 + cups * 0.03);
        roadScroll += speed * 0.016;

        // Copas y conos
        if (--spawnTimer <= 0) {
          spawnTimer = Math.max(46, 78 - cups);
          const isCone = Math.random() < 0.26;
          items.push({ lane: (Math.random() * 1.6 - 0.8), depth: 2.7, type: isCone ? 'cone' : 'cup', bob: Math.random() * 6, done: false });
        }
        // Árboles a los lados
        if (--propTimer <= 0) {
          propTimer = 40 + Math.floor(Math.random() * 30);
          const side = Math.random() < 0.5 ? -1 : 1;
          props.push({ lane: side * (1.25 + Math.random() * 0.4), depth: 2.7, kind: Math.random() < 0.5 ? 0 : 1 });
        }

        const dz = speed * 0.0042;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.depth -= dz;
          if (it.depth < -0.18) { items.splice(i, 1); continue; }
          if (!it.done && it.depth < 0.14 && Math.abs(it.lane - car.lane) < 0.26) {
            it.done = true;
            const px = projX(it.lane, Math.max(it.depth, 0)), py = projY(Math.max(it.depth, 0));
            if (it.type === 'cup') {
              cups++;
              spawnParticles(px, py, '#ffd23f', 14);
              floats.push({ x: px, y: py, life: 1, txt: pick(['¡BIEN!', '¡GENIAL!', '¡YUJU!', '¡TOMA!', '¡KA-CHOW!']) });
              happySound();
            } else {
              car.wobble = 18; boingSound();
              spawnParticles(px, py, '#ff7a3c', 10);
            }
            items.splice(i, 1);
          }
        }
        for (let i = props.length - 1; i >= 0; i--) {
          props[i].depth -= dz;
          if (props[i].depth < -0.2) props.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = floats.length - 1; i >= 0; i--) {
        floats[i].y -= 1.1; floats[i].life -= 0.02;
        if (floats[i].life <= 0) floats.splice(i, 1);
      }
    }

    // ===================== HELPERS =====================
    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function ell(cx, cy, rx, ry) { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
    function star(cx, cy, r, rot) {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = rot + i * Math.PI / 4;
        const rr = i % 2 === 0 ? r : r * 0.42;
        ctx[i === 0 ? 'moveTo' : 'lineTo'](cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr);
      }
      ctx.closePath(); ctx.fill();
    }
    function band(xLF, xRF, yF, xLN, xRN, yN) {
      ctx.beginPath();
      ctx.moveTo(xLF, yF); ctx.lineTo(xRF, yF); ctx.lineTo(xRN, yN); ctx.lineTo(xLN, yN);
      ctx.closePath(); ctx.fill();
    }

    // ===================== RENDER =====================
    function draw() {
      // Cielo suave
      const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
      sky.addColorStop(0, '#7ed0f2'); sky.addColorStop(1, '#d6f0ff');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, HORIZON + 40);

      // Sol con halo
      const sx = VIEW_W - 95, sy = 54;
      const halo = ctx.createRadialGradient(sx, sy, 6, sx, sy, 70);
      halo.addColorStop(0, 'rgba(255,248,210,0.9)'); halo.addColorStop(1, 'rgba(255,248,210,0)');
      ctx.fillStyle = halo; ctx.fillRect(sx - 80, sy - 80, 160, 160);
      ctx.fillStyle = '#fff4cf'; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, Math.PI * 2); ctx.fill();

      // Nubes
      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      for (const c of clouds) { c.x -= 0.12; if (c.x < -90) c.x = VIEW_W + 60; cloud(c.x, c.y); }

      // Colinas (dos capas suaves)
      hills(0.30, '#9bd97e', 40);
      hills(0.55, '#7cc85e', 18);

      drawRoad();

      // Árboles laterales + objetos, ordenados de lejos a cerca
      const scene = [];
      for (const p of props) scene.push({ d: p.depth, kind: 'tree', ref: p });
      for (const it of items) scene.push({ d: it.depth, kind: 'item', ref: it });
      scene.sort((a, b) => b.d - a.d);
      for (const o of scene) {
        const d = Math.max(o.d, 0);
        const s = 0.45 + fPersp(d) * 1.15;
        const x = projX(o.ref.lane, d), y = projY(d);
        if (o.kind === 'tree') drawTree(x, y, s, o.ref.kind);
        else if (o.ref.type === 'cup') drawCup(x, y + Math.sin((t + o.ref.bob) * 0.15) * 2, s);
        else drawCone(x, y, s);
      }

      drawCar();

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color; star(p.x, p.y, p.r + 1.5, p.life * 6);
      }
      ctx.globalAlpha = 1;

      ctx.textAlign = 'center';
      for (const f of floats) {
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e8a000'; ctx.lineWidth = 4;
        ctx.font = '800 26px system-ui';
        ctx.strokeText(f.txt, f.x, f.y); ctx.fillText(f.txt, f.x, f.y);
      }
      ctx.globalAlpha = 1; ctx.textAlign = 'left';

      drawHUD();
      if (!started) startSplash();
    }

    function cloud(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.arc(x + 18, y + 5, 20, 0, Math.PI * 2);
      ctx.arc(x + 42, y + 2, 16, 0, Math.PI * 2);
      ctx.arc(x + 24, y - 7, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    function hills(par, color, h) {
      ctx.fillStyle = color;
      const off = (roadScroll * 6 * par) % 200;
      for (let i = -1; i < 8; i++) {
        const hx = i * 200 - off;
        ctx.beginPath();
        ctx.moveTo(hx, HORIZON + 2);
        ctx.quadraticCurveTo(hx + 100, HORIZON - h, hx + 200, HORIZON + 2);
        ctx.fill();
      }
    }

    function drawRoad() {
      const cx = CX();
      ctx.fillStyle = '#66bf48';
      ctx.fillRect(0, HORIZON, VIEW_W, VIEW_H - HORIZON);

      // Bandas en perspectiva — colores MUY suaves (sin parpadeo)
      const ROWS = 18, STEP = 0.2;
      const scrollD = roadScroll * 0.5;
      for (let i = ROWS; i >= 0; i--) {
        const dF = (i + 1) * STEP - (scrollD % STEP);
        const dN = i * STEP - (scrollD % STEP);
        const yF = projY(Math.max(dF, 0));
        const yN = projY(Math.max(dN, 0));
        if (yN <= yF) continue;
        const parity = (i + Math.floor(scrollD / STEP)) % 2;
        const hF = halfRoad(Math.max(dF, 0)), hN = halfRoad(Math.max(dN, 0));

        // césped: dos verdes casi idénticos (textura sutil)
        ctx.fillStyle = parity ? '#69bf47' : '#65bb44';
        ctx.fillRect(0, yF, VIEW_W, yN - yF + 1);

        // rumble lateral: rojo apagado / crema (poco contraste)
        ctx.fillStyle = parity ? '#cf6b59' : '#ece4d6';
        band(cx - hF * 1.14, cx - hF, yF, cx - hN * 1.14, cx - hN, yN);
        band(cx + hF, cx + hF * 1.14, yF, cx + hN, cx + hN * 1.14, yN);

        // asfalto: tono único (sin parpadeo)
        ctx.fillStyle = '#474d57';
        band(cx - hF, cx + hF, yF, cx - hN, cx + hN, yN);

        // línea central discontinua (suave)
        if (parity) {
          ctx.fillStyle = 'rgba(245,225,140,0.8)';
          band(cx - hF * 0.035, cx + hF * 0.035, yF, cx - hN * 0.035, cx + hN * 0.035, yN);
        }
      }
    }

    function drawTree(x, y, sc, kind) {
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.16)'; ell(0, 2, 14, 4);
      ctx.fillStyle = '#7a4a1e'; roundRect(-4, -22, 8, 24, 3); ctx.fill();
      if (kind === 0) {
        const g = ctx.createRadialGradient(-5, -42, 4, 0, -38, 24);
        g.addColorStop(0, '#7ad95f'); g.addColorStop(1, '#3f9e34');
        ctx.fillStyle = g;
        ell(0, -38, 20, 22);
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; ell(-7, -46, 6, 6);
      } else {
        const g = ctx.createLinearGradient(0, -54, 0, -20);
        g.addColorStop(0, '#7ad95f'); g.addColorStop(1, '#3f9e34');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0, -56); ctx.lineTo(15, -22); ctx.lineTo(-15, -22); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, -44); ctx.lineTo(17, -8); ctx.lineTo(-17, -8); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    function drawCup(x, y, sc) {
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      const tw = 0.5 + Math.sin(t * 0.1 + x) * 0.5;
      ctx.fillStyle = 'rgba(255,240,160,' + (0.3 * tw) + ')'; ell(0, 0, 20, 20);
      const g = ctx.createLinearGradient(-12, -12, 12, 12);
      g.addColorStop(0, '#ffe98a'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#e0a000');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-11, -12); ctx.quadraticCurveTo(-13, 4, 0, 8); ctx.quadraticCurveTo(13, 4, 11, -12); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#e0a000'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(-11, -7, 5, Math.PI * 0.4, Math.PI * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, -7, 5, -Math.PI * 0.6, Math.PI * 0.6); ctx.stroke();
      ctx.fillStyle = '#e0a000'; roundRect(-3, 8, 6, 6, 1); ctx.fill(); roundRect(-9, 13, 18, 5, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + tw + ')'; star(6, -8, 3, t * 0.1);
      ctx.restore();
    }

    function drawCone(x, y, sc) {
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ell(0, 16, 16, 5);
      const g = ctx.createLinearGradient(0, -18, 0, 16);
      g.addColorStop(0, '#ff8a3c'); g.addColorStop(1, '#ef5f1f');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(-14, 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-8, 1); ctx.lineTo(8, 1); ctx.lineTo(10, 7); ctx.lineTo(-10, 7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d84e16'; roundRect(-16, 14, 32, 5, 2); ctx.fill();
      ctx.restore();
    }

    // Coche de carreras visto por DETRÁS (sin ojos), diseño limpio
    function drawCar() {
      const wob = car.wobble > 0 ? Math.sin(t * 0.8) * 2.5 : 0;
      const bounce = Math.sin(t * 0.22) * 0.8;
      const x = CX() + car.lane * halfBottom() * 0.8 + wob;
      const y = VIEH(), w = car.w, h = car.h;
      ctx.save();
      ctx.translate(x, y + bounce);
      ctx.rotate(car.tilt);

      // sombra
      ctx.fillStyle = 'rgba(0,0,0,0.30)'; ell(0, h / 2 + 7, w / 2 + 10, 13);

      // ruedas traseras con llanta
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#16181b';
        roundRect(s * (w / 2 - 4) - 10, h / 2 - 22, 20, 28, 8); ctx.fill();
        ctx.fillStyle = '#2c2f34';
        roundRect(s * (w / 2 - 4) - 7, h / 2 - 18, 14, 18, 5); ctx.fill();
        ctx.fillStyle = '#c9ced6';
        ell(s * (w / 2 - 4), h / 2 - 9, 4, 5);
      }

      // carrocería (trapecio: más ancho abajo/atrás) con degradado vertical
      const body = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      body.addColorStop(0, '#ff4630'); body.addColorStop(0.55, '#e22a18'); body.addColorStop(1, '#a81708');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(-w * 0.30, -h / 2 + 8);
      ctx.quadraticCurveTo(-w * 0.5, h / 2 - 20, -w * 0.5, h / 2 - 6);
      ctx.lineTo(w * 0.5, h / 2 - 6);
      ctx.quadraticCurveTo(w * 0.5, h / 2 - 20, w * 0.30, -h / 2 + 8);
      ctx.closePath(); ctx.fill();
      roundRect(-w / 2, h / 2 - 20, w, 16, 10); ctx.fill();

      // sombreado lateral para dar volumen
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      roundRect(-w / 2, h / 2 - 22, 9, 18, 5); ctx.fill();
      roundRect(w / 2 - 9, h / 2 - 22, 9, 18, 5); ctx.fill();
      // brillo central superior
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      roundRect(-w * 0.22, -h / 2 + 10, w * 0.44, 7, 4); ctx.fill();

      // techo/capó (parte de delante, más estrecho y lejano)
      ctx.fillStyle = '#cf2314';
      roundRect(-w * 0.24, -h / 2, w * 0.48, 16, 9); ctx.fill();

      // luneta trasera (cristal oscuro con reflejo) — sin ojos
      const gl = ctx.createLinearGradient(0, -h / 2 + 14, 0, -h / 2 + 34);
      gl.addColorStop(0, '#3a4350'); gl.addColorStop(1, '#222831');
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.moveTo(-w * 0.22, -h / 2 + 14); ctx.lineTo(w * 0.22, -h / 2 + 14);
      ctx.lineTo(w * 0.28, -h / 2 + 34); ctx.lineTo(-w * 0.28, -h / 2 + 34);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.moveTo(-w * 0.18, -h / 2 + 16); ctx.lineTo(-w * 0.02, -h / 2 + 16);
      ctx.lineTo(-w * 0.10, -h / 2 + 33); ctx.lineTo(-w * 0.24, -h / 2 + 33);
      ctx.closePath(); ctx.fill();

      // rayo amarillo + número 95
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#e8a000'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-9, -h / 2 + 38); ctx.lineTo(7, -h / 2 + 38); ctx.lineTo(-1, -h / 2 + 47);
      ctx.lineTo(10, -h / 2 + 47); ctx.lineTo(-8, h / 2 - 22); ctx.lineTo(0, -h / 2 + 52);
      ctx.lineTo(-11, -h / 2 + 52); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ell(0, h / 2 - 24, 13, 13);
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, h / 2 - 24, 13, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.font = '900 15px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('95', 0, h / 2 - 23); ctx.textBaseline = 'alphabetic';

      // alerón trasero con placas laterales
      ctx.fillStyle = '#8a1107';
      roundRect(-w * 0.44, h / 2 - 14, w * 0.88, 7, 3); ctx.fill();
      ctx.fillStyle = '#c81f0f';
      roundRect(-w * 0.30, h / 2 - 13, 6, 11, 2); ctx.fill();
      roundRect(w * 0.30 - 6, h / 2 - 13, 6, 11, 2); ctx.fill();
      roundRect(-w * 0.46, h / 2 - 17, 5, 13, 2); ctx.fill();
      roundRect(w * 0.46 - 5, h / 2 - 17, 5, 13, 2); ctx.fill();

      // pilotos traseros (brillan)
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#7a0f06'; roundRect(s * w * 0.30 - 13, h / 2 - 6, 26 * 0 + 16, 6, 3); ctx.fill();
        ctx.fillStyle = '#ff5a4a'; roundRect(s * w * 0.30 - 12, h / 2 - 5, 14, 4, 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,210,170,0.95)'; roundRect(s * w * 0.30 - 10, h / 2 - 4.5, 5, 2.5, 1); ctx.fill();
      }
      // difusor + escapes
      ctx.fillStyle = '#23262b'; roundRect(-12, h / 2 - 6, 24, 6, 2); ctx.fill();
      ctx.fillStyle = '#3a3f47';
      for (let k = -2; k <= 2; k++) { roundRect(k * 4 - 1, h / 2 - 6, 2, 6, 1); ctx.fill(); }
      ctx.fillStyle = '#cdd3da'; ell(-8, h / 2 - 1, 2.6, 2); ell(8, h / 2 - 1, 2.6, 2);

      ctx.restore();
      ctx.textAlign = 'left';
    }
    function VIEH() { return VIEW_H - 54; }

    function drawHUD() {
      ctx.save();
      ctx.fillStyle = 'rgba(20,14,8,0.42)';
      roundRect(14, 14, 132, 44, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
      roundRect(14, 14, 132, 44, 14); ctx.stroke();
      drawCup(36, 36, 1);
      ctx.fillStyle = '#fff'; ctx.font = '800 24px system-ui';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('×' + cups, 58, 37);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }

    function startSplash() {
      ctx.fillStyle = 'rgba(10,20,40,0.55)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd23f'; ctx.font = '800 40px system-ui';
      ctx.fillText('⚡ ¡A CORRER!', VIEW_W / 2, VIEW_H / 2 - 14);
      ctx.fillStyle = '#fff'; ctx.font = '700 19px system-ui';
      ctx.globalAlpha = 0.6 + Math.sin(t * 0.08) * 0.4;
      ctx.fillText('Toca para empezar · flechas para conducir', VIEW_W / 2, VIEW_H / 2 + 22);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
