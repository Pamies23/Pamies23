<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pantalla de carga — Béisbol</title>
<!--
  PANTALLA DE CARGA "BÉISBOL" (siluetas blancas sobre negro)
  ----------------------------------------------------------
  Secuencia en bucle:
    1. Un pitcher hace el wind-up y lanza la bola.
    2. La cámara sigue solo la bola durante su vuelo.
    3. Aparece el bateador, batea y la bola sale despedida.

  Autocontenida: sin librerías. API igual que el loader de plasma:
    BaseballLoader.hide()           — oculta el loader con fundido
    BaseballLoader.replay()         — lo vuelve a mostrar
    BaseballLoader.setProgress(p)   — controla el porcentaje (0-100)
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  #baseball-loader {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    transition: opacity 1s ease;
  }
  #baseball-loader.hidden { opacity: 0; pointer-events: none; }

  #baseball-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .bb-ui {
    position: absolute;
    left: 0; right: 0;
    bottom: 9%;
    text-align: center;
    user-select: none;
    pointer-events: none;
  }
  .bb-percent {
    font-size: clamp(1.3rem, 3.6vw, 2rem);
    font-weight: 200;
    letter-spacing: 0.08em;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .bb-label {
    margin-top: 0.4rem;
    font-size: clamp(0.58rem, 1.5vw, 0.75rem);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    animation: bb-pulse 2.2s ease-in-out infinite;
  }
  @keyframes bb-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* Contenido de ejemplo */
  .demo-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    color: #ddd;
    background: #0a0a0a;
  }
  .demo-content h1 { font-weight: 300; letter-spacing: 0.05em; }
  .demo-content p  { color: #888; max-width: 34rem; text-align: center; line-height: 1.6; padding: 0 1rem; }
  .demo-content button {
    margin-top: 0.8rem;
    padding: 0.7rem 1.6rem;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .demo-content button:hover { background: rgba(255,255,255,0.12); }
</style>
</head>
<body>

  <main class="demo-content">
    <h1>Tu página ya ha cargado ⚾</h1>
    <p>La pantalla de carga de béisbol se desvanece al llegar al 100&nbsp;%.
       Pulsa el botón para reproducir la secuencia otra vez.</p>
    <button onclick="BaseballLoader.replay()">Reproducir de nuevo</button>
  </main>

  <!-- ===== PANTALLA DE CARGA ===== -->
  <div id="baseball-loader">
    <canvas id="baseball-canvas"></canvas>
    <div class="bb-ui">
      <div class="bb-percent" id="bb-percent">0%</div>
      <div class="bb-label">Cargando</div>
    </div>
  </div>

<script>
/*ANIM-START*/
/* ============================================================
   ANIMACIÓN: esqueleto 2D interpolado por fotogramas clave.
   Mundo en unidades de diseño (lienzo lógico 800x450), la
   cámara se desplaza para seguir la bola entre los dos jugadores.
   ============================================================ */
var BB = (function () {
  "use strict";

  var LOOP = 5.6;            /* duración del bucle (s) */
  var D2R = Math.PI / 180;

  function dirv(a) { return [Math.cos(a * D2R), -Math.sin(a * D2R)]; }
  function add(p, d, l) { return [p[0] + d[0] * l, p[1] + d[1] * l]; }
  function lerp(a, b, u) { return a + (b - a) * u; }
  /* interpolación de ángulos por el camino corto */
  function lerpAng(a, b, u) {
    var d = (b - a) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return a + d * u;
  }
  function clamp01(x) { return Math.min(1, Math.max(0, x)); }
  function ss(a, b, x) { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); }

  var EASE = {
    lin: function (u) { return u; },
    io:  function (u) { return u * u * (3 - 2 * u); },
    out: function (u) { return 1 - Math.pow(1 - u, 3); },
    in:  function (u) { return u * u * u; }
  };

  function poseAt(t, frames) {
    if (t <= frames[0][0]) return frames[0][1];
    for (var i = 0; i < frames.length - 1; i++) {
      var t0 = frames[i][0], p0 = frames[i][1];
      var t1 = frames[i + 1][0], p1 = frames[i + 1][1];
      var easeName = frames[i + 1][2] || "io";
      if (t >= t0 && t < t1) {
        var u = EASE[easeName]((t - t0) / (t1 - t0));
        var r = {};
        for (var k in p0) {
          r[k] = (k === "x" || k === "y") ? lerp(p0[k], p1[k], u)
                                          : lerpAng(p0[k], p1[k], u);
        }
        return r;
      }
    }
    return frames[frames.length - 1][1];
  }

  /* ---------- figura ---------- */
  var T = 52, UA = 30, FA = 28, TH = 40, SH = 38, FT = 13, HR = 12;

  function drawFigure(ctx, p, facing) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#fff";

    var hip = [p.x, p.y];
    var td = dirv(p.torso);
    var neck = add(hip, td, T);
    var headC = add(neck, dirv(p.torso + (p.ht || 0)), 15);
    var sh = add(hip, td, T - 4);

    function seg(a, b, w) {
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }

    seg(hip, neck, 24);                                   /* torso */
    ctx.beginPath();                                       /* cabeza */
    ctx.arc(headC[0], headC[1], HR, 0, 7);
    ctx.fill();
    /* visera de la gorra hacia donde mira */
    seg([headC[0] + facing * 5, headC[1] - 6], [headC[0] + facing * 16, headC[1] - 4], 5);

    var rElb = add(sh, dirv(p.ruA), UA), rHand = add(rElb, dirv(p.rfA), FA);
    var lElb = add(sh, dirv(p.luA), UA), lHand = add(lElb, dirv(p.lfA), FA);
    seg(sh, rElb, 12); seg(rElb, rHand, 11);
    seg(sh, lElb, 12); seg(lElb, lHand, 11);

    var rKnee = add(hip, dirv(p.rtA), TH), rAnk = add(rKnee, dirv(p.rsA), SH);
    var lKnee = add(hip, dirv(p.ltA), TH), lAnk = add(lKnee, dirv(p.lsA), SH);
    seg(hip, rKnee, 15); seg(rKnee, rAnk, 12);
    seg(rAnk, add(rAnk, dirv(p.rft), FT), 9);
    seg(hip, lKnee, 15); seg(lKnee, lAnk, 12);
    seg(lAnk, add(lAnk, dirv(p.lft), FT), 9);

    return { rHand: rHand, lHand: lHand, headC: headC };
  }

  /* ---------- fotogramas clave del PITCHER (mira a la derecha) ---------- */
  var P_SET    = { x: 0,  y: 0,  torso: 88, ht: 0,  ruA: -55, rfA: 65,  luA: -125, lfA: 55,   rtA: -95,  rsA: -90,  rft: 5,   ltA: -85,  lsA: -90, lft: 5 };
  var P_LIFT   = { x: 2,  y: -6, torso: 93, ht: 0,  ruA: -50, rfA: 70,  luA: -128, lfA: 60,   rtA: -93,  rsA: -88,  rft: 5,   ltA: 40,   lsA: -70, lft: -50 };
  var P_STRIDE = { x: 30, y: 13, torso: 78, ht: 12, ruA: 150, rfA: 78,  luA: 15,   lfA: 5,    rtA: -122, rsA: -115, rft: 175, ltA: -50,  lsA: -60, lft: 5 };
  var P_REL    = { x: 62, y: 6,  torso: 62, ht: 26, ruA: 38,  rfA: 22,  luA: -115, lfA: -160, rtA: -150, rsA: 165,  rft: 175, ltA: -60,  lsA: -85, lft: 0 };
  var P_FOL    = { x: 75, y: 10, torso: 45, ht: 32, ruA: -55, rfA: -75, luA: -120, lfA: -150, rtA: -165, rsA: 150,  rft: 170, ltA: -62,  lsA: -85, lft: 0 };
  var PITCH_F = [
    [0, P_SET], [0.55, P_SET, "io"], [1.0, P_LIFT, "io"],
    [1.38, P_STRIDE, "io"], [1.60, P_REL, "out"], [2.05, P_FOL, "out"], [99, P_FOL, "lin"]
  ];

  /* ---------- fotogramas clave del BATEADOR (mira a la izquierda) ---------- */
  var B_ST  = { x: 0,   y: 4, torso: 92, ruA: 35,  rfA: 115, luA: 25,  lfA: 122, rtA: -65, rsA: -92,  rft: 178, ltA: -112, lsA: -86, lft: 182, bat: 118 };
  var B_LD  = { x: 8,   y: 4, torso: 96, ruA: 22,  rfA: 103, luA: 12,  lfA: 112, rtA: -62, rsA: -94,  rft: 178, ltA: -118, lsA: -84, lft: 182, bat: 100 };
  var B_CT  = { x: -10, y: 2, torso: 80, ruA: 196, rfA: 186, luA: 190, lfA: 182, rtA: -45, rsA: -112, rft: 95,  ltA: -108, lsA: -88, lft: 182, bat: 184 };
  var B_FOL = { x: -14, y: 3, torso: 88, ruA: 128, rfA: 80,  luA: 118, lfA: 72,  rtA: -42, rsA: -115, rft: 95,  ltA: -106, lsA: -88, lft: 182, bat: 55 };
  var BAT_F = [
    [0, B_ST], [3.18, B_ST, "lin"], [3.50, B_LD, "io"],
    [3.70, B_CT, "in"], [4.10, B_FOL, "out"], [99, B_FOL, "lin"]
  ];

  /* ---------- escena ---------- */
  var BX = 2600;                       /* posición del bateador en el mundo */
  var REL = [134, -64], T_REL = 1.60;  /* punto y tiempo de salida de la bola */
  var CP = [BX - 105, -42], T_HIT = 3.70; /* punto y tiempo del batazo */
  var GROUND = 78;

  function ballPos(t) {
    if (t >= T_REL && t <= T_HIT) {
      var u = (t - T_REL) / (T_HIT - T_REL);
      return [lerp(REL[0], CP[0], u),
              lerp(REL[1], CP[1], u) + 10 * Math.sin(u * Math.PI)];
    }
    if (t > T_HIT && t < T_HIT + 0.9) {
      var dt = t - T_HIT;
      return [CP[0] - 1500 * dt, CP[1] - 700 * dt + 420 * dt * dt];
    }
    return null;
  }

  function renderFrame(ctx, W, H, tAbs) {
    var t = tAbs % LOOP;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    /* lienzo lógico 800x450 escalado tipo "cover" */
    var s = Math.max(W / 800, H / 470);
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.translate(-400, -225);

    /* ---- cámara ---- */
    var C0 = -255, C1 = BX - 540;
    var ball = ballPos(t);
    var flightU = clamp01((t - T_REL) / (T_HIT - T_REL));
    var followX = lerp(REL[0], CP[0], flightU) - 380;
    var f1 = ss(T_REL - 0.02, T_REL + 0.4, t);
    var f2 = ss(3.05, 3.5, t);
    var camX = lerp(lerp(C0, followX, f1), C1, f2);

    /* sacudida de cámara en el batazo */
    var shx = 0, shy = 0;
    if (t > T_HIT && t < T_HIT + 0.35) {
      var k = 1 - (t - T_HIT) / 0.35;
      shx = Math.sin(t * 200) * 5 * k;
      shy = Math.cos(t * 173) * 4 * k;
    }
    ctx.translate(-camX + shx, 237 + shy);

    /* ---- suelo ---- */
    ctx.strokeStyle = "#fff";
    ctx.lineCap = "butt";
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(camX - 60, GROUND);
    ctx.lineTo(camX + 880, GROUND);
    ctx.stroke();
    /* marcas que pasan para sentir la velocidad */
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    var tick0 = Math.floor((camX - 60) / 140) * 140;
    for (var tx = tick0; tx < camX + 900; tx += 140) {
      ctx.beginPath();
      ctx.moveTo(tx, GROUND + 4);
      ctx.lineTo(tx, GROUND + 12);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* montículo del pitcher */
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(-75, GROUND);
    ctx.quadraticCurveTo(28, GROUND - 30, 130, GROUND);
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* home plate */
    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 0.9;
    ctx.fillRect(BX - 120, GROUND + 3, 34, 6);
    ctx.globalAlpha = 1;

    /* ---- pitcher ---- */
    var pp = poseAt(t, PITCH_F);
    drawFigure(ctx, pp, 1);

    /* ---- bateador ---- */
    var bp = poseAt(t, BAT_F);
    var bpose = {};
    for (var k in bp) bpose[k] = bp[k];
    bpose.x += BX;
    var bj = drawFigure(ctx, bpose, -1);
    /* bate desde las manos */
    var hands = [(bj.rHand[0] + bj.lHand[0]) / 2, (bj.rHand[1] + bj.lHand[1]) / 2];
    var bd = dirv(bp.bat);
    ctx.lineCap = "round";
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(hands[0] - bd[0] * 8, hands[1] - bd[1] * 8);
    ctx.lineTo(hands[0] + bd[0] * 58, hands[1] + bd[1] * 58);
    ctx.stroke();

    /* ---- bola + estela ---- */
    if (ball) {
      var prev = ballPos(Math.max(t - 0.05, T_REL + 0.001));
      if (t > T_HIT) prev = ballPos(Math.max(t - 0.05, T_HIT + 0.001));
      if (prev) {
        var dx = ball[0] - prev[0], dy = ball[1] - prev[1];
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var trail = Math.min(150, len * 2.2);
        var ex = ball[0] - dx / len * trail, ey = ball[1] - dy / len * trail;
        var g = ctx.createLinearGradient(ball[0], ball[1], ex, ey);
        g.addColorStop(0, "rgba(255,255,255,0.85)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = g;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(ball[0], ball[1]);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.strokeStyle = "#fff";
      }
      ctx.beginPath();
      ctx.arc(ball[0], ball[1], 7, 0, 7);
      ctx.fill();
    }

    /* ---- destello del impacto ---- */
    if (t > T_HIT && t < T_HIT + 0.2) {
      var ku = (t - T_HIT) / 0.2;
      ctx.globalAlpha = 1 - ku;
      ctx.lineWidth = 3;
      for (var i = 0; i < 8; i++) {
        var a = i * 45 * D2R + 0.4;
        var r1 = 14 + 26 * ku, r2 = r1 + 16;
        ctx.beginPath();
        ctx.moveTo(CP[0] + Math.cos(a) * r1, CP[1] + Math.sin(a) * r1);
        ctx.lineTo(CP[0] + Math.cos(a) * r2, CP[1] + Math.sin(a) * r2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    /* ---- fundido en los bordes del bucle ---- */
    var fade = Math.max(ss(LOOP - 0.35, LOOP, t), 1 - ss(0, 0.25, t));
    if (fade > 0.001) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = fade;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  return { renderFrame: renderFrame, LOOP: LOOP };
})();
/*ANIM-END*/

(function () {
  "use strict";

  var canvas = document.getElementById("baseball-canvas");
  var ctx = canvas.getContext("2d");
  var raf = null;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.floor(canvas.clientWidth * dpr);
    var h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }
  window.addEventListener("resize", resize);

  var t0 = performance.now();
  function frame(now) {
    resize();
    BB.renderFrame(ctx, canvas.width, canvas.height, (now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  /* ---------- API + progreso simulado ---------- */
  var loaderEl = document.getElementById("baseball-loader");
  var percentEl = document.getElementById("bb-percent");
  var progress = 0, autoTimer = null, manualMode = false;

  function render(p) { percentEl.textContent = Math.round(p) + "%"; }

  function autoTick() {
    var step = progress < 70 ? 1.4 : progress < 90 ? 0.7 : 0.35;
    progress = Math.min(progress + step, 100);
    render(progress);
    if (progress >= 100) {
      clearInterval(autoTimer);
      setTimeout(hide, 600);
    }
  }
  function startAuto() {
    manualMode = false;
    clearInterval(autoTimer);
    progress = 0;
    render(0);
    autoTimer = setInterval(autoTick, 60);
  }
  function hide() {
    clearInterval(autoTimer);
    loaderEl.classList.add("hidden");
    setTimeout(function () { if (raf) cancelAnimationFrame(raf); raf = null; }, 1100);
  }
  function replay() {
    loaderEl.classList.remove("hidden");
    if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(frame); }
    startAuto();
  }

  window.BaseballLoader = {
    hide: hide,
    replay: replay,
    setProgress: function (p) {
      if (!manualMode) { manualMode = true; clearInterval(autoTimer); }
      progress = Math.max(0, Math.min(100, p));
      render(progress);
      if (progress >= 100) setTimeout(hide, 600);
    }
  };

  startAuto();
})();
</script>
</body>
</html>
